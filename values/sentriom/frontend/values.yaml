fullnameOverride: sentriomclient
replicaCount: 1
revisionHistoryLimit: 2
containerPort: 80
service:
  type: ClusterIP
  port: 80
ingress:
  path: /sentriom
  pathType: Prefix
  healthcheckPath: /health
  alb:
    groupOrder: "34"
    rewrite:
      enabled: true
      regex: "^/sentriom/(.*)$"
      replace: "/$1"
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: sentriomclient
          topologyKey: kubernetes.io/hostname
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
autoscaling:
  enabled: false
