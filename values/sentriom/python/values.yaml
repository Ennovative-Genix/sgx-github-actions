fullnameOverride: sentriompython
replicaCount: 1
revisionHistoryLimit: 2
containerPort: 8001
envFrom:
  secret: sentriompython-secret
env:
  - name: APP_NAME
    value: "sentriom-orchestrator"
  - name: ROOT_PATH
    value: "/ai-foundry"
  - name: LOG_LEVEL
    value: "INFO"
  - name: MILVUS_KB_COLLECTION_NAME
    value: "sentriom_kb_vector"
service:
  type: ClusterIP
  port: 8001
ingress:
  path: /api/sentriom/ai
  pathType: Prefix
  alb:
    groupOrder: "15"
    rewrite:
      enabled: true
      regex: "^/api/sentriom/ai/(.*)$"
      replace: "/$1"
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: sentriompython
          topologyKey: kubernetes.io/hostname
readinessProbe:
  httpGet:
    path: /health
    port: 8001
  initialDelaySeconds: 60
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: 8001
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
