fullnameOverride: vistanestjs
replicaCount: 1
revisionHistoryLimit: 2
containerPort: 3000
envFrom:
  secret: vistanestjs-secret
service:
  type: ClusterIP
  port: 3000
ingress:
  path: /api/vista/service
  pathType: Prefix
  alb:
    groupOrder: "20"
    rewrite:
      enabled: true
      regex: "^/api/vista/service/(.*)$"
      replace: "/$1"
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi
readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
