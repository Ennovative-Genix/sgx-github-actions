# Vista MySQL (chart: charts/mysql). Deployed once per environment by vista-monorepo mysql.yml.
# Same names as the previous k8s/mysql manifest: pod label vistamysql, Service mysql.
fullnameOverride: vistamysql

secretName: vistamysql-secret

# Overlay replaces the chart args list; keep charset/collation.
# mysql:8.0 with bind_address=* listens on IPv6 :: only; NestJS uses IPv4 ClusterIP.
args:
  - --character-set-server=utf8mb4
  - --collation-server=utf8mb4_unicode_ci
  - --bind-address=0.0.0.0

service:
  # Vista apps use DB_HOST=mysql.
  name: mysql

persistence:
  # gp3 must exist as a StorageClass in the cluster (kubectl get sc).
  storageClass: gp3
  size: 20Gi
