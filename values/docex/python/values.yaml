fullnameOverride: docexpython
replicaCount: 1
revisionHistoryLimit: 2
containerPort: 5001
envFrom:
  secret: docexpython-secret
service:
  type: ClusterIP
  port: 5001
ingress:
  path: /api/docex/ai
  pathType: Prefix
  alb:
    groupOrder: "13"
    rewrite:
      enabled: true
      regex: "^/api/docex/ai/(.*)$"
      replace: "/$1"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1000Mi
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: docexpython
          topologyKey: kubernetes.io/hostname
readinessProbe:
  httpGet:
    path: /health
    port: 5001
  initialDelaySeconds: 60
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: 5001
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
