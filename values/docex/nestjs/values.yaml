fullnameOverride: docexnestjs
replicaCount: 1
revisionHistoryLimit: 2
containerPort: 3001
imagePullSecrets:
  - name: ecr-secret
envFrom:
  secret: docexnestjs-secret
  configMap: docexnestjs-config
service:
  type: ClusterIP
  port: 3001
ingress:
  path: /api/docex/service
  pathType: Prefix
  alb:
    groupOrder: "11"
    rewrite:
      enabled: true
      regex: "^/api/docex/service/(.*)$"
      replace: "/$1"
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: docexnestjs
          topologyKey: kubernetes.io/hostname
readinessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: 3001
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
