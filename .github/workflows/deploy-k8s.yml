on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, preprod, prod)"
        required: true
        type: string
      env_region:
        description: "AWS region for this environment (EKS)"
        required: true
        type: string
      docker_image_name:
        description: "Docker image name (default deployment/container name)"
        required: true
        type: string
      image:
        description: "Fully-qualified ECR image reference to deploy (repo@sha256:...), from build-ecr.yml"
        required: true
        type: string
      deployment_name:
        description: "Kubernetes Deployment name. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      container_name:
        description: "Container name within the Deployment to update. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      manifest_path:
        description: "Path (in the consumer repo) to a kustomize dir or plain manifests. Auto-detected if empty."
        required: false
        type: string
        default: ""
      namespace:
        description: "Kubernetes namespace. Defaults to the environment name."
        required: false
        type: string
        default: ""
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication (needs eks:DescribeCluster + an EKS access entry)"
        required: true

jobs:
  deploy:
    name: Deploy to Kubernetes (EKS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      AWS_REGION: ${{ inputs.env_region }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      # Bastion used for SSM port-forward into the private EKS API (GitHub-hosted runners are outside the VPC).
      EKS_BASTION_INSTANCE_ID: ${{ vars.EKS_BASTION_INSTANCE_ID }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      NAMESPACE: ${{ inputs.namespace != '' && inputs.namespace || inputs.environment }}
      DEPLOYMENT_NAME: ${{ inputs.deployment_name != '' && inputs.deployment_name || inputs.docker_image_name }}
      CONTAINER_NAME: ${{ inputs.container_name != '' && inputs.container_name || inputs.docker_image_name }}
      MANIFEST_PATH_INPUT: ${{ inputs.manifest_path }}
      # Local end of the SSM tunnel (remote side always targets EKS :443).
      EKS_TUNNEL_LOCAL_PORT: '8443'

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ inputs.env_region }}
          role-session-name: GitHubActions-Deploy-K8s-${{ github.run_id }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      # ── Private EKS access: SSM tunnel via bastion (BEFORE update-kubeconfig) ──
      - name: Start SSM tunnel to private EKS API
        run: |
          set -euo pipefail

          [ -n "$EKS_CLUSTER_NAME" ] || { echo "::error::vars.EKS_CLUSTER_NAME is not set for environment '${ENVIRONMENT}'"; exit 1; }
          [ -n "$EKS_BASTION_INSTANCE_ID" ] || { echo "::error::vars.EKS_BASTION_INSTANCE_ID is not set for environment '${ENVIRONMENT}'"; exit 1; }

          # a) Install Session Manager plugin (.deb) on the Ubuntu runner
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

          # Resolve private API hostname from the cluster (no hardcoded endpoint needed)
          EKS_API_URL="$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.endpoint' --output text)"
          EKS_API_HOST="${EKS_API_URL#https://}"
          EKS_API_HOST="${EKS_API_HOST%%:*}"
          [ -n "$EKS_API_HOST" ] && [ "$EKS_API_HOST" != "None" ] \
            || { echo "::error::Could not resolve EKS API endpoint for cluster '${EKS_CLUSTER_NAME}'"; exit 1; }

          echo "EKS_API_HOST=${EKS_API_HOST}" >> "$GITHUB_ENV"
          echo "Tunneling EKS API ${EKS_API_HOST}:443 → 127.0.0.1:${EKS_TUNNEL_LOCAL_PORT} via bastion ${EKS_BASTION_INSTANCE_ID}"

          # b) SSM port-forward (remote host = EKS API) in the background
          nohup aws ssm start-session \
            --target "$EKS_BASTION_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"${EKS_API_HOST}\"],\"portNumber\":[\"443\"],\"localPortNumber\":[\"${EKS_TUNNEL_LOCAL_PORT}\"]}" \
            >/tmp/ssm-eks-tunnel.log 2>&1 &
          echo $! > /tmp/ssm-eks-tunnel.pid

          # c) Wait until the local tunnel port accepts connections (avoid race with kubectl)
          echo "Waiting for SSM tunnel on 127.0.0.1:${EKS_TUNNEL_LOCAL_PORT}..."
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/"$EKS_TUNNEL_LOCAL_PORT") >/dev/null 2>&1; then
              echo "SSM tunnel is ready (attempt ${i})"
              exit 0
            fi
            # Fail fast if the background session already died
            if ! kill -0 "$(cat /tmp/ssm-eks-tunnel.pid)" 2>/dev/null; then
              echo "::error::SSM port-forward process exited before the tunnel became ready"
              cat /tmp/ssm-eks-tunnel.log || true
              exit 1
            fi
            sleep 1
          done

          echo "::error::Timed out waiting for SSM tunnel on port ${EKS_TUNNEL_LOCAL_PORT}"
          cat /tmp/ssm-eks-tunnel.log || true
          exit 1

      - name: Configure cluster access
        run: |
          set -euo pipefail
          [ -n "$EKS_CLUSTER_NAME" ] || { echo "::error::vars.EKS_CLUSTER_NAME is not set for environment '${ENVIRONMENT}'"; exit 1; }
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

          # Route kubectl through the SSM tunnel while keeping TLS hostname verification.
          # /etc/hosts → real EKS hostname resolves to loopback; kubeconfig uses :8443 (local tunnel).
          echo "127.0.0.1 ${EKS_API_HOST}" | sudo tee -a /etc/hosts >/dev/null
          CLUSTER_ARN="$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.arn' --output text)"
          kubectl config set-cluster "$CLUSTER_ARN" --server="https://${EKS_API_HOST}:${EKS_TUNNEL_LOCAL_PORT}"

          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"
          echo "Cluster: ${EKS_CLUSTER_NAME}  Namespace: ${NAMESPACE}"

      - name: Resolve manifest path
        id: manifests
        run: |
          set -euo pipefail
          MP="$MANIFEST_PATH_INPUT"
          if [ -z "$MP" ]; then
            if [ -f "k8s/overlays/${ENVIRONMENT}/kustomization.yaml" ] || [ -f "k8s/overlays/${ENVIRONMENT}/kustomization.yml" ]; then
              MP="k8s/overlays/${ENVIRONMENT}"
            else
              MP="k8s"
            fi
          fi
          [ -e "$MP" ] || { echo "::error::manifest path '$MP' not found in the consumer repo"; exit 1; }
          if [ -f "$MP/kustomization.yaml" ] || [ -f "$MP/kustomization.yml" ]; then
            echo "mode=kustomize" >> "$GITHUB_OUTPUT"
          else
            echo "mode=plain" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$MP" >> "$GITHUB_OUTPUT"
          echo "Using manifests at '$MP'"

      - name: Apply manifests and set image
        env:
          MP: ${{ steps.manifests.outputs.path }}
          MODE: ${{ steps.manifests.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "kustomize" ]; then
            kubectl apply -k "$MP" -n "$NAMESPACE"
          else
            kubectl apply -f "$MP" -n "$NAMESPACE"
          fi
          # Pin the specific container to the immutable digest we just built. Targeting
          # the named container (not '*') avoids clobbering sidecars in multi-container pods.
          kubectl set image "deployment/${DEPLOYMENT_NAME}" "${CONTAINER_NAME}=${IMAGE}" -n "$NAMESPACE"

      - name: Wait for rollout (auto-rollback on failure)
        run: |
          set -euo pipefail
          if kubectl rollout status "deployment/${DEPLOYMENT_NAME}" -n "$NAMESPACE" --timeout=300s; then
            echo "✓ Rollout complete for ${DEPLOYMENT_NAME} in ${NAMESPACE}"
            exit 0
          fi

          echo "::error::Rollout failed for ${DEPLOYMENT_NAME} in ${NAMESPACE}"
          echo "--- deployment ---"; kubectl describe "deployment/${DEPLOYMENT_NAME}" -n "$NAMESPACE" || true
          echo "--- pods ---"; kubectl get pods -n "$NAMESPACE" -o wide || true

          # Roll back to the previous revision if one exists (first deploy has none).
          REV_COUNT="$(kubectl rollout history "deployment/${DEPLOYMENT_NAME}" -n "$NAMESPACE" 2>/dev/null | grep -cE '^[0-9]+' || true)"
          if [ "${REV_COUNT:-0}" -gt 1 ]; then
            echo "Rolling back to the previous revision..."
            kubectl rollout undo "deployment/${DEPLOYMENT_NAME}" -n "$NAMESPACE"
            kubectl rollout status "deployment/${DEPLOYMENT_NAME}" -n "$NAMESPACE" --timeout=180s || true
          else
            echo "No previous revision to roll back to (first deploy) — leaving as-is for diagnosis."
          fi
          exit 1
