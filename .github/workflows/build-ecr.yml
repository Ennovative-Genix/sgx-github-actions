on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, staging, preprod, prod)"
        required: true
        type: string
      env_region:
        description: "AWS region for this environment (ECR)"
        required: true
        type: string
      docker_image_name:
        description: "Docker image name (used as the app name and default ECR repository)"
        required: true
        type: string
      app_path:
        description: "Path to the application directory containing the Dockerfile (relative to repo root). Defaults to root."
        required: false
        type: string
        default: "."
      docker_context:
        description: "Docker build context (relative to repo root). Defaults to app_path. Use '.' for Nx/monorepo Dockerfiles that COPY from the repo root."
        required: false
        type: string
        default: ""
      ecr_repository:
        description: "ECR repository name. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile path relative to repo root. Empty = <app_path>/Dockerfile."
        required: false
        type: string
        default: ""
      build_env:
        description: "Docker ARG ENV. Empty = environment."
        required: false
        type: string
        default: ""
      codeartifact_domain:
        description: "When set, mint a CodeArtifact token and pass secret id=codeartifact_token."
        required: false
        type: string
        default: ""
      codeartifact_domain_owner:
        description: "CodeArtifact domain owner account id."
        required: false
        type: string
        default: ""
      codeartifact_region:
        description: "CodeArtifact region (may differ from ECR env_region)."
        required: false
        type: string
        default: "ap-south-1"
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication (needs ECR push)"
        required: true
    outputs:
      image:
        description: "Fully-qualified ECR image reference pinned by digest (repo@sha256:...)"
        value: ${{ jobs.build-push.outputs.image }}
      digest:
        description: "Image digest (sha256:...)"
        value: ${{ jobs.build-push.outputs.digest }}
      registry:
        description: "ECR registry host (<account>.dkr.ecr.<region>.amazonaws.com)"
        value: ${{ jobs.build-push.outputs.registry }}

jobs:
  build-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      # ECR repository name (defaults to the image name).
      ECR_REPOSITORY: ${{ inputs.ecr_repository != '' && inputs.ecr_repository || inputs.docker_image_name }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest || steps.build-ca.outputs.digest }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      # - name: Free up disk space
      #   run: |
      #     sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
      #     df -h /

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ inputs.env_region }}
          role-session-name: GitHubActions-Build-ECR-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image tags
        id: meta
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          REPO_URI="${REGISTRY}/${ECR_REPOSITORY}"
          echo "repo_uri=${REPO_URI}" >> "$GITHUB_OUTPUT"
          # Immutable per-commit tag is the deploy handle; a moving <environment>
          # tag is kept for human convenience only (never deployed by digest).
          {
            echo "tags<<EOF"
            echo "${REPO_URI}:${GITHUB_SHA}"
            echo "${REPO_URI}:${{ inputs.environment }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get CodeArtifact authorization token
        if: ${{ inputs.codeartifact_domain != '' }}
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact_domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ inputs.codeartifact_domain_owner }}
          CODEARTIFACT_REGION: ${{ inputs.codeartifact_region }}
        run: |
          set -euo pipefail
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${CODEARTIFACT_DOMAIN}" \
            --domain-owner "${CODEARTIFACT_DOMAIN_OWNER}" \
            --region "${CODEARTIFACT_REGION}" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve Docker context
        id: docker
        env:
          APP_PATH: ${{ inputs.app_path }}
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ENV_INPUT: ${{ inputs.build_env }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Monorepos (Nx, etc.) keep Dockerfile under app_path but COPY from repo root.
          # Self-contained apps leave docker_context empty → context == app_path.
          CONTEXT="${DOCKER_CONTEXT:-$APP_PATH}"
          FILE="${DOCKERFILE:-${APP_PATH}/Dockerfile}"
          BUILD_ENV="${BUILD_ENV_INPUT:-$ENVIRONMENT}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Dockerfile not found: ${FILE}"
            exit 1
          fi
          echo "context=${CONTEXT}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "build_env=${BUILD_ENV}" >> "$GITHUB_OUTPUT"
          echo "Docker context='${CONTEXT}' file='${FILE}' ENV='${BUILD_ENV}'"

      - name: Build and push image
        id: build
        if: ${{ inputs.codeartifact_domain == '' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.docker.outputs.context }}
          file: ${{ steps.docker.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENV=${{ steps.docker.outputs.build_env }}
          # Single-platform, no provenance attestation → one clean manifest digest.
          provenance: false
          cache-from: type=gha,scope=${{ inputs.docker_image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.docker_image_name }}

      - name: Build and push image (CodeArtifact)
        id: build-ca
        if: ${{ inputs.codeartifact_domain != '' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.docker.outputs.context }}
          file: ${{ steps.docker.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENV=${{ steps.docker.outputs.build_env }}
          secrets: |
            codeartifact_token=${{ env.CODEARTIFACT_AUTH_TOKEN }}
          provenance: false
          cache-from: type=gha,scope=${{ inputs.docker_image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.docker_image_name }}

      - name: Emit digest-pinned image reference
        id: image
        env:
          REPO_URI: ${{ steps.meta.outputs.repo_uri }}
          DIGEST: ${{ steps.build.outputs.digest || steps.build-ca.outputs.digest }}
        run: |
          set -euo pipefail
          echo "image=${REPO_URI}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${REPO_URI}@${DIGEST}"
