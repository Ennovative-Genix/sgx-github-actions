name: Reusable K8s Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: true
        type: string

      env_region:
        description: AWS region (ECR + SSM)
        required: true
        type: string

      ecr_repository:
        description: "ECR repository name. Defaults to docker_image_name."
        required: false
        default: ""
        type: string

      docker_image_name:
        description: Application name
        required: true
        type: string

      deployment_name:
        description: Kubernetes deployment name
        required: false
        default: ""
        type: string

      container_name:
        description: Kubernetes container name
        required: false
        default: ""
        type: string

      namespace:
        description: Kubernetes namespace
        required: false
        default: ""
        type: string

      manifest_path:
        description: "Path (in the consumer repo) to a kustomize dir or plain manifests. Auto-detected if empty."
        required: false
        default: ""
        type: string

      k8s_api_host:
        description: Private IP of the kube-apiserver for SSM port forwarding
        required: true
        type: string

      aws_secret_arn:
        description: "ARN of the AWS Secrets Manager secret to sync into the namespace. Optional."
        required: false
        default: ""
        type: string

      k8s_secret_name:
        description: "Kubernetes Secret name to create/update. Must match the Deployment's envFrom.secretRef.name. Required when aws_secret_arn/AWS_SECRET_ARN is set."
        required: false
        default: ""
        type: string

      image:
        description: "Fully-qualified ECR image (repo@sha256:...) from build-ecr.yml. Used when deploy_method is helm."
        required: false
        default: ""
        type: string

      deploy_method:
        description: "helm or manifests"
        required: false
        default: "manifests"
        type: string

      product:
        required: false
        default: ""
        type: string

      service:
        required: false
        default: ""
        type: string

      chart:
        required: false
        default: "app"
        type: string

      charts_ref:
        required: false
        default: "k8s-helm"
        type: string

    secrets:
      AWS_SECRET_ARN:
        required: false

      IAM_ROLE_ARN:
        required: true

      DEV_KUBE_CONFIG:
        required: true

      K8S_INSTANCE_ID:
        required: true

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ inputs.env_region }}
      AWS_SECRET_ARN: ${{ inputs.aws_secret_arn != '' && inputs.aws_secret_arn || secrets.AWS_SECRET_ARN || vars.AWS_SECRET_ARN }}
      CONTAINER_NAME: ${{ inputs.container_name != '' && inputs.container_name || inputs.docker_image_name }}
      DEPLOYMENT_NAME: ${{ inputs.deployment_name != '' && inputs.deployment_name || inputs.docker_image_name }}
      DEV_KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}
      ECR_REPOSITORY: ${{ inputs.ecr_repository != '' && inputs.ecr_repository || inputs.docker_image_name }}
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      K8S_API_HOST: ${{ inputs.k8s_api_host != '' && inputs.k8s_api_host || vars.K8S_API_HOST || secrets.K8S_API_HOST }}
      K8S_INSTANCE_ID: ${{ secrets.K8S_INSTANCE_ID }}
      K8S_SECRET_NAME: ${{ inputs.k8s_secret_name }}
      K8S_TUNNEL_LOCAL_PORT: 8443
      MANIFEST_PATH_INPUT: ${{ inputs.manifest_path }}
      NAMESPACE: ${{ inputs.namespace != '' && inputs.namespace || inputs.environment }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      DEPLOY_METHOD: ${{ inputs.deploy_method }}
      PRODUCT: ${{ inputs.product }}
      SERVICE: ${{ inputs.service }}
      CHART: ${{ inputs.chart != '' && inputs.chart || 'app' }}
      CHARTS_REF: ${{ inputs.charts_ref != '' && inputs.charts_ref || 'k8s-helm' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify K8S_API_HOST is configured
        run: |
          if [ -z "${K8S_API_HOST}" ]; then
            echo "::error::K8S_API_HOST environment variable is required for SSM tunnel"
            exit 1
          fi

      - name: Start SSM tunnel to kube-apiserver
        run: |
          set -euo pipefail

          curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            -o /tmp/session-manager-plugin.deb

          sudo dpkg -i /tmp/session-manager-plugin.deb

          session-manager-plugin --version

          echo "Tunneling ${K8S_API_HOST}:6443 -> 127.0.0.1:${K8S_TUNNEL_LOCAL_PORT}"

          nohup aws ssm start-session \
            --target "$K8S_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"${K8S_API_HOST}\"],\"portNumber\":[\"6443\"],\"localPortNumber\":[\"${K8S_TUNNEL_LOCAL_PORT}\"]}" \
            >/tmp/ssm-k8s-tunnel.log 2>&1 &

          echo $! >/tmp/ssm-k8s-tunnel.pid

          echo "Waiting for SSM tunnel..."

          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/${K8S_TUNNEL_LOCAL_PORT}) >/dev/null 2>&1; then
              echo "Tunnel ready"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/ssm-k8s-tunnel.pid)" 2>/dev/null; then
              echo "::error::Tunnel process exited"
              cat /tmp/ssm-k8s-tunnel.log
              exit 1
            fi

            sleep 1
          done

          echo "::error::Timeout waiting for tunnel"
          cat /tmp/ssm-k8s-tunnel.log
          exit 1

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube

          echo "$DEV_KUBE_CONFIG" | base64 -d > ~/.kube/config

          chmod 600 ~/.kube/config

          CLUSTER_NAME=$(kubectl config view -o jsonpath='{.clusters[0].name}')
          if [ -z "${CLUSTER_NAME}" ]; then
            echo "::error::Could not determine cluster name from kubeconfig"
            exit 1
          fi

          kubectl config unset "clusters.${CLUSTER_NAME}.certificate-authority-data"

          kubectl config set-cluster "${CLUSTER_NAME}" \
            --server=https://127.0.0.1:${K8S_TUNNEL_LOCAL_PORT} \
            --insecure-skip-tls-verify=true

          kubectl config get-contexts
          kubectl config current-context

      - name: Verify Cluster Connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Ensure Namespace Exists
        run: |
          kubectl get namespace ${NAMESPACE} >/dev/null 2>&1 || \
          kubectl create namespace ${NAMESPACE}

      - name: Sync app secret from AWS Secrets Manager
        if: ${{ env.AWS_SECRET_ARN != '' }}
        run: |
          set -euo pipefail
          SECRET_ARN="$(printf '%s' "$AWS_SECRET_ARN" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          K8S_NAME="$(printf '%s' "${K8S_SECRET_NAME:-}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          # Expect: arn:aws:secretsmanager:REGION:ACCOUNT:secret:NAME
          if ! printf '%s' "$SECRET_ARN" | grep -Eq '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'; then
            echo "::error::AWS_SECRET_ARN must be a Secrets Manager ARN (got '${SECRET_ARN}')"
            exit 1
          fi

          SECRET_REGION="$(printf '%s' "$SECRET_ARN" | cut -d: -f4)"
          [ -n "$SECRET_REGION" ] || { echo "::error::Could not parse region from AWS_SECRET_ARN"; exit 1; }
          [ -n "$K8S_NAME" ] || { echo "::error::K8S_SECRET_NAME resolved empty"; exit 1; }

          command -v jq >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y jq; }

          echo "Syncing Secrets Manager ARN (region=${SECRET_REGION}) → Secret/${K8S_NAME} in namespace ${NAMESPACE}"
          SECRET_STRING="$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region "$SECRET_REGION" \
            --query SecretString \
            --output text)"

          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT

          # Support: (1) JSON object {"KEY":"val",...}  (2) dotenv / properties plaintext.
          # Never print secret values.
          if echo "$SECRET_STRING" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "$SECRET_STRING" | jq -r 'to_entries[] | "\(.key)=\(.value|tostring)"' > "$ENV_FILE"
            echo "SecretString format: JSON object"
          else
            # Strip BOM/CR, then normalize KEY:value (common in EC2/legacy secrets) → KEY=value.
            # Only the first separator after the key name is converted; values may contain ':' (URLs, ARNs).
            NORMALIZED="$(mktemp)"
            printf '%s\n' "$SECRET_STRING" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' | awk '
              /^[[:space:]]*$/ { next }
              /^[[:space:]]*#/ { next }
              # Already KEY=VALUE (keep as-is, trim leading space)
              /^[[:space:]]*[A-Za-z_][A-Za-z0-9_.-]*[[:space:]]*=/ {
                sub(/^[[:space:]]+/, "", $0)
                print
                next
              }
              # KEY: VALUE or KEY:VALUE → KEY=VALUE (legacy / Java-properties style)
              /^[[:space:]]*[A-Za-z_][A-Za-z0-9_.-]*[[:space:]]*:/ {
                sub(/^[[:space:]]+/, "", $0)
                # split on first colon only
                key = $0
                sub(/[[:space:]]*:.*$/, "", key)
                val = $0
                sub(/^[^:]*:[[:space:]]*/, "", val)
                print key "=" val
                next
              }
              {
                print "::warning::Skipping unrecognized secret line (need KEY=value or KEY: value)" > "/dev/stderr"
              }
            ' > "$NORMALIZED"
            mv "$NORMALIZED" "$ENV_FILE"

            if ! grep -Eq '^[A-Za-z_][A-Za-z0-9_.-]*=' "$ENV_FILE"; then
              echo "::error::SecretString must be a JSON object, or plaintext KEY=value / KEY: value lines (e.g. MONGO_URI=... or CLOUDWATCH_LOG_GROUP:/aws/...)."
              echo "::error::A single raw value with no key is not supported."
              exit 1
            fi
            echo "SecretString format: dotenv/properties plaintext (normalized to KEY=value)"
          fi

          KEY_COUNT="$(grep -cE '^[A-Za-z_][A-Za-z0-9_.-]*=' "$ENV_FILE" || true)"
          [ "$KEY_COUNT" -gt 0 ] || { echo "::error::No valid KEY=value entries after normalizing SecretString"; exit 1; }

          kubectl create secret generic "$K8S_NAME" \
            --namespace "$NAMESPACE" \
            --from-env-file="$ENV_FILE" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✓ Kubernetes Secret/${K8S_NAME} synced (${KEY_COUNT} key(s); values not logged)"

      - name: Checkout Helm charts and values
        if: ${{ inputs.deploy_method == 'helm' }}
        uses: actions/checkout@v4
        with:
          repository: Ennovative-Genix/sgx-github-actions
          ref: ${{ env.CHARTS_REF }}
          path: helm-src

      - name: Set up Helm
        if: ${{ inputs.deploy_method == 'helm' }}
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Adopt existing resources for Helm
        if: ${{ inputs.deploy_method == 'helm' }}
        env:
          RELEASE: ${{ env.DEPLOYMENT_NAME }}
        run: |
          set -euo pipefail
          adopt() {
            local kind="$1" name="$2"
            kubectl get "$kind" "$name" -n "$NAMESPACE" >/dev/null 2>&1 || return 0
            kubectl annotate "$kind" "$name" -n "$NAMESPACE" \
              meta.helm.sh/release-name="$RELEASE" \
              meta.helm.sh/release-namespace="$NAMESPACE" \
              --overwrite
            kubectl label "$kind" "$name" -n "$NAMESPACE" \
              app.kubernetes.io/managed-by=Helm \
              --overwrite
          }
          adopt deployment "$RELEASE"
          adopt service "$RELEASE"
          adopt ingress "$RELEASE"
          adopt hpa "$RELEASE"
          adopt pdb "$RELEASE"
          adopt configmap "${RELEASE}-config"

      - name: Helm upgrade
        if: ${{ inputs.deploy_method == 'helm' }}
        env:
          RELEASE: ${{ env.DEPLOYMENT_NAME }}
        run: |
          set -euo pipefail
          ENV_FILE="helm-src/environments/${ENVIRONMENT}.yaml"
          APP_FILE="helm-src/values/${PRODUCT}/${SERVICE}/values.yaml"
          OVERLAY="helm-src/values/${PRODUCT}/${SERVICE}/values-${ENVIRONMENT}.yaml"
          CHART_DIR="helm-src/charts/${CHART}"
          [ -d "$CHART_DIR" ] || { echo "::error::chart '$CHART_DIR' not found"; exit 1; }
          [ -f "$ENV_FILE" ] || { echo "::error::missing $ENV_FILE"; exit 1; }
          [ -f "$APP_FILE" ] || { echo "::error::missing $APP_FILE"; exit 1; }

          SET_IMAGE=()
          if [ -n "${IMAGE:-}" ]; then
            if [[ "$IMAGE" == *@sha256:* ]]; then
              SET_IMAGE=(--set "image.repository=${IMAGE%@*}" --set "image.digest=${IMAGE#*@}" --set "image.tag=")
            else
              SET_IMAGE=(--set "image.repository=${IMAGE%:*}" --set "image.tag=${IMAGE##*:}" --set "image.digest=")
            fi
          else
            SET_IMAGE=(--set "image.repository=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}" --set "image.tag=${{ github.sha }}")
          fi

          HELM_ARGS=(upgrade --install "$RELEASE" "$CHART_DIR"
            --namespace "$NAMESPACE" --create-namespace
            -f "$ENV_FILE" -f "$APP_FILE")
          if [ -f "$OVERLAY" ]; then
            HELM_ARGS+=(-f "$OVERLAY")
          fi
          HELM_ARGS+=(--atomic --wait --timeout 5m "${SET_IMAGE[@]}")
          echo "helm ${HELM_ARGS[*]}"
          helm "${HELM_ARGS[@]}"

      - name: Resolve manifest path
        if: ${{ inputs.deploy_method != 'helm' }}
        id: manifests
        run: |
          set -euo pipefail
          MP="$MANIFEST_PATH_INPUT"
          if [ -z "$MP" ]; then
            if [ -f "k8s/overlays/${ENVIRONMENT}/kustomization.yaml" ] || [ -f "k8s/overlays/${ENVIRONMENT}/kustomization.yml" ]; then
              MP="k8s/overlays/${ENVIRONMENT}"
            else
              MP="k8s"
            fi
          fi
          [ -e "$MP" ] || { echo "::error::manifest path '$MP' not found in the consumer repo"; exit 1; }
          if [ -f "$MP/kustomization.yaml" ] || [ -f "$MP/kustomization.yml" ]; then
            echo "mode=kustomize" >> "$GITHUB_OUTPUT"
          else
            echo "mode=plain" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$MP" >> "$GITHUB_OUTPUT"
          echo "Using manifests at '$MP'"
        env:
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Apply Kubernetes Manifests
        if: ${{ inputs.deploy_method != 'helm' }}
        env:
          MP: ${{ steps.manifests.outputs.path }}
          MODE: ${{ steps.manifests.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "kustomize" ]; then
            kubectl apply -k "$MP" -n "${NAMESPACE}"
          else
            kubectl apply -f "$MP" -n "${NAMESPACE}"
          fi

      - name: Check Resources
        run: |
          kubectl get deployments -n ${NAMESPACE}
          kubectl get svc -n ${NAMESPACE}
          kubectl get pods -n ${NAMESPACE}

      - name: Update Deployment Image
        if: ${{ inputs.deploy_method != 'helm' }}
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Updating deployment ${DEPLOYMENT_NAME}"
          echo "Container: ${CONTAINER_NAME}"
          echo "Image: ${IMAGE}"

          kubectl set image deployment/${DEPLOYMENT_NAME} \
            ${CONTAINER_NAME}=${IMAGE} \
            -n ${NAMESPACE}

          kubectl get deployment ${DEPLOYMENT_NAME} \
            -n ${NAMESPACE} \
            -o wide

      - name: Wait For Rollout
        if: ${{ inputs.deploy_method != 'helm' }}
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} \
            -n ${NAMESPACE} \
            --timeout=300s

      - name: Pod Status
        run: |
          kubectl get pods -n ${NAMESPACE}

      - name: Describe Pods
        if: failure()
        run: |
          kubectl describe pods -n ${NAMESPACE}
