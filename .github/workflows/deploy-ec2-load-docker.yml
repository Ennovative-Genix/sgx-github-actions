name: Deploy - EC2 Load Image

# Pulls the image tarball from S3 onto the instance and loads it into Docker.
# All instance access goes through SSM, so no inbound SSH is required.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      docker_image_name:
        description: "Docker image name."
        required: true
        type: string
      s3_path:
        description: "S3 key prefix to download from."
        required: true
        type: string
      image_key:
        description: "Exact S3 key to load. Leave empty to use '<s3_path>/latest.tar.gz'. Set this to roll back to a specific build."
        required: false
        type: string
        default: ""
      aws_region:
        description: "Region override. Defaults to the AWS_REGION environment variable on the target environment."
        required: false
        type: string
        default: ""
      prune_images:
        description: "Prune unused images on the instance before loading, to reclaim disk."
        required: false
        type: boolean
        default: true
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 30
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
      EC2_INSTANCE_ID:
        description: "Target EC2 Instance ID."
        required: true

permissions:
  contents: read

jobs:
  load-docker-image:
    name: Load Image onto EC2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@v2
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: ec2-load

      - name: Resolve source object
        id: source
        env:
          BUCKET: ${{ vars.S3_BUILD_BUCKET }}
          S3_PATH: ${{ inputs.s3_path }}
          IMAGE_KEY: ${{ inputs.image_key }}
        run: |
          set -euo pipefail

          if [ -z "$BUCKET" ]; then
            echo "::error title=Missing bucket::The S3_BUILD_BUCKET variable is not set on environment '${{ inputs.environment }}'."
            exit 1
          fi

          key="${IMAGE_KEY:-${S3_PATH%/}/latest.tar.gz}"
          echo "uri=s3://${BUCKET}/${key}" >> "$GITHUB_OUTPUT"
          echo "Loading from s3://${BUCKET}/${key}"

      - name: Prune unused images
        if: inputs.prune_images
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@v2
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Prune unused Docker images
          # Best effort: a full disk is worth reporting, but a prune that finds
          # nothing to remove must not fail the deployment.
          continue-on-error: "true"
          commands: docker image prune -f

      - name: Download image tarball to instance
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@v2
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Download image tarball from S3
          commands: |
            mkdir -p /var/tmp/${{ inputs.docker_image_name }}
            aws s3 cp ${{ steps.source.outputs.uri }} /var/tmp/${{ inputs.docker_image_name }}/${{ inputs.docker_image_name }}-latest.tar.gz --region ${{ steps.aws.outputs.region }}
            ls -lh /var/tmp/${{ inputs.docker_image_name }}/

      - name: Load image into Docker
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@v2
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Load image into Docker
          commands: gunzip -c /var/tmp/${{ inputs.docker_image_name }}/${{ inputs.docker_image_name }}-latest.tar.gz | docker load
