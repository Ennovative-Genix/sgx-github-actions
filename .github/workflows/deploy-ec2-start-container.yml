name: Deploy - EC2 Start Container

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      docker_image_name:
        description: "Docker image name. Also used as the working directory on the instance."
        required: true
        type: string
      port_mapping:
        description: "Host-to-container port mapping, e.g. '8080:8080'. Defaults to the PORT_MAPPING environment variable."
        required: false
        type: string
        default: ""
      app_path:
        description: "Path to the application directory, relative to the repository root."
        required: false
        type: string
        default: "."
      compose_file:
        description: "Compose file path, relative to app_path."
        required: false
        type: string
        default: "docker-compose.yml"
      aws_region:
        description: "Region override. Defaults to the AWS_REGION environment variable on the target environment."
        required: false
        type: string
        default: ""
      secrets_region:
        description: "Region holding the Secrets Manager secret. Only needed when secrets live in a different region from the workload."
        required: false
        type: string
        default: ""
      health_check_url:
        description: "URL curled on the instance after start-up. Leave empty to skip the check."
        required: false
        type: string
        default: ""
      health_check_retries:
        description: "How many times to retry the health check before failing the deployment."
        required: false
        type: number
        default: 10
      cleanup_tarball:
        description: "Delete the image tarball from the instance once the container is running."
        required: false
        type: boolean
        default: true
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 30
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
      EC2_INSTANCE_ID:
        description: "Target EC2 Instance ID."
        required: true
      AWS_SECRETS_ARN:
        description: "Secrets Manager ARN holding the .env contents."
        required: false

permissions:
  contents: read

jobs:
  start-container:
    name: Start Container on EC2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    env:
      REMOTE_DIR: /var/tmp/${{ inputs.docker_image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@main
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: ec2-start

      - name: Encode configuration files
        id: files
        env:
          APP_PATH: ${{ inputs.app_path }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
          AWS_SECRETS_ARN: ${{ secrets.AWS_SECRETS_ARN }}
          SECRETS_REGION: ${{ inputs.secrets_region != '' && inputs.secrets_region || steps.aws.outputs.region }}
        run: |
          set -euo pipefail

          compose_path="${APP_PATH%/}/${COMPOSE_FILE}"
          if [ ! -f "$compose_path" ]; then
            echo "::error title=Missing compose file::'$compose_path' was not found in the repository."
            exit 1
          fi

          # base64 keeps newlines and quoting intact across the SSM boundary.
          compose_b64="$(base64 -w0 "$compose_path")"
          echo "::add-mask::$compose_b64"
          echo "compose=$compose_b64" >> "$GITHUB_OUTPUT"

          if [ -n "$AWS_SECRETS_ARN" ]; then
            secret="$(aws secretsmanager get-secret-value \
              --secret-id "$AWS_SECRETS_ARN" \
              --region "$SECRETS_REGION" \
              --query SecretString \
              --output text)"

            env_b64="$(printf '%s' "$secret" | base64 -w0)"
            echo "::add-mask::$env_b64"
            echo "env=$env_b64" >> "$GITHUB_OUTPUT"
            echo "has-env=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-env=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env to instance
        if: steps.files.outputs.has-env == 'true'
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@main
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Write .env to instance
          commands: |
            mkdir -p ${{ env.REMOTE_DIR }}
            echo ${{ steps.files.outputs.env }} | base64 -d > ${{ env.REMOTE_DIR }}/.env
            chmod 600 ${{ env.REMOTE_DIR }}/.env

      - name: Write compose file to instance
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@main
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Write compose file to instance
          commands: |
            mkdir -p ${{ env.REMOTE_DIR }}
            echo ${{ steps.files.outputs.compose }} | base64 -d > ${{ env.REMOTE_DIR }}/docker-compose.yml

      - name: Stop existing container
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@main
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Stop existing container
          # Nothing here is fatal on a first deployment, where there is no
          # previous container to bring down.
          continue-on-error: "true"
          commands: |
            cd ${{ env.REMOTE_DIR }} && docker compose down || true
            docker rm -f ${{ inputs.docker_image_name }} || true

      - name: Start container
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@main
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Start container
          working-directory: ${{ env.REMOTE_DIR }}
          commands: |
            PORT_MAPPING=${{ inputs.port_mapping != '' && inputs.port_mapping || vars.PORT_MAPPING }} IMAGE_NAME=${{ inputs.docker_image_name }} AWS_REGION=${{ steps.aws.outputs.region }} CLOUDWATCH_LOG_GROUP=${{ vars.CLOUDWATCH_LOG_GROUP }} CLOUDWATCH_LOG_STREAM=${{ vars.CLOUDWATCH_LOG_STREAM }} docker compose up -d
            docker compose ps

      - name: Health check
        if: inputs.health_check_url != ''
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@main
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Health check
          commands: |
            for attempt in $(seq 1 ${{ inputs.health_check_retries }}); do if curl -fsS --max-time 10 "${{ inputs.health_check_url }}" >/dev/null; then echo "healthy after $attempt attempt(s)"; exit 0; fi; echo "attempt $attempt failed, retrying"; sleep 5; done; echo "health check never passed"; docker logs --tail 100 ${{ inputs.docker_image_name }} || true; exit 1

      - name: Remove image tarball
        if: inputs.cleanup_tarball
        uses: Ennovative-Genix/sgx-github-actions/actions/ssm-exec@main
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          region: ${{ steps.aws.outputs.region }}
          step-name: Remove image tarball
          continue-on-error: "true"
          commands: rm -f ${{ env.REMOTE_DIR }}/${{ inputs.docker_image_name }}-latest.tar.gz
