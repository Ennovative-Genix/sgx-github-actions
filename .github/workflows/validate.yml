name: Validate

# Self-CI for this repository. A broken workflow here breaks every consumer, so
# nothing merges without passing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.7"

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" | tar -xz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint
          actionlint --version

      - name: Run actionlint
        # actionlint shells out to shellcheck for every `run:` block.
        run: actionlint -color

      - name: Run shellcheck on standalone scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*')

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          printf 'Checking %s script(s)\n' "${#scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Validate YAML syntax
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          failures = []
          roots = [pathlib.Path(".github/workflows"), pathlib.Path("actions")]

          for root in roots:
              for path in sorted(root.rglob("*.y*ml")):
                  try:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
                  except yaml.YAMLError as error:
                      failures.append(f"{path}: {error}")

          for failure in failures:
              print(f"::error::{failure}")

          print(f"Checked YAML under {', '.join(str(r) for r in roots)}.")
          sys.exit(1 if failures else 0)
          PY

  refs:
    name: Check internal references
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify every internal action reference resolves and agrees
        run: bash scripts/check-internal-refs.sh

      - name: Verify no call chain exceeds GitHub's nesting limit
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python scripts/check-nesting-depth.py

  contracts:
    name: Check documented contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Entry-point input tables must match the workflows
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python scripts/check-documented-inputs.py

      - name: Every reusable workflow and action must be documented
        run: |
          set -euo pipefail

          missing=0

          # A workflow nobody can find is a workflow nobody reuses, which is how
          # duplicate copies start appearing in application repositories.
          for file in .github/workflows/*.yml; do
            name="$(basename "$file")"

            # Repository-internal workflows are not part of the public surface.
            case "$name" in
              validate.yml | release.yml) continue ;;
            esac

            if ! grep -q "workflow_call" "$file"; then
              continue
            fi

            if ! grep -rq "$name" README.md docs/; then
              echo "::error file=$file::'$name' is a reusable workflow but is not mentioned in README.md or docs/."
              missing=1
            fi
          done

          for dir in actions/*/; do
            name="$(basename "$dir")"
            if ! grep -rq "actions/${name}" README.md docs/; then
              echo "::error file=${dir}action.yml::Composite action '${name}' is not mentioned in README.md or docs/."
              missing=1
            fi
          done

          exit "$missing"
