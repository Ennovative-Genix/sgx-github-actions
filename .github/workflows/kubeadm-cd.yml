on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, uat, stg, prod)"
        required: true
        type: string

      image:
        description: "Full ECR image URI"
        required: false
        type: string

      docker_image_name:
        description: "Application name"
        required: true
        type: string

      deployment_name:
        description: "Kubernetes deployment name"
        required: false
        type: string
        default: ""

      container_name:
        description: "Container name"
        required: false
        type: string
        default: ""

      namespace:
        description: "Kubernetes namespace"
        required: false
        type: string
        default: ""

      manifest_path:
        description: "Manifest path"
        required: false
        type: string
        default: "k8s"

      repo_path:
        description: "Application path on Kubeadm master"
        required: true
        type: string

      git_branch:
        description: "Git branch to deploy"
        required: true
        type: string

    secrets:
      IAM_ROLE_ARN:
        required: true

      EC2_INSTANCE_ID:
        required: false

jobs:
  deploy:
    name: Deploy to Kubeadm Cluster
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    env:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      EC2_INSTANCE_ID: i-0c71a2333426f13ed     #need to remove later

      AWS_REGION: ${{ startsWith(github.ref_name, 'release/') && 'us-east-1'
        || (github.ref_name == 'main') && 'us-east-1'
        || (github.ref_name == 'staging') && 'us-east-1'
        || 'ap-south-1' }}

      NAMESPACE: ${{ inputs.namespace != '' && inputs.namespace || inputs.environment }}

      DEPLOYMENT_NAME: ${{ inputs.deployment_name != '' && inputs.deployment_name || inputs.docker_image_name }}

      CONTAINER_NAME: ${{ inputs.container_name != '' && inputs.container_name || inputs.docker_image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout sgx-github-actions workflow repository
        uses: actions/checkout@v4
        with:
          repository: Ennovative-Genix/sgx-github-actions
          ref: main
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: workflow-repo

      - name: Make poll script executable
        run: chmod +x workflow-repo/.github/scripts/poll-ssm-command.sh

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Kubeadm-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c

      - name: Verify Cluster Connectivity
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "whoami",
              "echo HOME=$HOME",
              "echo KUBECONFIG=$KUBECONFIG",
              "pwd",
              "ls -la ~/.kube || true",
              "kubectl config current-context || true",
              "kubectl get nodes"
            ]' \
            --region "${{ env.AWS_REGION }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          sleep 10

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}"


