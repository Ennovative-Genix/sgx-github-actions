name: Publish - Maven

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment providing the CodeArtifact variables and approval rules."
        required: true
        type: string
      app_path:
        description: "Path to the module directory, relative to the repository root."
        required: false
        type: string
        default: "."
      java_version:
        description: "JDK version used to build and publish."
        required: false
        type: string
        default: "21"
      distribution:
        description: "JDK distribution, as accepted by actions/setup-java."
        required: false
        type: string
        default: "temurin"
      build_tool:
        description: "maven or gradle."
        required: false
        type: string
        default: "maven"
      version:
        description: "Version to publish. Leave empty to publish the version already in the build file."
        required: false
        type: string
        default: ""
      version_strategy:
        description: "Passed to compute-version when `version` is empty: auto, tag, manifest or run-number."
        required: false
        type: string
        default: "auto"
      run_test:
        description: "Run tests before publishing."
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Build and verify but do not deploy."
        required: false
        type: boolean
        default: false
      aws_region:
        description: "Region of the CodeArtifact domain. Falls back to the AWS_REGION environment variable."
        required: false
        type: string
        default: ""
      codeartifact_domain:
        description: "CodeArtifact domain to publish into."
        required: true
        type: string
      codeartifact_repository:
        description: "CodeArtifact repository to publish into."
        required: true
        type: string
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 45
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM role for OIDC."
        required: true
    outputs:
      version:
        description: "The version that was published."
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish Maven
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@main
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: publish-maven

      - name: Compute version
        id: version
        uses: Ennovative-Genix/sgx-github-actions/actions/compute-version@main
        with:
          strategy: ${{ inputs.version_strategy }}
          working-directory: ${{ inputs.app_path }}
          environment: ${{ inputs.environment }}
          version-override: ${{ inputs.version }}

      - name: Setup JDK
        uses: Ennovative-Genix/sgx-github-actions/actions/setup-java@main
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.distribution }}
          build-tool: ${{ inputs.build_tool }}
          working-directory: ${{ inputs.app_path }}
          codeartifact-domain: ${{ inputs.codeartifact_domain }}
          codeartifact-repository: ${{ inputs.codeartifact_repository }}
          codeartifact-domain-owner: ${{ inputs.codeartifact_domain_owner }}
          codeartifact-region: ${{ steps.aws.outputs.region }}

      - name: Set project version
        working-directory: ${{ inputs.app_path }}
        env:
          BUILD_TOOL: ${{ inputs.build_tool }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$BUILD_TOOL" = "maven" ]; then
            mvn --batch-mode --no-transfer-progress \
              versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          else
            echo "Gradle reads the version from -Pversion at publish time."
          fi

      - name: Publish
        working-directory: ${{ inputs.app_path }}
        env:
          BUILD_TOOL: ${{ inputs.build_tool }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_TEST: ${{ inputs.run_test }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$BUILD_TOOL" = "gradle" ]; then
            args=(--no-daemon -Pversion="$VERSION")
            [ "$RUN_TEST" = "true" ] || args+=(-x test)

            if [ "$DRY_RUN" = "true" ]; then
              ./gradlew "${args[@]}" build
            else
              ./gradlew "${args[@]}" publish
            fi
          else
            args=(--batch-mode --no-transfer-progress)
            [ "$RUN_TEST" = "true" ] || args+=(-DskipTests)

            if [ "$DRY_RUN" = "true" ]; then
              mvn "${args[@]}" verify
            else
              # altDeploymentRepository means consuming poms do not need a
              # <distributionManagement> block pointing at CodeArtifact.
              mvn "${args[@]}" deploy \
                -DaltDeploymentRepository="codeartifact::default::${CODEARTIFACT_URL}"
            fi
          fi

          {
            echo "### Java artifact published"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Build tool: \`${BUILD_TOOL}\`"
            echo "- Repository: \`${{ inputs.codeartifact_domain }}/${{ inputs.codeartifact_repository }}\`"
            echo "- Dry run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
