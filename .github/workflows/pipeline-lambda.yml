name: Pipeline - Lambda

# Container-image Lambda: build into ECR, then repoint the function at the new
# image and move the alias.
#
# For zip-packaged functions, call ci-node.yml / ci-python.yml to produce the
# artifact and then deploy-lambda.yml directly with `artifact_name`.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      function_name:
        description: "Lambda function name or ARN."
        required: true
        type: string
      ecr_repository:
        description: "ECR repository name."
        required: true
        type: string
      app_path:
        description: "Path to the application directory, relative to the repository root."
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to app_path."
        required: false
        type: string
        default: "Dockerfile"
      build_args:
        description: "Extra build arguments, one KEY=value per line."
        required: false
        type: string
        default: ""
      platforms:
        description: "Must match the function's architecture: linux/amd64 for x86_64, linux/arm64 for Graviton."
        required: false
        type: string
        default: "linux/amd64"
      alias:
        description: "Alias to point at the new version, e.g. 'live'. Leave empty to skip."
        required: false
        type: string
        default: ""
      aws_region:
        description: "Region override. Falls back to the AWS_REGION environment variable."
        required: false
        type: string
        default: ""
      version_strategy:
        description: "Passed to compute-version: auto, tag, manifest or run-number."
        required: false
        type: string
        default: "auto"
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
    outputs:
      function_version:
        description: "Published Lambda version. Pass this to rollback-lambda.yml."
        value: ${{ jobs.deploy.outputs.function_version }}
      previous_version:
        description: "Version the alias pointed at before this run."
        value: ${{ jobs.deploy.outputs.previous_version }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-docker-ecr.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ inputs.environment }}
      ecr_repository: ${{ inputs.ecr_repository }}
      app_path: ${{ inputs.app_path }}
      dockerfile: ${{ inputs.dockerfile }}
      build_args: ${{ inputs.build_args }}
      platforms: ${{ inputs.platforms }}
      aws_region: ${{ inputs.aws_region }}
      version_strategy: ${{ inputs.version_strategy }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/deploy-lambda.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ inputs.environment }}
      function_name: ${{ inputs.function_name }}
      package_type: image
      image_uri: ${{ needs.build.outputs.image_uri }}
      alias: ${{ inputs.alias }}
      aws_region: ${{ inputs.aws_region }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
