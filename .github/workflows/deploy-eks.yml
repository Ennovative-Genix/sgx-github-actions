name: Deploy - EKS

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      cluster_name:
        description: "EKS cluster name."
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace."
        required: false
        type: string
        default: "default"
      deploy_method:
        description: "kubectl (set image on an existing Deployment), kustomize, or helm."
        required: false
        type: string
        default: "kubectl"
      image_uri:
        description: "Fully qualified image reference to roll out. Prefer a digest reference for immutability."
        required: false
        type: string
        default: ""
      deployment_name:
        description: "Deployment to update. Required for the kubectl method."
        required: false
        type: string
        default: ""
      container_name:
        description: "Container inside the Deployment. Defaults to deployment_name."
        required: false
        type: string
        default: ""
      manifest_path:
        description: "Kustomize overlay directory. Required for the kustomize method."
        required: false
        type: string
        default: ""
      kustomize_image_name:
        description: "Image name as written in the manifests, which `kustomize edit set image` replaces with image_uri. Leave empty to apply the overlay exactly as committed."
        required: false
        type: string
        default: ""
      kustomize_version:
        description: "Pinned kustomize release used for the image substitution."
        required: false
        type: string
        default: "5.4.3"
      helm_chart_path:
        description: "Chart directory or reference. Required for the helm method."
        required: false
        type: string
        default: ""
      helm_release_name:
        description: "Helm release name."
        required: false
        type: string
        default: ""
      helm_values_file:
        description: "Values file passed to helm with -f."
        required: false
        type: string
        default: ""
      helm_extra_args:
        description: "Additional arguments appended to the helm command."
        required: false
        type: string
        default: ""
      rollout_timeout:
        description: "How long to wait for the rollout to become ready."
        required: false
        type: string
        default: "10m"
      kubectl_version:
        description: "kubectl version to install."
        required: false
        type: string
        default: "v1.31.0"
      aws_region:
        description: "Region override. Falls back to the AWS_REGION environment variable."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 30
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication. Must be mapped in the cluster's access entries or aws-auth ConfigMap."
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          DEPLOY_METHOD: ${{ inputs.deploy_method }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          HELM_CHART_PATH: ${{ inputs.helm_chart_path }}
          HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
        run: |
          set -euo pipefail

          # Failing here costs seconds. Failing after kubeconfig setup costs a
          # half-applied rollout.
          case "$DEPLOY_METHOD" in
            kubectl)
              [ -n "$IMAGE_URI" ] || { echo "::error::deploy_method 'kubectl' requires image_uri."; exit 1; }
              [ -n "$DEPLOYMENT_NAME" ] || { echo "::error::deploy_method 'kubectl' requires deployment_name."; exit 1; }
              ;;
            kustomize)
              [ -n "$MANIFEST_PATH" ] || { echo "::error::deploy_method 'kustomize' requires manifest_path."; exit 1; }
              ;;
            helm)
              [ -n "$HELM_CHART_PATH" ] || { echo "::error::deploy_method 'helm' requires helm_chart_path."; exit 1; }
              [ -n "$HELM_RELEASE_NAME" ] || { echo "::error::deploy_method 'helm' requires helm_release_name."; exit 1; }
              ;;
            *)
              echo "::error::deploy_method must be one of kubectl, kustomize, helm."
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@v2
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: deploy-eks

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ inputs.kubectl_version }}

      - name: Install Helm
        if: inputs.deploy_method == 'helm'
        uses: azure/setup-helm@v4

      - name: Install kustomize
        # `kubectl apply -k` can build an overlay, but rewriting the image tag
        # needs the standalone binary. Pinned rather than piped from a script.
        if: inputs.deploy_method == 'kustomize' && inputs.kustomize_image_name != ''
        env:
          KUSTOMIZE_VERSION: ${{ inputs.kustomize_version }}
        run: |
          set -euo pipefail
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz
          kustomize version

      - name: Update kubeconfig
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ steps.aws.outputs.region }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl version --client
          kubectl config current-context

      - name: Deploy
        env:
          DEPLOY_METHOD: ${{ inputs.deploy_method }}
          NAMESPACE: ${{ inputs.namespace }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          KUSTOMIZE_IMAGE_NAME: ${{ inputs.kustomize_image_name }}
          HELM_CHART_PATH: ${{ inputs.helm_chart_path }}
          HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
          HELM_VALUES_FILE: ${{ inputs.helm_values_file }}
          HELM_EXTRA_ARGS: ${{ inputs.helm_extra_args }}
          ROLLOUT_TIMEOUT: ${{ inputs.rollout_timeout }}
        run: |
          set -euo pipefail

          case "$DEPLOY_METHOD" in
            kubectl)
              container="${CONTAINER_NAME:-$DEPLOYMENT_NAME}"
              kubectl -n "$NAMESPACE" set image \
                "deployment/${DEPLOYMENT_NAME}" \
                "${container}=${IMAGE_URI}" \
                --record=false
              ;;

            kustomize)
              if [ -n "$KUSTOMIZE_IMAGE_NAME" ] && [ -n "$IMAGE_URI" ]; then
                (cd "$MANIFEST_PATH" && kustomize edit set image "${KUSTOMIZE_IMAGE_NAME}=${IMAGE_URI}")
                echo "Overlay image '${KUSTOMIZE_IMAGE_NAME}' pinned to ${IMAGE_URI}."
              fi
              kubectl -n "$NAMESPACE" apply -k "$MANIFEST_PATH"
              ;;

            helm)
              args=(upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH"
                    --namespace "$NAMESPACE" --create-namespace
                    --wait --timeout "$ROLLOUT_TIMEOUT" --atomic)

              [ -n "$HELM_VALUES_FILE" ] && args+=(-f "$HELM_VALUES_FILE")
              [ -n "$IMAGE_URI" ] && args+=(--set "image.repository=${IMAGE_URI%:*}" --set "image.tag=${IMAGE_URI##*:}")

              # shellcheck disable=SC2086
              helm "${args[@]}" $HELM_EXTRA_ARGS
              ;;
          esac

      - name: Wait for rollout
        # Helm --atomic already blocks on readiness and rolls itself back.
        if: inputs.deploy_method != 'helm' && inputs.deployment_name != ''
        env:
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          ROLLOUT_TIMEOUT: ${{ inputs.rollout_timeout }}
        run: |
          set -euo pipefail

          if ! kubectl -n "$NAMESPACE" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout="$ROLLOUT_TIMEOUT"; then
            echo "::group::Deployment description"
            kubectl -n "$NAMESPACE" describe "deployment/${DEPLOYMENT_NAME}" || true
            echo "::endgroup::"
            echo "::group::Recent pod events"
            kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
            echo "::endgroup::"
            echo "::error title=Rollout failed::'${DEPLOYMENT_NAME}' did not become ready within ${ROLLOUT_TIMEOUT}. Undo with: kubectl -n ${NAMESPACE} rollout undo deployment/${DEPLOYMENT_NAME}"
            exit 1
          fi

      - name: Summarise
        if: always()
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          IMAGE_URI: ${{ inputs.image_uri }}
        run: |
          {
            echo "### EKS deployment"
            echo ""
            echo "- Cluster: \`${CLUSTER_NAME}\`"
            echo "- Namespace: \`${NAMESPACE}\`"
            echo "- Image: \`${IMAGE_URI:-n/a}\`"
            echo "- Method: \`${{ inputs.deploy_method }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
