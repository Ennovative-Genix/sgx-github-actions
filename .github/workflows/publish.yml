name: Publish

# Single entry point for package publishing. A library repository calls this
# once and passes `ecosystem`; everything else has a default.
#
# `uses:` cannot be built from an expression, so the dispatch below is a set of
# statically declared, `if:`-gated jobs. Exactly one ecosystem branch runs.

on:
  workflow_call:
    inputs:
      ecosystem:
        description: "npm, pypi or maven."
        required: true
        type: string

      mode:
        description: "auto, verify, snapshot or release. 'auto' picks release on a tag, verify on a pull request, snapshot otherwise."
        required: false
        type: string
        default: "auto"

      app_path:
        description: "Path to the package directory, relative to the repository root."
        required: false
        type: string
        default: "."
      run_ci:
        description: "Lint, test and build before publishing."
        required: false
        type: boolean
        default: true

      release_environment:
        description: "GitHub environment used for a release. Protect this one."
        required: false
        type: string
        default: "prod"
      snapshot_environment:
        description: "GitHub environment used for snapshots and dry runs. For PyPI this name lands in the version, so it must be a PEP 440 pre-release segment: dev, a, b or rc."
        required: false
        type: string
        default: "dev"
      snapshot_version_strategy:
        description: "Version strategy for snapshots. Defaults to 'manifest' for maven so a pom -SNAPSHOT survives, and 'auto' elsewhere."
        required: false
        type: string
        default: ""

      codeartifact_domain:
        description: "CodeArtifact domain to publish into."
        required: true
        type: string
      codeartifact_repository:
        description: "CodeArtifact repository to publish into."
        required: true
        type: string
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain."
        required: false
        type: string
        default: ""
      codeartifact_namespace:
        description: "npm scope bound to CodeArtifact, without the leading @."
        required: false
        type: string
        default: ""
      aws_region:
        description: "Region of the CodeArtifact domain. Required, because CI jobs have no environment to read AWS_REGION from."
        required: false
        type: string
        default: ""

      node_versions:
        description: 'npm only. JSON array of Node versions to test against; the first is used to publish.'
        required: false
        type: string
        default: '["20.x"]'
      package_manager:
        description: "npm only. npm, yarn or pnpm."
        required: false
        type: string
        default: "npm"
      build_script:
        description: "npm only. Script run before publishing. Empty publishes without building."
        required: false
        type: string
        default: "build"
      npm_access:
        description: "npm only. restricted or public."
        required: false
        type: string
        default: "restricted"

      python_versions:
        description: 'pypi only. JSON array of Python versions to test against; the first is used to publish.'
        required: false
        type: string
        default: '["3.12"]'
      python_extras:
        description: "pypi only. Optional dependency group installed for CI."
        required: false
        type: string
        default: "dev"
      lint_command:
        description: "pypi only. Lint command."
        required: false
        type: string
        default: "ruff check ."
      test_command:
        description: "pypi only. Test command."
        required: false
        type: string
        default: "pytest -q"

      java_versions:
        description: 'maven only. JSON array of JDK versions to test against; the first is used to publish.'
        required: false
        type: string
        default: '["21"]'
      java_distribution:
        description: "maven only. JDK distribution."
        required: false
        type: string
        default: "temurin"
      build_tool:
        description: "maven only. maven or gradle."
        required: false
        type: string
        default: "maven"

    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true

    outputs:
      version:
        description: "The version that was published, or empty when nothing was."
        value: ${{ jobs.npm.outputs.version || jobs.pypi.outputs.version || jobs.maven.outputs.version }}
      mode:
        description: "The mode that was resolved: verify, snapshot or release."
        value: ${{ jobs.resolve.outputs.mode }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      environment: ${{ steps.plan.outputs.environment }}
      version_strategy: ${{ steps.plan.outputs.version-strategy }}
      dry_run: ${{ steps.plan.outputs.dry-run }}

    steps:
      - name: Plan the publish
        id: plan
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          MODE: ${{ inputs.mode }}
          RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
          SNAPSHOT_ENVIRONMENT: ${{ inputs.snapshot_environment }}
          SNAPSHOT_VERSION_STRATEGY: ${{ inputs.snapshot_version_strategy }}
        run: |
          set -euo pipefail

          case "$ECOSYSTEM" in
            npm | pypi | maven) ;;
            *)
              echo "::error title=Unknown ecosystem::'$ECOSYSTEM' is not one of npm, pypi, maven."
              exit 1
              ;;
          esac

          mode="$MODE"
          if [ "$mode" = "auto" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              mode="release"
            elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              mode="verify"
            else
              mode="snapshot"
            fi
          fi

          # Maven encodes "not a release" in the version itself, so its snapshot
          # builds publish the pom verbatim rather than synthesising a version.
          snapshot_strategy="$SNAPSHOT_VERSION_STRATEGY"
          if [ -z "$snapshot_strategy" ]; then
            if [ "$ECOSYSTEM" = "maven" ]; then
              snapshot_strategy="manifest"
            else
              snapshot_strategy="auto"
            fi
          fi

          case "$mode" in
            release)
              environment="$RELEASE_ENVIRONMENT"
              version_strategy="tag"
              dry_run="false"
              ;;
            snapshot)
              environment="$SNAPSHOT_ENVIRONMENT"
              version_strategy="$snapshot_strategy"
              dry_run="false"
              ;;
            verify)
              environment="$SNAPSHOT_ENVIRONMENT"
              # Never a real version: a dry run must not consume one.
              version_strategy="run-number"
              dry_run="true"
              ;;
            *)
              echo "::error title=Unknown mode::'$mode' is not one of auto, verify, snapshot, release."
              exit 1
              ;;
          esac

          if [ "$mode" = "release" ] && [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "::error title=Release without a tag::Mode 'release' takes its version from the git tag, but this run was triggered by '${GITHUB_REF_NAME}'."
            exit 1
          fi

          {
            echo "mode=$mode"
            echo "environment=$environment"
            echo "version-strategy=$version_strategy"
            echo "dry-run=$dry_run"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Publish plan"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Ecosystem | \`$ECOSYSTEM\` |"
            echo "| Mode | \`$mode\` |"
            echo "| Environment | \`$environment\` |"
            echo "| Version strategy | \`$version_strategy\` |"
            echo "| Dry run | \`$dry_run\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-node:
    name: CI
    if: inputs.ecosystem == 'npm' && inputs.run_ci
    uses: ./.github/workflows/ci-node.yml
    permissions:
      id-token: write
      contents: read
    with:
      framework: node
      node_versions: ${{ inputs.node_versions }}
      package_manager: ${{ inputs.package_manager }}
      app_path: ${{ inputs.app_path }}
      aws_region: ${{ inputs.aws_region }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_repository: ${{ inputs.codeartifact_repository }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
      codeartifact_namespace: ${{ inputs.codeartifact_namespace }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  ci-python:
    name: CI
    if: inputs.ecosystem == 'pypi' && inputs.run_ci
    uses: ./.github/workflows/ci-python.yml
    permissions:
      id-token: write
      contents: read
    with:
      python_versions: ${{ inputs.python_versions }}
      app_path: ${{ inputs.app_path }}
      extras: ${{ inputs.python_extras }}
      lint_command: ${{ inputs.lint_command }}
      test_command: ${{ inputs.test_command }}
      aws_region: ${{ inputs.aws_region }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_repository: ${{ inputs.codeartifact_repository }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  ci-java:
    name: CI
    if: inputs.ecosystem == 'maven' && inputs.run_ci
    uses: ./.github/workflows/ci-java.yml
    permissions:
      id-token: write
      contents: read
    with:
      java_versions: ${{ inputs.java_versions }}
      distribution: ${{ inputs.java_distribution }}
      build_tool: ${{ inputs.build_tool }}
      app_path: ${{ inputs.app_path }}
      aws_region: ${{ inputs.aws_region }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_repository: ${{ inputs.codeartifact_repository }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  npm:
    name: Publish
    needs: [resolve, ci-node]
    # `!cancelled() && !failure()` replaces the implied success() check, so a CI
    # job skipped by run_ci: false does not skip the publish with it. A CI job
    # that actually failed still blocks.
    if: ${{ !cancelled() && !failure() && inputs.ecosystem == 'npm' }}
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      app_path: ${{ inputs.app_path }}
      node_version: ${{ fromJSON(inputs.node_versions)[0] }}
      package_manager: ${{ inputs.package_manager }}
      build_script: ${{ inputs.build_script }}
      version_strategy: ${{ needs.resolve.outputs.version_strategy }}
      dry_run: ${{ needs.resolve.outputs.dry_run == 'true' }}
      access: ${{ inputs.npm_access }}
      aws_region: ${{ inputs.aws_region }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_repository: ${{ inputs.codeartifact_repository }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
      codeartifact_namespace: ${{ inputs.codeartifact_namespace }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  pypi:
    name: Publish
    needs: [resolve, ci-python]
    if: ${{ !cancelled() && !failure() && inputs.ecosystem == 'pypi' }}
    uses: ./.github/workflows/publish-pypi.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      app_path: ${{ inputs.app_path }}
      python_version: ${{ fromJSON(inputs.python_versions)[0] }}
      version_strategy: ${{ needs.resolve.outputs.version_strategy }}
      dry_run: ${{ needs.resolve.outputs.dry_run == 'true' }}
      aws_region: ${{ inputs.aws_region }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_repository: ${{ inputs.codeartifact_repository }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  maven:
    name: Publish
    needs: [resolve, ci-java]
    if: ${{ !cancelled() && !failure() && inputs.ecosystem == 'maven' }}
    uses: ./.github/workflows/publish-maven.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      app_path: ${{ inputs.app_path }}
      java_version: ${{ fromJSON(inputs.java_versions)[0] }}
      distribution: ${{ inputs.java_distribution }}
      build_tool: ${{ inputs.build_tool }}
      version_strategy: ${{ needs.resolve.outputs.version_strategy }}
      dry_run: ${{ needs.resolve.outputs.dry_run == 'true' }}
      # Already run by the CI job; running them again doubles the publish time.
      run_test: false
      aws_region: ${{ inputs.aws_region }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_repository: ${{ inputs.codeartifact_repository }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
