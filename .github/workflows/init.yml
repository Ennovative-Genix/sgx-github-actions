permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, staging, preprod, prod)"
        required: true
        type: string
      env_region:
        description: "AWS region for this environment (ECR + EKS)"
        required: true
        type: string
      docker_image_name:
        description: "Docker image name (app name; default ECR repo / Deployment / container name)"
        required: true
        type: string
      app_path:
        description: "Path to the application directory containing the Dockerfile (relative to repo root). Defaults to root."
        required: false
        type: string
        default: "."
      docker_context:
        description: "Docker build context (relative to repo root). Defaults to app_path. Use '.' for Nx/monorepo Dockerfiles that COPY from the repo root."
        required: false
        type: string
        default: ""
      ecr_repository:
        description: "ECR repository name. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      deployment_name:
        description: "Kubernetes Deployment name. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      container_name:
        description: "Container name within the Deployment to update. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      namespace:
        description: "Kubernetes namespace. Defaults to the environment name."
        required: false
        type: string
        default: ""
      aws_secret_arn:
        description: "Optional AWS Secrets Manager secret ARN. When set (or vars.AWS_SECRET_ARN), CI syncs it into a Kubernetes Secret. Region is parsed from the ARN."
        required: false
        type: string
        default: ""
      k8s_secret_name:
        description: "Kubernetes Secret name to create/update. Must match the Deployment's envFrom.secretRef.name. Required when aws_secret_arn/AWS_SECRET_ARN is set."
        required: false
        type: string
        default: ""
      k8s_type:
        description: "Kubernetes cluster type. EKS or Kubeadm. Defaults to EKS."
        required: false
        type: string
        default: "EKS"
      k8s_api_host:
        description: "Private IP of the kube-apiserver for SSM port forwarding. Required for Kubeadm clusters."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile path relative to repo root. Empty = <app_path>/Dockerfile."
        required: false
        type: string
        default: ""
      build_env:
        description: "Docker ARG ENV. Empty = environment (dev/qa/stg/prod). Prefer a fixed value (e.g. prod) for env-agnostic images."
        required: false
        type: string
        default: ""
      skip_build:
        description: "When true, do not build/push; deploy the provided image (promote path)."
        required: false
        type: boolean
        default: false
      image:
        description: "Fully-qualified image to deploy when skip_build=true (registry/repo@sha256:...). Cross-region copies are handled automatically."
        required: false
        type: string
        default: ""
      deploy_method:
        description: "Helm only. Charts and values are checked out from charts_ref."
        required: false
        type: string
        default: "helm"
      product:
        description: "values/<product>/<service>/ folder name. Required."
        required: false
        type: string
        default: ""
      service:
        description: "values/<product>/<service>/ folder name. Required."
        required: false
        type: string
        default: ""
      chart:
        description: "Chart directory under charts/. Default app."
        required: false
        type: string
        default: "app"
      charts_ref:
        description: "Git ref of sgx-github-actions to check out for charts and values."
        required: false
        type: string
        default: "k8s-helm"
      codeartifact_domain:
        description: "CodeArtifact domain. Empty skips the token. Set for images whose Dockerfile mounts secret id=codeartifact_token."
        required: false
        type: string
        default: ""
      codeartifact_domain_owner:
        description: "AWS account ID that owns the CodeArtifact domain. Required when codeartifact_domain is set."
        required: false
        type: string
        default: ""
      codeartifact_region:
        description: "Region of the CodeArtifact domain. Often ap-south-1 even when ECR is in another region."
        required: false
        type: string
        default: ""
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication (ECR push + EKS access)"
        required: true
      AWS_SECRET_ARN:
        description: "Optional Secrets Manager ARN; pass from caller Environment secret and forward to deploy-k8s"
        required: false
      DEV_KUBE_CONFIG:
        description: "Kubeconfig for Kubeadm cluster; pass from caller Environment secret and forward to deploy-k8s-kubeadm"
        required: false
      K8S_INSTANCE_ID:
        description: "EC2 instance ID of the Kubeadm node; pass from caller Environment secret and forward to deploy-k8s-kubeadm"
        required: false

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.docker_image_name }}
  cancel-in-progress: false

jobs:
  # Fail closed on bad inputs BEFORE any AWS credentials are assumed. `environment`
  # is a free-form string (workflow_call can't use `type: choice`), so a typo like
  # "production" would silently select a non-existent GitHub Environment and bypass
  # its protection rules. The charset checks also block shell metacharacters from
  # reaching command strings downstream (defense-in-depth).
  #
  # Inputs are also normalized (trimmed) here: callers can pass values via YAML
  # folded/block scalars or step outputs that carry a trailing newline/CR, e.g.
  # "stg\n". Untrimmed, that fails validation and poisons downstream namespace/ECR/
  # kubectl values. Downstream jobs consume the trimmed outputs, not inputs.*.
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.normalize.outputs.environment }}
      env_region: ${{ steps.normalize.outputs.env_region }}
      docker_image_name: ${{ steps.normalize.outputs.docker_image_name }}
      app_path: ${{ steps.normalize.outputs.app_path }}
      docker_context: ${{ steps.normalize.outputs.docker_context }}
      ecr_repository: ${{ steps.normalize.outputs.ecr_repository }}
      deployment_name: ${{ steps.normalize.outputs.deployment_name }}
      container_name: ${{ steps.normalize.outputs.container_name }}
      namespace: ${{ steps.normalize.outputs.namespace }}
      aws_secret_arn: ${{ steps.normalize.outputs.aws_secret_arn }}
      k8s_secret_name: ${{ steps.normalize.outputs.k8s_secret_name }}
      k8s_api_host: ${{ steps.normalize.outputs.k8s_api_host }}
      k8s_type: ${{ steps.normalize.outputs.k8s_type }}
      dockerfile: ${{ steps.normalize.outputs.dockerfile }}
      build_env: ${{ steps.normalize.outputs.build_env }}
      skip_build: ${{ steps.normalize.outputs.skip_build }}
      image: ${{ steps.normalize.outputs.image }}
      deploy_method: ${{ steps.normalize.outputs.deploy_method }}
      product: ${{ steps.normalize.outputs.product }}
      service: ${{ steps.normalize.outputs.service }}
      chart: ${{ steps.normalize.outputs.chart }}
      charts_ref: ${{ steps.normalize.outputs.charts_ref }}
      codeartifact_domain: ${{ steps.normalize.outputs.codeartifact_domain }}
      codeartifact_domain_owner: ${{ steps.normalize.outputs.codeartifact_domain_owner }}
      codeartifact_region: ${{ steps.normalize.outputs.codeartifact_region }}
    steps:
      - name: Normalize and validate inputs
        id: normalize
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ENV_REGION: ${{ inputs.env_region }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
          APP_PATH: ${{ inputs.app_path }}
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          NAMESPACE: ${{ inputs.namespace }}
          AWS_SECRET_ARN: ${{ inputs.aws_secret_arn }}
          K8S_SECRET_NAME: ${{ inputs.k8s_secret_name }}
          K8S_API_HOST: ${{ inputs.k8s_api_host }}
          K8S_TYPE: ${{ inputs.k8s_type }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ENV: ${{ inputs.build_env }}
          SKIP_BUILD: ${{ inputs.skip_build }}
          IMAGE: ${{ inputs.image }}
          DEPLOY_METHOD: ${{ inputs.deploy_method }}
          PRODUCT: ${{ inputs.product }}
          SERVICE: ${{ inputs.service }}
          CHART: ${{ inputs.chart }}
          CHARTS_REF: ${{ inputs.charts_ref }}
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact_domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ inputs.codeartifact_domain_owner }}
          CODEARTIFACT_REGION: ${{ inputs.codeartifact_region }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Strip CR and leading/trailing whitespace (incl. newlines) that callers can
          # introduce via YAML folded/block scalars or step outputs.
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          ENVIRONMENT="$(trim "$ENVIRONMENT")"
          ENV_REGION="$(trim "$ENV_REGION")"
          DOCKER_IMAGE_NAME="$(trim "$DOCKER_IMAGE_NAME")"
          APP_PATH="$(trim "$APP_PATH")"
          DOCKER_CONTEXT="$(trim "$DOCKER_CONTEXT")"
          ECR_REPOSITORY="$(trim "$ECR_REPOSITORY")"
          DEPLOYMENT_NAME="$(trim "$DEPLOYMENT_NAME")"
          CONTAINER_NAME="$(trim "$CONTAINER_NAME")"
          NAMESPACE="$(trim "$NAMESPACE")"
          AWS_SECRET_ARN="$(trim "$AWS_SECRET_ARN")"
          K8S_SECRET_NAME="$(trim "$K8S_SECRET_NAME")"
          K8S_API_HOST="$(trim "$K8S_API_HOST")"
          K8S_TYPE="$(trim "$K8S_TYPE")"
          DOCKERFILE="$(trim "$DOCKERFILE")"
          BUILD_ENV="$(trim "$BUILD_ENV")"
          SKIP_BUILD="$(trim "$SKIP_BUILD")"
          IMAGE="$(trim "$IMAGE")"
          DEPLOY_METHOD="$(trim "$DEPLOY_METHOD")"
          PRODUCT="$(trim "$PRODUCT")"
          SERVICE="$(trim "$SERVICE")"
          CHART="$(trim "$CHART")"
          CHARTS_REF="$(trim "$CHARTS_REF")"
          CODEARTIFACT_DOMAIN="$(trim "$CODEARTIFACT_DOMAIN")"
          CODEARTIFACT_DOMAIN_OWNER="$(trim "$CODEARTIFACT_DOMAIN_OWNER")"
          CODEARTIFACT_REGION="$(trim "$CODEARTIFACT_REGION")"

          case "$ENVIRONMENT" in
            dev|qa|uat|stg|staging|preprod|prod) ;;
            *) fail "environment must be one of dev|qa|uat|stg|staging|preprod|prod (got '$ENVIRONMENT')" ;;
          esac

          case "$SKIP_BUILD" in
            true|True|TRUE|yes|1) SKIP_BUILD=true ;;
            false|False|FALSE|no|0|"") SKIP_BUILD=false ;;
            *) fail "skip_build must be boolean (got '$SKIP_BUILD')" ;;
          esac
          if [ "$SKIP_BUILD" = true ]; then
            [ -n "$IMAGE" ] || fail "image is required when skip_build=true (digest-pinned registry/repo@sha256:...)"
            printf '%s' "$IMAGE" | grep -Eq '^[A-Za-z0-9._:/-]+@sha256:[a-f0-9]{64}$' \
              || fail "image must be digest-pinned (registry/repo@sha256:...) (got '$IMAGE')"
          fi

          printf '%s' "$DOCKER_IMAGE_NAME" | grep -Eq '^[a-z0-9][a-z0-9._/-]*$' \
            || fail "docker_image_name must match ^[a-z0-9][a-z0-9._/-]*$ (got '$DOCKER_IMAGE_NAME')"
          printf '%s' "$APP_PATH" | grep -Eq '^[A-Za-z0-9._-][A-Za-z0-9._/-]*$' \
            || fail "app_path must match ^[A-Za-z0-9._-][A-Za-z0-9._/-]*$ (got '$APP_PATH')"
          if [ -n "$DOCKER_CONTEXT" ]; then
            printf '%s' "$DOCKER_CONTEXT" | grep -Eq '^[A-Za-z0-9._-][A-Za-z0-9._/-]*$' \
              || fail "docker_context must match ^[A-Za-z0-9._-][A-Za-z0-9._/-]*$ (got '$DOCKER_CONTEXT')"
          fi
          if [ -n "$AWS_SECRET_ARN" ]; then
            printf '%s' "$AWS_SECRET_ARN" | grep -Eq '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+' \
              || fail "aws_secret_arn must be a Secrets Manager ARN (got '$AWS_SECRET_ARN')"
          fi
          if [ -n "$K8S_SECRET_NAME" ]; then
            printf '%s' "$K8S_SECRET_NAME" | grep -Eq '^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$' \
              || fail "k8s_secret_name must be a valid DNS subdomain label (got '$K8S_SECRET_NAME')"
          fi
          if [ -n "$K8S_API_HOST" ]; then
            printf '%s' "$K8S_API_HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' \
              || fail "k8s_api_host must be a valid IPv4 address (got '$K8S_API_HOST')"
          fi
          if [ -n "$K8S_TYPE" ]; then
            printf '%s' "$K8S_TYPE" | grep -Eq '^(EKS|Kubeadm)$' \
              || fail "k8s_type must be either 'EKS' or 'Kubeadm' (got '$K8S_TYPE')"
          fi
          if [ -n "$DOCKERFILE" ]; then
            printf '%s' "$DOCKERFILE" | grep -Eq '^[A-Za-z0-9._-][A-Za-z0-9._/-]*$' \
              || fail "dockerfile must be a relative path (got '$DOCKERFILE')"
          fi
          if [ -n "$BUILD_ENV" ]; then
            printf '%s' "$BUILD_ENV" | grep -Eq '^[A-Za-z0-9._-]+$' \
              || fail "build_env must match ^[A-Za-z0-9._-]+$ (got '$BUILD_ENV')"
          fi
          case "$DEPLOY_METHOD" in
            helm|"") ;;
            *) fail "deploy_method must be helm (got '$DEPLOY_METHOD')" ;;
          esac
          [ -n "$DEPLOY_METHOD" ] || DEPLOY_METHOD=helm
          [ -n "$CHART" ] || CHART=app
          [ -n "$CHARTS_REF" ] || CHARTS_REF=k8s-helm
          printf '%s' "$CHARTS_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$' \
            || fail "charts_ref must be a git ref (got '$CHARTS_REF')"
          printf '%s' "$PRODUCT" | grep -Eq '^[a-z0-9][a-z0-9-]*$' \
            || fail "product is required (got '$PRODUCT')"
          printf '%s' "$SERVICE" | grep -Eq '^[a-z0-9][a-z0-9-]*$' \
            || fail "service is required (got '$SERVICE')"
          printf '%s' "$CHART" | grep -Eq '^[a-z0-9][a-z0-9-]*$' \
            || fail "chart must match ^[a-z0-9][a-z0-9-]*$ (got '$CHART')"
          if [ -n "$CODEARTIFACT_DOMAIN$CODEARTIFACT_DOMAIN_OWNER$CODEARTIFACT_REGION" ]; then
            printf '%s' "$CODEARTIFACT_DOMAIN" | grep -Eq '^[a-zA-Z0-9][a-zA-Z0-9-]{0,49}$' \
              || fail "codeartifact_domain must be a CodeArtifact domain (got '$CODEARTIFACT_DOMAIN')"
            printf '%s' "$CODEARTIFACT_DOMAIN_OWNER" | grep -Eq '^[0-9]{12}$' \
              || fail "codeartifact_domain_owner must be a 12-digit AWS account ID (got '$CODEARTIFACT_DOMAIN_OWNER')"
            printf '%s' "$CODEARTIFACT_REGION" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]+$' \
              || fail "codeartifact_region must be an AWS region (got '$CODEARTIFACT_REGION')"
          fi
          {
            echo "environment=$ENVIRONMENT"
            echo "env_region=$ENV_REGION"
            echo "docker_image_name=$DOCKER_IMAGE_NAME"
            echo "app_path=$APP_PATH"
            echo "docker_context=$DOCKER_CONTEXT"
            echo "ecr_repository=$ECR_REPOSITORY"
            echo "deployment_name=$DEPLOYMENT_NAME"
            echo "container_name=$CONTAINER_NAME"
            echo "namespace=$NAMESPACE"
            echo "aws_secret_arn=$AWS_SECRET_ARN"
            echo "k8s_secret_name=$K8S_SECRET_NAME"
            echo "k8s_api_host=$K8S_API_HOST"
            echo "k8s_type=$K8S_TYPE"
            echo "dockerfile=$DOCKERFILE"
            echo "build_env=$BUILD_ENV"
            echo "skip_build=$SKIP_BUILD"
            echo "image=$IMAGE"
            echo "deploy_method=$DEPLOY_METHOD"
            echo "product=$PRODUCT"
            echo "service=$SERVICE"
            echo "chart=$CHART"
            echo "charts_ref=$CHARTS_REF"
            echo "codeartifact_domain=$CODEARTIFACT_DOMAIN"
            echo "codeartifact_domain_owner=$CODEARTIFACT_DOMAIN_OWNER"
            echo "codeartifact_region=$CODEARTIFACT_REGION"
          } >> "$GITHUB_OUTPUT"

          echo "Inputs validated: environment=$ENVIRONMENT skip_build=$SKIP_BUILD image_name=$DOCKER_IMAGE_NAME"

  build-and-push:
    name: Build and Push to ECR
    needs: validate-inputs
    if: ${{ needs.validate-inputs.outputs.skip_build != 'true' }}
    uses: ./.github/workflows/build-ecr.yml
    with:
      environment: ${{ needs.validate-inputs.outputs.environment }}
      env_region: ${{ needs.validate-inputs.outputs.env_region }}
      docker_image_name: ${{ needs.validate-inputs.outputs.docker_image_name }}
      app_path: ${{ needs.validate-inputs.outputs.app_path }}
      docker_context: ${{ needs.validate-inputs.outputs.docker_context }}
      ecr_repository: ${{ needs.validate-inputs.outputs.ecr_repository }}
      dockerfile: ${{ needs.validate-inputs.outputs.dockerfile }}
      build_env: ${{ needs.validate-inputs.outputs.build_env }}
      codeartifact_domain: ${{ needs.validate-inputs.outputs.codeartifact_domain }}
      codeartifact_domain_owner: ${{ needs.validate-inputs.outputs.codeartifact_domain_owner }}
      codeartifact_region: ${{ needs.validate-inputs.outputs.codeartifact_region }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  # Resolve the digest to deploy. On promote (skip_build), copy into the target
  # region's ECR when the source image lives in another region (QA ap-south-1 →
  # STG/PROD us-east-1).
  resolve-image:
    name: Resolve image for deploy
    needs: [validate-inputs, build-and-push]
    if: ${{ always() && needs.validate-inputs.result == 'success' && (needs.validate-inputs.outputs.skip_build == 'true' || needs.build-and-push.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        if: ${{ needs.validate-inputs.outputs.skip_build == 'true' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_ARN }}
          aws-region: ${{ needs.validate-inputs.outputs.env_region }}
          role-session-name: GitHubActions-Promote-ECR-${{ github.run_id }}

      - name: Login to Amazon ECR (target region)
        if: ${{ needs.validate-inputs.outputs.skip_build == 'true' }}
        id: login-ecr-target
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6

      - name: Resolve image reference
        id: resolve
        env:
          SKIP_BUILD: ${{ needs.validate-inputs.outputs.skip_build }}
          SOURCE_IMAGE: ${{ needs.validate-inputs.outputs.image }}
          BUILT_IMAGE: ${{ needs.build-and-push.outputs.image }}
          TARGET_REGION: ${{ needs.validate-inputs.outputs.env_region }}
          TARGET_REGISTRY: ${{ steps.login-ecr-target.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.validate-inputs.outputs.ecr_repository }}
          DOCKER_IMAGE_NAME: ${{ needs.validate-inputs.outputs.docker_image_name }}
          ENVIRONMENT: ${{ needs.validate-inputs.outputs.environment }}
        run: |
          set -euo pipefail
          if [ "$SKIP_BUILD" != true ]; then
            echo "image=${BUILT_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "Using freshly built image: ${BUILT_IMAGE}"
            exit 0
          fi

          REPO_NAME="${ECR_REPOSITORY:-$DOCKER_IMAGE_NAME}"
          SOURCE_REGISTRY="${SOURCE_IMAGE%%/*}"
          SOURCE_REGION="$(printf '%s' "$SOURCE_REGISTRY" | sed -n 's/.*\.dkr\.ecr\.\([^.]*\)\.amazonaws\.com/\1/p')"
          TARGET_REPO_URI="${TARGET_REGISTRY}/${REPO_NAME}"

          if [ -z "$SOURCE_REGION" ]; then
            echo "::error::Could not parse source ECR region from '${SOURCE_IMAGE}'"
            exit 1
          fi

          if [ "$SOURCE_REGISTRY" = "$TARGET_REGISTRY" ]; then
            echo "image=${SOURCE_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "Source already in target registry: ${SOURCE_IMAGE}"
            exit 0
          fi

          echo "Copying ${SOURCE_IMAGE} → ${TARGET_REPO_URI} (region ${SOURCE_REGION} → ${TARGET_REGION})"

          # Install crane (pinned release) for cross-region ECR copy.
          CRANE_VERSION=v0.20.3
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - -C /usr/local/bin crane
          chmod +x /usr/local/bin/crane

          # Auth to source region as well (same account OIDC role, different region).
          aws ecr get-login-password --region "$SOURCE_REGION" \
            | crane auth login "$SOURCE_REGISTRY" -u AWS --password-stdin
          aws ecr get-login-password --region "$TARGET_REGION" \
            | crane auth login "$TARGET_REGISTRY" -u AWS --password-stdin

          crane copy "$SOURCE_IMAGE" "${TARGET_REPO_URI}:${ENVIRONMENT}"
          crane copy "$SOURCE_IMAGE" "${TARGET_REPO_URI}:${GITHUB_SHA}"

          # Prefer digest from target repo after copy (content-addressable; usually identical).
          TARGET_DIGEST="$(crane digest "${TARGET_REPO_URI}:${GITHUB_SHA}")"
          echo "image=${TARGET_REPO_URI}@${TARGET_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Promoted ${SOURCE_IMAGE} → ${TARGET_REPO_URI}@${TARGET_DIGEST}"

  deploy-k8s:
    name: Deploy to Kubernetes (EKS)
    if: ${{ always() && needs.validate-inputs.result == 'success' && needs.resolve-image.result == 'success' && needs.validate-inputs.outputs.k8s_type == 'EKS' }}
    needs: [validate-inputs, resolve-image]
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      aws_secret_arn: ${{ needs.validate-inputs.outputs.aws_secret_arn }}
      container_name: ${{ needs.validate-inputs.outputs.container_name }}
      deployment_name: ${{ needs.validate-inputs.outputs.deployment_name }}
      docker_image_name: ${{ needs.validate-inputs.outputs.docker_image_name }}
      env_region: ${{ needs.validate-inputs.outputs.env_region }}
      environment: ${{ needs.validate-inputs.outputs.environment }}
      image: ${{ needs.resolve-image.outputs.image }}
      k8s_secret_name: ${{ needs.validate-inputs.outputs.k8s_secret_name }}
      namespace: ${{ needs.validate-inputs.outputs.namespace }}
      deploy_method: ${{ needs.validate-inputs.outputs.deploy_method }}
      product: ${{ needs.validate-inputs.outputs.product }}
      service: ${{ needs.validate-inputs.outputs.service }}
      chart: ${{ needs.validate-inputs.outputs.chart }}
      charts_ref: ${{ needs.validate-inputs.outputs.charts_ref }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      AWS_SECRET_ARN: ${{ secrets.AWS_SECRET_ARN }}

  deploy-k8s-kubeadm:
    name: Deploy to Kubernetes (Kubeadm)
    needs: [validate-inputs, resolve-image]
    if: ${{ always() && needs.validate-inputs.result == 'success' && needs.resolve-image.result == 'success' && needs.validate-inputs.outputs.k8s_type != 'EKS' }}
    uses: ./.github/workflows/deploy-k8s-kubeadm.yml
    with:
      aws_secret_arn: ${{ needs.validate-inputs.outputs.aws_secret_arn }}
      container_name: ${{ needs.validate-inputs.outputs.container_name }}
      deployment_name: ${{ needs.validate-inputs.outputs.deployment_name }}
      docker_image_name: ${{ needs.validate-inputs.outputs.docker_image_name }}
      ecr_repository: ${{ needs.validate-inputs.outputs.ecr_repository }}
      env_region: ${{ needs.validate-inputs.outputs.env_region }}
      environment: ${{ needs.validate-inputs.outputs.environment }}
      k8s_api_host: ${{ needs.validate-inputs.outputs.k8s_api_host }}
      k8s_secret_name: ${{ needs.validate-inputs.outputs.k8s_secret_name }}
      namespace: ${{ needs.validate-inputs.outputs.namespace }}
      image: ${{ needs.resolve-image.outputs.image }}
      deploy_method: ${{ needs.validate-inputs.outputs.deploy_method }}
      product: ${{ needs.validate-inputs.outputs.product }}
      service: ${{ needs.validate-inputs.outputs.service }}
      chart: ${{ needs.validate-inputs.outputs.chart }}
      charts_ref: ${{ needs.validate-inputs.outputs.charts_ref }}
    secrets:
      AWS_SECRET_ARN: ${{ secrets.AWS_SECRET_ARN }}
      DEV_KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      K8S_INSTANCE_ID: ${{ secrets.K8S_INSTANCE_ID }}
