permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, staging, preprod, prod)"
        required: true
        type: string
      env_region:
        description: "AWS region for this environment (ECR + EKS)"
        required: true
        type: string
      docker_image_name:
        description: "Docker image name (app name; default ECR repo / Deployment / container name)"
        required: true
        type: string
      app_path:
        description: "Path to the application directory containing the Dockerfile (relative to repo root). Defaults to root."
        required: false
        type: string
        default: "."
      docker_context:
        description: "Docker build context (relative to repo root). Defaults to app_path. Use '.' for Nx/monorepo Dockerfiles that COPY from the repo root."
        required: false
        type: string
        default: ""
      ecr_repository:
        description: "ECR repository name. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      deployment_name:
        description: "Kubernetes Deployment name. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      container_name:
        description: "Container name within the Deployment to update. Defaults to docker_image_name."
        required: false
        type: string
        default: ""
      manifest_path:
        description: "Path to a kustomize dir or plain manifests in the consumer repo. Auto-detected if empty."
        required: false
        type: string
        default: ""
      namespace:
        description: "Kubernetes namespace. Defaults to the environment name."
        required: false
        type: string
        default: ""
      aws_secret_arn:
        description: "Optional AWS Secrets Manager secret ARN. When set (or vars.AWS_SECRET_ARN), CI syncs it into a Kubernetes Secret. Region is parsed from the ARN."
        required: false
        type: string
        default: ""
      k8s_secret_name:
        description: "Kubernetes Secret name to create/update. Must match the Deployment's envFrom.secretRef.name. Required when aws_secret_arn/AWS_SECRET_ARN is set."
        required: false
        type: string
        default: ""
      k8s_type:
        description: "Kubernetes cluster type. EKS or Kubeadm. Defaults to EKS."
        required: false
        type: string
        default: "EKS"
      k8s_api_host:
        description: "Private IP of the kube-apiserver for SSM port forwarding. Required for Kubeadm clusters."
        required: false
        type: string
        default: ""
      deploy_method:
        description: "helm (charts in this repo) or manifests (kubectl apply in the consumer repo)."
        required: false
        type: string
        default: "manifests"
      product:
        description: "values/<product>/<service>/ folder name. Required when deploy_method is helm."
        required: false
        type: string
        default: ""
      service:
        description: "values/<product>/<service>/ folder name. Required when deploy_method is helm."
        required: false
        type: string
        default: ""
      chart:
        description: "Chart directory under charts/. Default app."
        required: false
        type: string
        default: "app"
      charts_ref:
        description: "Git ref of sgx-github-actions to check out for charts and values."
        required: false
        type: string
        default: "k8s-helm"
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication (ECR push + EKS access)"
        required: true
      AWS_SECRET_ARN:
        description: "Optional Secrets Manager ARN; pass from caller Environment secret and forward to deploy-k8s"
        required: false
      DEV_KUBE_CONFIG:
        description: "Kubeconfig for Kubeadm cluster; pass from caller Environment secret and forward to deploy-k8s-kubeadm"
        required: false
      K8S_INSTANCE_ID:
        description: "EC2 instance ID of the Kubeadm node; pass from caller Environment secret and forward to deploy-k8s-kubeadm"
        required: false

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.docker_image_name }}
  cancel-in-progress: false

jobs:
  # Fail closed on bad inputs BEFORE any AWS credentials are assumed. `environment`
  # is a free-form string (workflow_call can't use `type: choice`), so a typo like
  # "production" would silently select a non-existent GitHub Environment and bypass
  # its protection rules. The charset checks also block shell metacharacters from
  # reaching command strings downstream (defense-in-depth).
  #
  # Inputs are also normalized (trimmed) here: callers can pass values via YAML
  # folded/block scalars or step outputs that carry a trailing newline/CR, e.g.
  # "stg\n". Untrimmed, that fails validation and poisons downstream namespace/ECR/
  # kubectl values. Downstream jobs consume the trimmed outputs, not inputs.*.
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.normalize.outputs.environment }}
      env_region: ${{ steps.normalize.outputs.env_region }}
      docker_image_name: ${{ steps.normalize.outputs.docker_image_name }}
      app_path: ${{ steps.normalize.outputs.app_path }}
      docker_context: ${{ steps.normalize.outputs.docker_context }}
      ecr_repository: ${{ steps.normalize.outputs.ecr_repository }}
      deployment_name: ${{ steps.normalize.outputs.deployment_name }}
      container_name: ${{ steps.normalize.outputs.container_name }}
      manifest_path: ${{ steps.normalize.outputs.manifest_path }}
      namespace: ${{ steps.normalize.outputs.namespace }}
      aws_secret_arn: ${{ steps.normalize.outputs.aws_secret_arn }}
      k8s_secret_name: ${{ steps.normalize.outputs.k8s_secret_name }}
      k8s_api_host: ${{ steps.normalize.outputs.k8s_api_host }}
      k8s_type: ${{ steps.normalize.outputs.k8s_type }}
      deploy_method: ${{ steps.normalize.outputs.deploy_method }}
      product: ${{ steps.normalize.outputs.product }}
      service: ${{ steps.normalize.outputs.service }}
      chart: ${{ steps.normalize.outputs.chart }}
      charts_ref: ${{ steps.normalize.outputs.charts_ref }}
    steps:
      - name: Normalize and validate inputs
        id: normalize
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ENV_REGION: ${{ inputs.env_region }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
          APP_PATH: ${{ inputs.app_path }}
          DOCKER_CONTEXT: ${{ inputs.docker_context }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          NAMESPACE: ${{ inputs.namespace }}
          AWS_SECRET_ARN: ${{ inputs.aws_secret_arn }}
          K8S_SECRET_NAME: ${{ inputs.k8s_secret_name }}
          K8S_API_HOST: ${{ inputs.k8s_api_host }}
          K8S_TYPE: ${{ inputs.k8s_type }}
          DEPLOY_METHOD: ${{ inputs.deploy_method }}
          PRODUCT: ${{ inputs.product }}
          SERVICE: ${{ inputs.service }}
          CHART: ${{ inputs.chart }}
          CHARTS_REF: ${{ inputs.charts_ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Strip CR and leading/trailing whitespace (incl. newlines) that callers can
          # introduce via YAML folded/block scalars or step outputs.
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          ENVIRONMENT="$(trim "$ENVIRONMENT")"
          ENV_REGION="$(trim "$ENV_REGION")"
          DOCKER_IMAGE_NAME="$(trim "$DOCKER_IMAGE_NAME")"
          APP_PATH="$(trim "$APP_PATH")"
          DOCKER_CONTEXT="$(trim "$DOCKER_CONTEXT")"
          ECR_REPOSITORY="$(trim "$ECR_REPOSITORY")"
          DEPLOYMENT_NAME="$(trim "$DEPLOYMENT_NAME")"
          CONTAINER_NAME="$(trim "$CONTAINER_NAME")"
          MANIFEST_PATH="$(trim "$MANIFEST_PATH")"
          NAMESPACE="$(trim "$NAMESPACE")"
          AWS_SECRET_ARN="$(trim "$AWS_SECRET_ARN")"
          K8S_SECRET_NAME="$(trim "$K8S_SECRET_NAME")"
          K8S_API_HOST="$(trim "$K8S_API_HOST")"
          K8S_TYPE="$(trim "$K8S_TYPE")"
          DEPLOY_METHOD="$(trim "$DEPLOY_METHOD")"
          PRODUCT="$(trim "$PRODUCT")"
          SERVICE="$(trim "$SERVICE")"
          CHART="$(trim "$CHART")"
          CHARTS_REF="$(trim "$CHARTS_REF")"

          case "$ENVIRONMENT" in
            dev|qa|uat|stg|staging|preprod|prod) ;;
            *) fail "environment must be one of dev|qa|uat|stg|staging|preprod|prod (got '$ENVIRONMENT')" ;;
          esac

          printf '%s' "$DOCKER_IMAGE_NAME" | grep -Eq '^[a-z0-9][a-z0-9._/-]*$' \
            || fail "docker_image_name must match ^[a-z0-9][a-z0-9._/-]*$ (got '$DOCKER_IMAGE_NAME')"
          printf '%s' "$APP_PATH" | grep -Eq '^[A-Za-z0-9._-][A-Za-z0-9._/-]*$' \
            || fail "app_path must match ^[A-Za-z0-9._-][A-Za-z0-9._/-]*$ (got '$APP_PATH')"
          if [ -n "$DOCKER_CONTEXT" ]; then
            printf '%s' "$DOCKER_CONTEXT" | grep -Eq '^[A-Za-z0-9._-][A-Za-z0-9._/-]*$' \
              || fail "docker_context must match ^[A-Za-z0-9._-][A-Za-z0-9._/-]*$ (got '$DOCKER_CONTEXT')"
          fi
          if [ -n "$AWS_SECRET_ARN" ]; then
            printf '%s' "$AWS_SECRET_ARN" | grep -Eq '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+' \
              || fail "aws_secret_arn must be a Secrets Manager ARN (got '$AWS_SECRET_ARN')"
          fi
          if [ -n "$K8S_SECRET_NAME" ]; then
            printf '%s' "$K8S_SECRET_NAME" | grep -Eq '^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$' \
              || fail "k8s_secret_name must be a valid DNS subdomain label (got '$K8S_SECRET_NAME')"
          fi
          if [ -n "$K8S_API_HOST" ]; then
            printf '%s' "$K8S_API_HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' \
              || fail "k8s_api_host must be a valid IPv4 address (got '$K8S_API_HOST')"
          fi
          if [ -n "$K8S_TYPE" ]; then
            printf '%s' "$K8S_TYPE" | grep -Eq '^(EKS|Kubeadm)$' \
              || fail "k8s_type must be either 'EKS' or 'Kubeadm' (got '$K8S_TYPE')"
          fi
          case "$DEPLOY_METHOD" in
            helm|manifests|"") ;;
            *) fail "deploy_method must be helm or manifests (got '$DEPLOY_METHOD')" ;;
          esac
          [ -n "$DEPLOY_METHOD" ] || DEPLOY_METHOD=manifests
          [ -n "$CHART" ] || CHART=app
          [ -n "$CHARTS_REF" ] || CHARTS_REF=k8s-helm
          printf '%s' "$CHARTS_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$' \
            || fail "charts_ref must be a git ref (got '$CHARTS_REF')"
          if [ "$DEPLOY_METHOD" = helm ]; then
            printf '%s' "$PRODUCT" | grep -Eq '^[a-z0-9][a-z0-9-]*$' \
              || fail "product is required for helm (got '$PRODUCT')"
            printf '%s' "$SERVICE" | grep -Eq '^[a-z0-9][a-z0-9-]*$' \
              || fail "service is required for helm (got '$SERVICE')"
            printf '%s' "$CHART" | grep -Eq '^[a-z0-9][a-z0-9-]*$' \
              || fail "chart must match ^[a-z0-9][a-z0-9-]*$ (got '$CHART')"
          fi
          {
            echo "environment=$ENVIRONMENT"
            echo "env_region=$ENV_REGION"
            echo "docker_image_name=$DOCKER_IMAGE_NAME"
            echo "app_path=$APP_PATH"
            echo "docker_context=$DOCKER_CONTEXT"
            echo "ecr_repository=$ECR_REPOSITORY"
            echo "deployment_name=$DEPLOYMENT_NAME"
            echo "container_name=$CONTAINER_NAME"
            echo "manifest_path=$MANIFEST_PATH"
            echo "namespace=$NAMESPACE"
            echo "aws_secret_arn=$AWS_SECRET_ARN"
            echo "k8s_secret_name=$K8S_SECRET_NAME"
            echo "k8s_api_host=$K8S_API_HOST"
            echo "k8s_type=$K8S_TYPE"
            echo "deploy_method=$DEPLOY_METHOD"
            echo "product=$PRODUCT"
            echo "service=$SERVICE"
            echo "chart=$CHART"
            echo "charts_ref=$CHARTS_REF"
          } >> "$GITHUB_OUTPUT"

          echo "Inputs validated: environment=$ENVIRONMENT image=$DOCKER_IMAGE_NAME"

  build-and-push:
    name: Build and Push to ECR
    needs: validate-inputs
    uses: ./.github/workflows/build-ecr.yml
    with:
      environment: ${{ needs.validate-inputs.outputs.environment }}
      env_region: ${{ needs.validate-inputs.outputs.env_region }}
      docker_image_name: ${{ needs.validate-inputs.outputs.docker_image_name }}
      app_path: ${{ needs.validate-inputs.outputs.app_path }}
      docker_context: ${{ needs.validate-inputs.outputs.docker_context }}
      ecr_repository: ${{ needs.validate-inputs.outputs.ecr_repository }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  deploy-k8s:
    name: Deploy to Kubernetes (EKS)
    if: ${{ needs.validate-inputs.outputs.k8s_type == 'EKS' }}
    needs: [validate-inputs, build-and-push]
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      aws_secret_arn: ${{ needs.validate-inputs.outputs.aws_secret_arn }}
      container_name: ${{ needs.validate-inputs.outputs.container_name }}
      deployment_name: ${{ needs.validate-inputs.outputs.deployment_name }}
      docker_image_name: ${{ needs.validate-inputs.outputs.docker_image_name }}
      env_region: ${{ needs.validate-inputs.outputs.env_region }}
      environment: ${{ needs.validate-inputs.outputs.environment }}
      image: ${{ needs.build-and-push.outputs.image }}
      k8s_secret_name: ${{ needs.validate-inputs.outputs.k8s_secret_name }}
      manifest_path: ${{ needs.validate-inputs.outputs.manifest_path }}
      namespace: ${{ needs.validate-inputs.outputs.namespace }}
      deploy_method: ${{ needs.validate-inputs.outputs.deploy_method }}
      product: ${{ needs.validate-inputs.outputs.product }}
      service: ${{ needs.validate-inputs.outputs.service }}
      chart: ${{ needs.validate-inputs.outputs.chart }}
      charts_ref: ${{ needs.validate-inputs.outputs.charts_ref }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      AWS_SECRET_ARN: ${{ secrets.AWS_SECRET_ARN }}

  deploy-k8s-kubeadm:
    name: Deploy to Kubernetes (Kubeadm)
    needs: [validate-inputs, build-and-push]
    if: ${{ needs.validate-inputs.outputs.k8s_type != 'EKS' }}
    uses: ./.github/workflows/deploy-k8s-kubeadm.yml
    with:
      aws_secret_arn: ${{ needs.validate-inputs.outputs.aws_secret_arn }}
      container_name: ${{ needs.validate-inputs.outputs.container_name }}
      deployment_name: ${{ needs.validate-inputs.outputs.deployment_name }}
      docker_image_name: ${{ needs.validate-inputs.outputs.docker_image_name }}
      ecr_repository: ${{ needs.validate-inputs.outputs.ecr_repository }}
      env_region: ${{ needs.validate-inputs.outputs.env_region }}
      environment: ${{ needs.validate-inputs.outputs.environment }}
      k8s_api_host: ${{ needs.validate-inputs.outputs.k8s_api_host }}
      k8s_secret_name: ${{ needs.validate-inputs.outputs.k8s_secret_name }}
      manifest_path: ${{ needs.validate-inputs.outputs.manifest_path }}
      namespace: ${{ needs.validate-inputs.outputs.namespace }}
      image: ${{ needs.build-and-push.outputs.image }}
      deploy_method: ${{ needs.validate-inputs.outputs.deploy_method }}
      product: ${{ needs.validate-inputs.outputs.product }}
      service: ${{ needs.validate-inputs.outputs.service }}
      chart: ${{ needs.validate-inputs.outputs.chart }}
      charts_ref: ${{ needs.validate-inputs.outputs.charts_ref }}
    secrets:
      AWS_SECRET_ARN: ${{ secrets.AWS_SECRET_ARN }}
      DEV_KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      K8S_INSTANCE_ID: ${{ secrets.K8S_INSTANCE_ID }}
