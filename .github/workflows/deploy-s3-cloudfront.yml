name: Deploy - S3 and CloudFront

# Static hosting path for Angular and React builds.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      bucket:
        description: "Destination S3 bucket. Falls back to the STATIC_SITE_BUCKET environment variable."
        required: false
        type: string
        default: ""
      source_path:
        description: "Directory to upload."
        required: false
        type: string
        default: "dist"
      destination_prefix:
        description: "Key prefix inside the bucket. Leave empty to publish at the bucket root."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Workflow artifact to download instead of rebuilding. Leave empty to upload from the checkout."
        required: false
        type: string
        default: ""
      distribution_id:
        description: "CloudFront distribution to invalidate. Falls back to the CLOUDFRONT_DISTRIBUTION_ID environment variable."
        required: false
        type: string
        default: ""
      invalidation_paths:
        description: "Space separated paths to invalidate."
        required: false
        type: string
        default: "/*"
      delete_removed:
        description: "Delete objects in the bucket that no longer exist in the source."
        required: false
        type: boolean
        default: true
      aws_region:
        description: "Region override. Falls back to the AWS_REGION environment variable."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 20
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to S3 and CloudFront
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        if: inputs.artifact_name == ''
        uses: actions/checkout@v4

      - name: Download build artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.source_path }}

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@main
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: deploy-static

      - name: Sync to S3
        env:
          BUCKET: ${{ inputs.bucket != '' && inputs.bucket || vars.STATIC_SITE_BUCKET }}
          SOURCE_PATH: ${{ inputs.source_path }}
          DESTINATION_PREFIX: ${{ inputs.destination_prefix }}
          DELETE_REMOVED: ${{ inputs.delete_removed }}
        run: |
          set -euo pipefail

          if [ -z "$BUCKET" ]; then
            echo "::error title=Missing bucket::Provide the 'bucket' input or set the STATIC_SITE_BUCKET variable on environment '${{ inputs.environment }}'."
            exit 1
          fi

          if [ ! -d "$SOURCE_PATH" ]; then
            echo "::error title=Missing source::'$SOURCE_PATH' is not a directory. Check that the build ran and produced output."
            exit 1
          fi

          target="s3://${BUCKET}"
          [ -n "$DESTINATION_PREFIX" ] && target="${target}/${DESTINATION_PREFIX%/}"

          common=()
          [ "$DELETE_REMOVED" = "true" ] && common+=(--delete)

          # Fingerprinted assets are safe to cache forever. Entry points are not:
          # serving a stale index.html pins users to the previous release.
          aws s3 sync "$SOURCE_PATH" "$target" \
            "${common[@]}" \
            --exclude "index.html" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "ngsw.json" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 sync "$SOURCE_PATH" "$target" \
            --exclude "*" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "ngsw.json" \
            --cache-control "no-cache,no-store,must-revalidate"

          echo "Synced $SOURCE_PATH to $target"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ inputs.distribution_id != '' && inputs.distribution_id || vars.CLOUDFRONT_DISTRIBUTION_ID }}
          INVALIDATION_PATHS: ${{ inputs.invalidation_paths }}
        run: |
          set -euo pipefail

          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "::notice title=No invalidation::No CloudFront distribution was supplied; skipping."
            exit 0
          fi

          # shellcheck disable=SC2086
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths $INVALIDATION_PATHS \
            --query 'Invalidation.Id' \
            --output text)"

          echo "Invalidation $invalidation_id created; waiting for it to complete."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$invalidation_id"

          {
            echo "### Static site published"
            echo ""
            echo "- Distribution: \`${DISTRIBUTION_ID}\`"
            echo "- Invalidation: \`${invalidation_id}\`"
          } >> "$GITHUB_STEP_SUMMARY"
