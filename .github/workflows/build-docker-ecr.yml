name: Build - Docker to ECR

# The registry-based build path. Preferred over the S3 tarball path for anything
# that pulls images natively: EKS, Lambda container functions, ECS.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      ecr_repository:
        description: "ECR repository name."
        required: true
        type: string
      app_path:
        description: "Path to the application directory, relative to the repository root."
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to app_path."
        required: false
        type: string
        default: "Dockerfile"
      build_args:
        description: "Extra build arguments, one KEY=value per line. ENV is always passed."
        required: false
        type: string
        default: ""
      target:
        description: "Dockerfile stage to stop at, for multi-stage builds."
        required: false
        type: string
        default: ""
      platforms:
        description: "Target platforms. Use linux/arm64 for Graviton nodes."
        required: false
        type: string
        default: "linux/amd64"
      version:
        description: "Version to tag the image with. Leave empty to derive one."
        required: false
        type: string
        default: ""
      version_strategy:
        description: "Passed to compute-version: auto, tag, manifest or run-number."
        required: false
        type: string
        default: "auto"
      create_repository:
        description: "Create the ECR repository when it does not exist."
        required: false
        type: boolean
        default: false
      aws_region:
        description: "Region override. Falls back to the AWS_REGION environment variable."
        required: false
        type: string
        default: ""
      cleanup_runner:
        description: "Free disk space on the runner before building."
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 60
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
    outputs:
      image_uri:
        description: "Fully qualified image reference, tagged with the computed version."
        value: ${{ jobs.build-and-push.outputs.image_uri }}
      image_digest:
        description: "Image digest. Deploy by digest for a guaranteed-immutable reference."
        value: ${{ jobs.build-and-push.outputs.image_digest }}
      version:
        description: "Version applied to the image."
        value: ${{ jobs.build-and-push.outputs.version }}
      region:
        description: "AWS region the image was pushed to."
        value: ${{ jobs.build-and-push.outputs.region }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build Image and Push to ECR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    outputs:
      image_uri: ${{ steps.build.outputs.image-ref }}
      image_digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      region: ${{ steps.aws.outputs.region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner disk space
        if: inputs.cleanup_runner
        uses: Ennovative-Genix/sgx-github-actions/actions/runner-disk-cleanup@v2

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@v2
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: build-ecr

      - name: Compute version
        id: version
        uses: Ennovative-Genix/sgx-github-actions/actions/compute-version@v2
        with:
          strategy: ${{ inputs.version_strategy }}
          working-directory: ${{ inputs.app_path }}
          environment: ${{ inputs.environment }}
          version-override: ${{ inputs.version }}

      - name: Log in to ECR
        id: ecr
        uses: Ennovative-Genix/sgx-github-actions/actions/ecr-login@v2
        with:
          repository: ${{ inputs.ecr_repository }}
          create-repository: ${{ inputs.create_repository }}

      - name: Build and push image
        id: build
        uses: Ennovative-Genix/sgx-github-actions/actions/docker-build@v2
        with:
          image-name: ${{ inputs.ecr_repository }}
          registry: ${{ steps.ecr.outputs.registry }}
          tags: ${{ steps.version.outputs.image-tags }}
          context: ${{ inputs.app_path }}
          dockerfile: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            ENV=${{ inputs.environment }}
            APP_VERSION=${{ steps.version.outputs.version }}
            ${{ inputs.build_args }}
          push: "true"
          load: "false"

      - name: Summarise
        env:
          IMAGE_URI: ${{ steps.build.outputs.image-ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image pushed to ECR"
            echo ""
            echo "- Reference: \`${IMAGE_URI}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
