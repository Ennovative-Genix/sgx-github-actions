name: Deploy - Lambda

# The project owns building and zipping. This workflow installs the toolchain,
# runs the project's own build and zip entry points, then uploads the resulting
# zip straight to Lambda -- no S3 hop.
#
#   nodejs  ->  npm run <npm_build_script>  then  npm run <npm_zip_script>
#   python  ->  bash <build_script>         then  bash <zip_script>

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, uat, stg, prod). Binds the approval rules and supplies AWS_REGION."
        required: true
        type: string
      function_name:
        description: "Name or ARN of the Lambda function to update."
        required: true
        type: string
      runtime:
        description: "Runtime family: 'nodejs' or 'python'. Selects which toolchain is installed and which build/zip entry points are used."
        required: true
        type: string
      app_path:
        description: "Directory the build and zip entry points run in, relative to the repository root. Script paths are resolved from here too."
        required: false
        type: string
        default: "."
      artifact_path:
        description: "Path to the zip the project produces, relative to app_path. Empty searches app_path for exactly one .zip and fails if it finds none or several."
        required: false
        type: string
        default: ""
      npm_build_script:
        description: "npm script that builds the function, run as 'npm run <name>'. Empty skips the build. nodejs only."
        required: false
        type: string
        default: "build"
      npm_zip_script:
        description: "npm script that produces the deployment zip, run as 'npm run <name>'. Empty skips it, for projects whose build script already zips. nodejs only."
        required: false
        type: string
        default: "zip"
      build_script:
        description: "Path to the script that builds the function, relative to app_path. Required when runtime is 'python'. It also owns installing the project's dependencies."
        required: false
        type: string
        default: ""
      zip_script:
        description: "Path to the script that produces the deployment zip, relative to app_path. Required when runtime is 'python'."
        required: false
        type: string
        default: ""
      python_package_manager:
        description: "Tool installed for the python path before build_script runs: 'uv' or 'pip'. The scripts decide how to use it."
        required: false
        type: string
        default: "uv"
      node_version:
        description: "Node.js version installed for the nodejs path."
        required: false
        type: string
        default: "24.x"
      python_version:
        description: "Python version installed for the python path. Match the function's configured runtime."
        required: false
        type: string
        default: "3.12"
      architecture:
        description: "Architecture recorded on the function: 'x86_64' or 'arm64'. Empty leaves the function's own setting untouched, which is almost always what you want -- the build already decided this."
        required: false
        type: string
        default: ""
      aws_region:
        description: "Region holding the function. Empty falls back to the environment's AWS_REGION variable."
        required: false
        type: string
        default: ""
      lint_command:
        description: "Shell command used for linting, run in app_path after the build. Empty skips linting."
        required: false
        type: string
        default: ""
      test_command:
        description: "Shell command used for testing, run in app_path after the build. Empty skips testing."
        required: false
        type: string
        default: ""
      publish:
        description: "Publish an immutable numbered version after the code update settles."
        required: false
        type: boolean
        default: true
      alias:
        description: "Alias moved to the newly published version, e.g. 'live'. Empty leaves aliases alone. Requires publish."
        required: false
        type: string
        default: ""
      codeartifact_domain:
        description: "CodeArtifact domain the dependencies come from. Empty installs from the public registry."
        required: false
        type: string
        default: ""
      codeartifact_repository:
        description: "CodeArtifact repository the dependencies come from. Required when codeartifact_domain is set."
        required: false
        type: string
        default: ""
      codeartifact_namespace:
        description: "npm scope bound to CodeArtifact, without the leading @. Empty points the whole registry at CodeArtifact. nodejs only."
        required: false
        type: string
        default: ""
      codeartifact_region:
        description: "Region the CodeArtifact domain lives in -- where the domain is, not where this deploys. Empty uses the deployment region."
        required: false
        type: string
        default: ""
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication"
        required: true
    outputs:
      function_version:
        description: "Version that was published, or '$LATEST' when publish is false."
        value: ${{ jobs.deploy.outputs.function_version }}
      code_sha256:
        description: "CodeSha256 of the deployed package. Identifies the exact bytes now running."
        value: ${{ jobs.deploy.outputs.code_sha256 }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # Binds the approval rules and the environment-scoped AWS_REGION variable
    # that aws-oidc-auth falls back to.
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    outputs:
      function_version: ${{ steps.deploy.outputs.function_version }}
      code_sha256: ${{ steps.update.outputs.code_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # Fail on a misconfigured call before spending a toolchain install and a
      # build on it. Every message names the input that has to change.
      - name: Validate inputs
        env:
          RUNTIME: ${{ inputs.runtime }}
          APP_PATH: ${{ inputs.app_path }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          ZIP_SCRIPT: ${{ inputs.zip_script }}
          PY_PACKAGE_MANAGER: ${{ inputs.python_package_manager }}
          ARCHITECTURE: ${{ inputs.architecture }}
          PUBLISH: ${{ inputs.publish }}
          ALIAS: ${{ inputs.alias }}
          CA_DOMAIN: ${{ inputs.codeartifact_domain }}
          CA_REPOSITORY: ${{ inputs.codeartifact_repository }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error title=$1::$2"
            exit 1
          }

          case "$RUNTIME" in
            nodejs|python) ;;
            *) fail "Unsupported runtime" "runtime must be 'nodejs' or 'python'; got '$RUNTIME'." ;;
          esac

          [ -d "$APP_PATH" ] || fail "Missing app_path" "app_path '$APP_PATH' does not exist in the repository."

          if [ "$RUNTIME" = "python" ]; then
            # Required rather than defaulted: there is no python equivalent of
            # `npm run --if-present`, so a guessed path would fail deep in the
            # build with a confusing error instead of here.
            [ -n "$BUILD_SCRIPT" ] || fail "Missing build_script" "runtime 'python' requires build_script, a path relative to app_path."
            [ -n "$ZIP_SCRIPT" ] || fail "Missing zip_script" "runtime 'python' requires zip_script, a path relative to app_path."

            for script in "$BUILD_SCRIPT" "$ZIP_SCRIPT"; do
              [ -f "$APP_PATH/$script" ] || fail "Script not found" "'$script' does not exist under app_path '$APP_PATH'."
            done

            case "$PY_PACKAGE_MANAGER" in
              uv|pip) ;;
              *) fail "Unsupported package manager" "python_package_manager must be 'uv' or 'pip'; got '$PY_PACKAGE_MANAGER'." ;;
            esac
          fi

          if [ -n "$ARCHITECTURE" ]; then
            case "$ARCHITECTURE" in
              x86_64|arm64) ;;
              *) fail "Unsupported architecture" "architecture must be 'x86_64', 'arm64' or empty; got '$ARCHITECTURE'." ;;
            esac
          fi

          # An alias can only point at a numbered version, and only `publish`
          # creates one. Silently ignoring the alias would look like success.
          if [ -n "$ALIAS" ] && [ "$PUBLISH" != "true" ]; then
            fail "Alias without publish" "alias '$ALIAS' needs a numbered version to point at; set publish: true or clear alias."
          fi

          if [ -n "$CA_DOMAIN" ] && [ -z "$CA_REPOSITORY" ]; then
            fail "Incomplete CodeArtifact config" "codeartifact_domain is set, so codeartifact_repository is required."
          fi

          echo "Inputs validated for runtime '$RUNTIME'."

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@development
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: lambda-deploy

      - name: CodeArtifact token generation
        id: codeartifact
        if: inputs.codeartifact_domain != ''
        uses: Ennovative-Genix/sgx-github-actions/actions/codeartifact-token@development
        env:
          # The domain can live in a different region from the function. The
          # action shells out to the CLI, which reads this.
          AWS_REGION: ${{ inputs.codeartifact_region != '' && inputs.codeartifact_region || steps.aws.outputs.region }}
        with:
          domain: ${{ inputs.codeartifact_domain }}
          domain-owner: ${{ steps.aws.outputs.account-id }}

      # --- nodejs toolchain -------------------------------------------------

      - name: Setup Node.js
        if: inputs.runtime == 'nodejs'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Point npm at CodeArtifact
        if: inputs.runtime == 'nodejs' && inputs.codeartifact_domain != ''
        env:
          CA_DOMAIN: ${{ inputs.codeartifact_domain }}
          CA_REPOSITORY: ${{ inputs.codeartifact_repository }}
          CA_NAMESPACE: ${{ inputs.codeartifact_namespace }}
          CA_OWNER: ${{ steps.aws.outputs.account-id }}
          CA_REGION: ${{ inputs.codeartifact_region != '' && inputs.codeartifact_region || steps.aws.outputs.region }}
          CA_TOKEN: ${{ steps.codeartifact.outputs.token }}
        run: |
          set -euo pipefail

          endpoint="$(aws codeartifact get-repository-endpoint \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_OWNER" \
            --repository "$CA_REPOSITORY" \
            --region "$CA_REGION" \
            --format npm \
            --query repositoryEndpoint \
            --output text)"

          # A scope keeps public packages on the public registry; without one the
          # whole registry moves, and every dependency has to exist upstream.
          if [ -n "$CA_NAMESPACE" ]; then
            npm config set "@${CA_NAMESPACE}:registry" "$endpoint"
          else
            npm config set registry "$endpoint"
          fi

          # npm keys credentials on the registry URL with the scheme stripped.
          npm config set "${endpoint#https:}:_authToken" "$CA_TOKEN"

          echo "npm authenticated against ${CA_DOMAIN}/${CA_REPOSITORY}."

      - name: Install npm dependencies
        if: inputs.runtime == 'nodejs'
        working-directory: ${{ inputs.app_path }}
        run: |
          set -euo pipefail

          # `npm ci` requires a lockfile that agrees with package.json. Fall back
          # rather than fail so a repository mid-migration still builds.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::warning title=No lockfile::No package-lock.json in '$(pwd)'; falling back to 'npm install'."
            npm install
          fi

      # --- python toolchain -------------------------------------------------

      - name: Setup Python
        if: inputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup uv
        if: inputs.runtime == 'python' && inputs.python_package_manager == 'uv'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Point pip and uv at CodeArtifact
        if: inputs.runtime == 'python' && inputs.codeartifact_domain != ''
        env:
          CA_DOMAIN: ${{ inputs.codeartifact_domain }}
          CA_REPOSITORY: ${{ inputs.codeartifact_repository }}
          CA_OWNER: ${{ steps.aws.outputs.account-id }}
          CA_REGION: ${{ inputs.codeartifact_region != '' && inputs.codeartifact_region || steps.aws.outputs.region }}
          CA_TOKEN: ${{ steps.codeartifact.outputs.token }}
        run: |
          set -euo pipefail

          endpoint="$(aws codeartifact get-repository-endpoint \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_OWNER" \
            --repository "$CA_REPOSITORY" \
            --region "$CA_REGION" \
            --format pypi \
            --query repositoryEndpoint \
            --output text)"

          # The endpoint carries a trailing slash; PEP 503 lives under simple/.
          index="https://aws:${CA_TOKEN}@${endpoint#https://}simple/"

          # The token inside the URL is already masked by the token action, so
          # the value logs as https://aws:***@... rather than leaking.
          {
            echo "PIP_INDEX_URL=$index"
            echo "UV_INDEX_URL=$index"
          } >> "$GITHUB_ENV"

          echo "pip and uv pointed at ${CA_DOMAIN}/${CA_REPOSITORY}."

      # --- build, verify, package -------------------------------------------

      # Build first, then lint and test. On the python path build_script is also
      # what installs the project's dependencies, so anything the linter or the
      # test suite imports only exists once it has run.
      - name: Build
        if: (inputs.runtime == 'nodejs' && inputs.npm_build_script != '') || inputs.runtime == 'python'
        working-directory: ${{ inputs.app_path }}
        env:
          RUNTIME: ${{ inputs.runtime }}
          NPM_BUILD_SCRIPT: ${{ inputs.npm_build_script }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$RUNTIME" = "nodejs" ]; then
            npm run "$NPM_BUILD_SCRIPT"
          else
            # Executable scripts run on their own shebang, so a build_script
            # written in python works as well as one written in sh.
            if [ -x "$BUILD_SCRIPT" ]; then
              "./$BUILD_SCRIPT"
            else
              bash "$BUILD_SCRIPT"
            fi
          fi

      - name: Lint
        if: inputs.lint_command != ''
        working-directory: ${{ inputs.app_path }}
        run: ${{ inputs.lint_command }}

      - name: Test
        if: inputs.test_command != ''
        working-directory: ${{ inputs.app_path }}
        run: ${{ inputs.test_command }}

      - name: Package
        if: (inputs.runtime == 'nodejs' && inputs.npm_zip_script != '') || inputs.runtime == 'python'
        working-directory: ${{ inputs.app_path }}
        env:
          RUNTIME: ${{ inputs.runtime }}
          NPM_ZIP_SCRIPT: ${{ inputs.npm_zip_script }}
          ZIP_SCRIPT: ${{ inputs.zip_script }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$RUNTIME" = "nodejs" ]; then
            npm run "$NPM_ZIP_SCRIPT"
          else
            if [ -x "$ZIP_SCRIPT" ]; then
              "./$ZIP_SCRIPT"
            else
              bash "$ZIP_SCRIPT"
            fi
          fi

      - name: Locate deployment package
        id: artifact
        working-directory: ${{ inputs.app_path }}
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          set -euo pipefail

          if [ -n "$ARTIFACT_PATH" ]; then
            [ -f "$ARTIFACT_PATH" ] || {
              echo "::error title=Package not found::artifact_path '$ARTIFACT_PATH' does not exist under app_path after the zip step ran."
              exit 1
            }
            zip_path="$ARTIFACT_PATH"
          else
            # Bounded depth and pruned vendor directories: a dependency shipping
            # its own fixture .zip must not be mistaken for the build output.
            mapfile -t found < <(
              find . -maxdepth 3 -type f -name '*.zip' \
                -not -path './node_modules/*' \
                -not -path './.git/*' \
                -not -path './.venv/*' \
                -not -path './venv/*' \
                | sort
            )

            if [ "${#found[@]}" -eq 0 ]; then
              echo "::error title=No package produced::No .zip found under app_path '$(pwd)'. Check the zip step, or set artifact_path."
              exit 1
            fi

            if [ "${#found[@]}" -gt 1 ]; then
              printf '::error title=Ambiguous package::Found %d zips under app_path; set artifact_path to name the deployment package.\n' "${#found[@]}"
              printf '  %s\n' "${found[@]}"
              exit 1
            fi

            zip_path="${found[0]}"
          fi

          bytes="$(stat -c%s "$zip_path")"

          # Uploading the zip in the API request caps the payload at 50 MiB.
          # This used to go via S3, which allowed far more, so the failure needs
          # to name the limit rather than surface as a generic RequestEntityTooLarge.
          limit=$((50 * 1024 * 1024))
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error title=Package too large::'$zip_path' is $((bytes / 1024 / 1024)) MiB; a direct Lambda upload is capped at 50 MiB. Trim the package or deploy it via S3."
            exit 1
          fi

          {
            echo "path=$(realpath "$zip_path")"
            echo "bytes=$bytes"
          } >> "$GITHUB_OUTPUT"

          echo "Deployment package: $zip_path ($((bytes / 1024)) KiB)"

      # --- deploy -----------------------------------------------------------

      - name: Update function code
        id: update
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
          ZIP_PATH: ${{ steps.artifact.outputs.path }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail

          args=(--function-name "$FUNCTION_NAME" --zip-file "fileb://${ZIP_PATH}")

          # Only sent when the caller asked for it: passing the default would
          # silently flip a Graviton function back to x86_64.
          [ -n "$ARCHITECTURE" ] && args+=(--architectures "$ARCHITECTURE")

          code_sha="$(aws lambda update-function-code "${args[@]}" \
            --query CodeSha256 --output text)"

          echo "code_sha256=$code_sha" >> "$GITHUB_OUTPUT"
          echo "Code updated; CodeSha256 $code_sha."

      # An update is asynchronous. Publishing before it settles would stamp a
      # version onto code that has not finished coming up.
      - name: Wait for the update to settle
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
        run: |
          set -euo pipefail

          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

          status="$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'LastUpdateStatus' --output text)"

          if [ "$status" != "Successful" ]; then
            reason="$(aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatusReason' --output text)"
            echo "::error title=Update did not succeed::LastUpdateStatus is '$status': $reason"
            exit 1
          fi

          echo "Function reached LastUpdateStatus: Successful."

      - name: Publish version and move alias
        id: deploy
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
          CODE_SHA256: ${{ steps.update.outputs.code_sha256 }}
          PUBLISH: ${{ inputs.publish }}
          ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH" != "true" ]; then
            echo "function_version=\$LATEST" >> "$GITHUB_OUTPUT"
            echo "publish is false; the function runs \$LATEST."
            exit 0
          fi

          # --code-sha256 makes this a compare-and-swap: two runs racing cannot
          # publish each other's code under their own version number.
          version="$(aws lambda publish-version \
            --function-name "$FUNCTION_NAME" \
            --code-sha256 "$CODE_SHA256" \
            --description "${GITHUB_REF_NAME}@${GITHUB_SHA} (run ${GITHUB_RUN_ID})" \
            --query Version --output text)"

          echo "function_version=$version" >> "$GITHUB_OUTPUT"
          echo "Published version $version."

          if [ -z "$ALIAS" ]; then
            exit 0
          fi

          if previous="$(aws lambda get-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS" \
              --query FunctionVersion --output text 2>/dev/null)"; then
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS" \
              --function-version "$version" >/dev/null
            echo "previous_version=$previous" >> "$GITHUB_OUTPUT"
            echo "Alias '$ALIAS' moved from version $previous to $version."
          else
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS" \
              --function-version "$version" >/dev/null
            echo "Alias '$ALIAS' created at version $version."
          fi

      - name: Summarise
        if: always() && steps.update.outcome == 'success'
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
          VERSION: ${{ steps.deploy.outputs.function_version }}
          PREVIOUS_VERSION: ${{ steps.deploy.outputs.previous_version }}
          CODE_SHA256: ${{ steps.update.outputs.code_sha256 }}
          ARTIFACT_BYTES: ${{ steps.artifact.outputs.bytes }}
          ALIAS: ${{ inputs.alias }}
          REGION: ${{ steps.aws.outputs.region }}
        run: |
          {
            echo "### Lambda deployed"
            echo ""
            echo "- Function: \`${FUNCTION_NAME}\`"
            echo "- Region: \`${REGION}\`"
            echo "- Version: \`${VERSION:-\$LATEST}\`"
            echo "- CodeSha256: \`${CODE_SHA256}\`"
            echo "- Package: $((ARTIFACT_BYTES / 1024)) KiB"

            if [ -n "$ALIAS" ] && [ -n "${PREVIOUS_VERSION:-}" ]; then
              echo ""
              echo "Roll back with:"
              echo ""
              echo '```bash'
              echo "aws lambda update-alias --function-name ${FUNCTION_NAME} \\"
              echo "  --name ${ALIAS} --function-version ${PREVIOUS_VERSION} --region ${REGION}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
