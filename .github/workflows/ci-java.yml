name: CI - Java

on:
  workflow_call:
    inputs:
      java_versions:
        description: 'JSON array of JDK versions to build against, e.g. ''["17","21"]''.'
        required: false
        type: string
        default: '["21"]'
      distribution:
        description: "JDK distribution, as accepted by actions/setup-java."
        required: false
        type: string
        default: "temurin"
      build_tool:
        description: "maven or gradle."
        required: false
        type: string
        default: "maven"
      app_path:
        description: "Path to the module directory, relative to the repository root."
        required: false
        type: string
        default: "."
      run_test:
        description: "Run the test phase."
        required: false
        type: boolean
        default: true
      build_args:
        description: "Extra arguments appended to the build command."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Upload the packaged output under this artifact name. Leave empty to skip."
        required: false
        type: string
        default: ""
      artifact_path:
        description: "Path to upload, relative to app_path."
        required: false
        type: string
        default: ""
      artifact_retention_days:
        description: "How long to keep the uploaded artifact."
        required: false
        type: number
        default: 7
      aws_region:
        description: "Region used for CodeArtifact."
        required: false
        type: string
        default: ""
      codeartifact_domain:
        description: "CodeArtifact domain for private dependencies. Leave empty to use Maven Central."
        required: false
        type: string
        default: ""
      codeartifact_repository:
        description: "CodeArtifact repository."
        required: false
        type: string
        default: ""
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain."
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner label."
        required: false
        type: string
        default: "ubuntu-latest"
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 45
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM role for OIDC. Only needed when pulling from CodeArtifact."
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java-version }})
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        java-version: ${{ fromJSON(inputs.java_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.codeartifact_domain != ''
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@v2
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: ci-java

      - name: Setup JDK
        uses: Ennovative-Genix/sgx-github-actions/actions/setup-java@v2
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ inputs.distribution }}
          build-tool: ${{ inputs.build_tool }}
          working-directory: ${{ inputs.app_path }}
          codeartifact-domain: ${{ inputs.codeartifact_domain }}
          codeartifact-repository: ${{ inputs.codeartifact_repository }}
          codeartifact-domain-owner: ${{ inputs.codeartifact_domain_owner }}
          codeartifact-region: ${{ inputs.aws_region }}

      - name: Build
        working-directory: ${{ inputs.app_path }}
        env:
          BUILD_TOOL: ${{ inputs.build_tool }}
          RUN_TEST: ${{ inputs.run_test }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail

          if [ "$BUILD_TOOL" = "gradle" ]; then
            task="build"
            [ "$RUN_TEST" = "true" ] || task="build -x test"
            # shellcheck disable=SC2086
            ./gradlew --no-daemon $task $BUILD_ARGS
          else
            goal="package"
            [ "$RUN_TEST" = "true" ] || goal="package -DskipTests"
            # shellcheck disable=SC2086
            mvn --batch-mode --no-transfer-progress $goal $BUILD_ARGS
          fi

      - name: Publish test report
        if: always() && inputs.run_test
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java-version }}
          path: |
            ${{ inputs.app_path }}/**/target/surefire-reports/**
            ${{ inputs.app_path }}/**/build/test-results/**
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore

      - name: Upload build output
        if: inputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-jdk${{ matrix.java-version }}
          path: ${{ inputs.app_path }}/${{ inputs.artifact_path != '' && inputs.artifact_path || (inputs.build_tool == 'gradle' && 'build/libs') || 'target/*.jar' }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
