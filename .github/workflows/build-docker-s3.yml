name: Build - Docker to S3

# Builds a container image and ships it to S3 as a tarball. Used by the EC2
# deployment path, where instances pull from S3 over SSM rather than from a
# registry.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      docker_image_name:
        description: "Docker image name."
        required: true
        type: string
      s3_path:
        description: "S3 key prefix for uploads."
        required: true
        type: string
      app_path:
        description: "Path to the application directory, relative to the repository root."
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path, relative to app_path."
        required: false
        type: string
        default: "Dockerfile"
      build_args:
        description: "Extra build arguments, one KEY=value per line. ENV is always passed."
        required: false
        type: string
        default: ""
      target:
        description: "Dockerfile stage to stop at, for multi-stage builds."
        required: false
        type: string
        default: ""
      version:
        description: "Version label for the archived image. Leave empty to derive one."
        required: false
        type: string
        default: ""
      version_strategy:
        description: "Passed to compute-version: auto, tag, manifest or run-number."
        required: false
        type: string
        default: "auto"
      aws_region:
        description: "Region override. Defaults to the AWS_REGION environment variable on the target environment."
        required: false
        type: string
        default: ""
      cleanup_runner:
        description: "Free disk space on the runner before building. Needed for large images."
        required: false
        type: boolean
        default: true
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 60
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
    outputs:
      version:
        description: "Version label applied to the archived image."
        value: ${{ jobs.build-docker-upload.outputs.version }}
      version_key:
        description: "S3 key of the immutable copy. Pass this to a rollback workflow."
        value: ${{ jobs.build-docker-upload.outputs.version_key }}
      region:
        description: "AWS region the image was uploaded to."
        value: ${{ jobs.build-docker-upload.outputs.region }}

permissions:
  contents: read

jobs:
  build-docker-upload:
    name: Build Image and Upload to S3
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_key: ${{ steps.upload.outputs.version-key }}
      region: ${{ steps.aws.outputs.region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs as a step, not a separate job: each job gets its own runner, so
      # freeing disk anywhere else does nothing for this build.
      - name: Free up runner disk space
        if: inputs.cleanup_runner
        uses: Ennovative-Genix/sgx-github-actions/actions/runner-disk-cleanup@v2

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@v2
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: build-s3

      - name: Compute version
        id: version
        uses: Ennovative-Genix/sgx-github-actions/actions/compute-version@v2
        with:
          strategy: ${{ inputs.version_strategy }}
          working-directory: ${{ inputs.app_path }}
          environment: ${{ inputs.environment }}
          version-override: ${{ inputs.version }}

      - name: Build image
        id: build
        uses: Ennovative-Genix/sgx-github-actions/actions/docker-build@v2
        with:
          image-name: ${{ inputs.docker_image_name }}
          tags: latest
          context: ${{ inputs.app_path }}
          dockerfile: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: |
            ENV=${{ inputs.environment }}
            APP_VERSION=${{ steps.version.outputs.version }}
            ${{ inputs.build_args }}
          # The image has to exist in the local daemon before `docker save`.
          load: "true"
          push: "false"

      - name: Upload image to S3
        id: upload
        uses: Ennovative-Genix/sgx-github-actions/actions/s3-image-upload@v2
        with:
          image-ref: ${{ steps.build.outputs.image-ref }}
          bucket: ${{ vars.S3_BUILD_BUCKET }}
          s3-path: ${{ inputs.s3_path }}
          region: ${{ steps.aws.outputs.region }}
          version: ${{ steps.version.outputs.version }}
