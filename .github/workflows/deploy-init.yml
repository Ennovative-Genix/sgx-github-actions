permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, uat, stg, prod)"
        required: true
        type: string
      docker_image_name:
        description: "Docker image name"
        required: true
        type: string
      s3_path:
        description: "S3 path prefix for uploads/downloads"
        required: true
        type: string
      app_path:
        description: "Path to the application directory (relative to repo root). Defaults to root."
        required: false
        type: string
        default: "."
      is_ui_app:
        description: "Whether the app is a UI app"
        required: false
        type: boolean
        default: false
      is_nx_app:
        description: "Whether the app is an NX app"
        required: false
        type: boolean
        default: false
      codeartifact_domain:
        description: "CodeArtifact domain to authenticate against, so package installs inside the Docker build can reach it. Empty disables CodeArtifact auth entirely."
        required: false
        type: string
        default: ""
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain. Defaults to the calling account."
        required: false
        type: string
        default: ""
      codeartifact_token_as_build_arg:
        description: "Also pass the token as a --build-arg for Dockerfiles that cannot use a secret mount. Off by default: build args are recorded in the image history."
        required: false
        type: boolean
        default: false
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication"
        required: true
      EC2_INSTANCE_ID:
        description: "Target EC2 Instance ID"
        required: true
      AWS_SECRETS_ARN:
        description: "AWS Secrets Manager ARN"
        required: false
jobs:
  pre-build-cleanup:
    name: Pre-Build Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Remove large preinstalled toolchains
        run: |
          sudo rm -rf /usr/local/lib/android        # ~12 GB  Android SDK + NDK
          sudo rm -rf /usr/local/.ghcup /opt/ghc    # ~6 GB   Haskell (GHC, cabal, stack)
          sudo rm -rf /usr/share/swift              # ~2 GB   Swift toolchain
          sudo rm -rf /usr/lib/jvm                  # ~2 GB   Preinstalled JDKs

  build-and-upload-nx:
    name: Build NX and Upload to S3
    needs: pre-build-cleanup
    if: ${{ inputs.is_nx_app == true }}
    uses: ./.github/workflows/build-docker-s3-nx.yml
    with:
      environment: ${{ inputs.environment }}
      docker_image_name: ${{ inputs.docker_image_name }}
      s3_path: ${{ inputs.s3_path }}
      app_path: ${{ inputs.app_path }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
      codeartifact_token_as_build_arg: ${{ inputs.codeartifact_token_as_build_arg }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  build-and-upload:
    name: Build and Upload to S3
    needs: pre-build-cleanup
    if: ${{ inputs.is_nx_app == false }}
    uses: ./.github/workflows/build-docker-s3.yml
    with:
      environment: ${{ inputs.environment }}
      docker_image_name: ${{ inputs.docker_image_name }}
      s3_path: ${{ inputs.s3_path }}
      app_path: ${{ inputs.app_path }}
      codeartifact_domain: ${{ inputs.codeartifact_domain }}
      codeartifact_domain_owner: ${{ inputs.codeartifact_domain_owner }}
      codeartifact_token_as_build_arg: ${{ inputs.codeartifact_token_as_build_arg }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  load-docker-image:
    name: Load Docker to EC2
    needs:
      - build-and-upload-nx
      - build-and-upload
    uses: ./.github/workflows/deploy-ec2-load-docker.yml
    with:
      environment: ${{ inputs.environment }}
      docker_image_name: ${{ inputs.docker_image_name }}
      s3_path: ${{ inputs.s3_path }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

  start-container:
    name: Start Container on EC2
    needs: load-docker-image
    uses: ./.github/workflows/deploy-ec2-start-container.yml
    with:
      environment: ${{ inputs.environment }}
      docker_image_name: ${{ inputs.docker_image_name }}
      is_ui_app: ${{ inputs.is_ui_app }}
      app_path: ${{ inputs.app_path }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      AWS_SECRETS_ARN: ${{ secrets.AWS_SECRETS_ARN }}
