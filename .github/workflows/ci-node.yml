name: CI - Node

# Covers Node.js, NestJS, Angular, React, Nx and plain monorepos. The framework
# input only chooses defaults; every command stays overridable.

on:
  workflow_call:
    inputs:
      framework:
        description: "node, nestjs, angular, react or nx. Selects sensible default scripts."
        required: false
        type: string
        default: "node"
      node_versions:
        description: 'JSON array of Node versions to build against, e.g. ''["20.x","22.x"]''.'
        required: false
        type: string
        default: '["20.x"]'
      package_manager:
        description: "npm, yarn or pnpm."
        required: false
        type: string
        default: "npm"
      app_path:
        description: "Path to the application directory, relative to the repository root."
        required: false
        type: string
        default: "."
      target_env:
        description: "Environment name used to pick a 'build:<env>' script when one exists."
        required: false
        type: string
        default: ""
      run_lint:
        description: "Run the lint script."
        required: false
        type: boolean
        default: true
      run_test:
        description: "Run the test script."
        required: false
        type: boolean
        default: true
      run_build:
        description: "Run the build script."
        required: false
        type: boolean
        default: true
      lint_script:
        description: "npm script used for linting."
        required: false
        type: string
        default: "lint"
      test_script:
        description: "npm script used for tests."
        required: false
        type: string
        default: "test"
      test_args:
        description: "Extra arguments appended to the test script."
        required: false
        type: string
        default: ""
      build_script:
        description: "npm script used for the build. Overrides the 'build:<target_env>' lookup."
        required: false
        type: string
        default: ""
      nx_targets:
        description: "Comma separated Nx targets to run when framework is 'nx'."
        required: false
        type: string
        default: "lint,test,build"
      nx_affected:
        description: "Run only projects affected since nx_base instead of the whole workspace."
        required: false
        type: boolean
        default: false
      nx_base:
        description: "Git ref Nx compares against. Defaults to the pull request base or the previous commit."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Upload the build output under this artifact name. Leave empty to skip."
        required: false
        type: string
        default: ""
      artifact_path:
        description: "Path to upload, relative to app_path. Defaults to 'dist'."
        required: false
        type: string
        default: "dist"
      artifact_retention_days:
        description: "How long to keep the uploaded artifact."
        required: false
        type: number
        default: 7
      aws_region:
        description: "Region used for CodeArtifact. Required when a CodeArtifact domain is set."
        required: false
        type: string
        default: ""
      codeartifact_domain:
        description: "CodeArtifact domain for private dependencies. Leave empty to use the public registry."
        required: false
        type: string
        default: ""
      codeartifact_repository:
        description: "CodeArtifact repository."
        required: false
        type: string
        default: ""
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain."
        required: false
        type: string
        default: ""
      codeartifact_namespace:
        description: "npm scope bound to CodeArtifact, without the leading @."
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner label."
        required: false
        type: string
        default: "ubuntu-latest"
      timeout_minutes:
        description: "Job timeout."
        required: false
        type: number
        default: 30
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM role for OIDC. Only needed when pulling from CodeArtifact."
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      id-token: write
      contents: read

    strategy:
      # One failing Node version should not hide the results of the others.
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Nx needs history to work out what changed; everything else does not.
          fetch-depth: ${{ inputs.nx_affected && 0 || 1 }}

      - name: Configure AWS credentials
        if: inputs.codeartifact_domain != ''
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@v2
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: ci-node

      - name: Setup Node and install dependencies
        uses: Ennovative-Genix/sgx-github-actions/actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          package-manager: ${{ inputs.package_manager }}
          working-directory: ${{ inputs.app_path }}
          codeartifact-domain: ${{ inputs.codeartifact_domain }}
          codeartifact-repository: ${{ inputs.codeartifact_repository }}
          codeartifact-domain-owner: ${{ inputs.codeartifact_domain_owner }}
          codeartifact-region: ${{ inputs.aws_region }}
          codeartifact-namespace: ${{ inputs.codeartifact_namespace }}

      - name: Resolve scripts
        id: scripts
        working-directory: ${{ inputs.app_path }}
        env:
          FRAMEWORK: ${{ inputs.framework }}
          TARGET_ENV: ${{ inputs.target_env }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          TEST_ARGS: ${{ inputs.test_args }}
        run: |
          set -euo pipefail

          has_script() {
            node -e "const s=require('./package.json').scripts||{};process.exit(s['$1']?0:1)" 2>/dev/null
          }

          # Explicit override wins, then an environment-specific script, then plain build.
          if [ -n "$BUILD_SCRIPT" ]; then
            build="$BUILD_SCRIPT"
          elif [ -n "$TARGET_ENV" ] && has_script "build:${TARGET_ENV}"; then
            build="build:${TARGET_ENV}"
          else
            build="build"
          fi

          test_args="$TEST_ARGS"
          if [ -z "$test_args" ] && [ "$FRAMEWORK" = "angular" ]; then
            # The Angular CLI defaults to watch mode, which never returns on CI.
            test_args="--watch=false --browsers=ChromeHeadless"
          fi

          {
            echo "build=$build"
            echo "test-args=$test_args"
          } >> "$GITHUB_OUTPUT"

          echo "Build script: $build"

      - name: Resolve Nx base
        id: nx
        if: inputs.framework == 'nx' && inputs.nx_affected
        env:
          NX_BASE: ${{ inputs.nx_base }}
        run: |
          set -euo pipefail

          if [ -n "$NX_BASE" ]; then
            base="$NX_BASE"
          elif [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="origin/${GITHUB_BASE_REF}"
            git fetch --no-tags --depth=0 origin "$GITHUB_BASE_REF"
          else
            base="HEAD~1"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Nx comparing against $base"

      - name: Lint
        if: inputs.run_lint && inputs.framework != 'nx'
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.lint_script }} --if-present

      - name: Test
        if: inputs.run_test && inputs.framework != 'nx'
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.test_script }} --if-present -- ${{ steps.scripts.outputs.test-args }}

      - name: Build
        if: inputs.run_build && inputs.framework != 'nx'
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ steps.scripts.outputs.build }}

      - name: Nx run targets
        if: inputs.framework == 'nx'
        working-directory: ${{ inputs.app_path }}
        env:
          NX_TARGETS: ${{ inputs.nx_targets }}
          NX_BASE: ${{ steps.nx.outputs.base }}
          NX_AFFECTED: ${{ inputs.nx_affected }}
        run: |
          set -euo pipefail

          IFS=',' read -ra targets <<< "$NX_TARGETS"
          for target in "${targets[@]}"; do
            target="$(echo "$target" | xargs)"
            [ -z "$target" ] && continue

            if [ "$NX_AFFECTED" = "true" ]; then
              echo "::group::nx affected -t $target"
              npx nx affected -t "$target" --base="$NX_BASE" --head=HEAD
            else
              echo "::group::nx run-many -t $target"
              npx nx run-many -t "$target" --all
            fi
            echo "::endgroup::"
          done

      - name: Upload build output
        if: inputs.artifact_name != '' && inputs.run_build
        uses: actions/upload-artifact@v4
        with:
          # Matrix builds would otherwise race to write the same artifact name.
          name: ${{ inputs.artifact_name }}-node${{ matrix.node-version }}
          path: ${{ inputs.app_path }}/${{ inputs.artifact_path }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
