name: Sync secret from AWS Secrets Manager to Kubernetes
on:
  workflow_call:
    inputs:
      namespace:
        description: "Kubernetes namespace"
        required: false
        type: string
        default: "namespace-dev"
      region:
        description: "AWS region"
        required: false
        type: string
        default: "ap-south-1"
      k8s_secret_name:
        description: "Kubernetes secret name"
        required: true
        type: string
      k8s_api_host:
        description: "Kubernetes API host"
        required: true
        type: string
      k8s_tunnel_local_port:
        description: "Local port for SSM tunnel"
        required: true
        type: string
jobs:
  sync-secrets:
    name: Sync ${K8S_SECRET_NAME} from AWS SM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      DEV_KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}
      K8S_INSTANCE_ID: ${{ secrets.K8S_INSTANCE_ID }}
      AWS_SECRETS_ARN: ${{ secrets.AWS_SECRETS_ARN }}
      AWS_REGION: ${{inputs.region}}
      NAMESPACE: ${{ inputs.namespace }}
      K8S_SECRET_NAME: ${{ inputs.k8s_secret_name }}
      K8S_API_HOST: ${{ inputs.k8s_api_host }}
      K8S_TUNNEL_LOCAL_PORT: ${{ inputs.k8s_tunnel_local_port }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets are configured
        run: |
          if [ -z "${AWS_SECRETS_ARN}" ]; then
            echo "::error::AWS_SECRETS_ARN repo secret is required to sync ${K8S_SECRET_NAME}"
            exit 1
          fi
          if [ -z "${DEV_KUBE_CONFIG}" ]; then
            echo "::error::DEV_KUBE_CONFIG repo secret is required"
            exit 1
          fi
          if [ -z "${K8S_INSTANCE_ID}" ]; then
            echo "::error::K8S_INSTANCE_ID repo secret is required for SSM tunnel"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-SyncSecrets-${{ github.run_id }}

      - name: Fetch secret from AWS Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "${AWS_SECRETS_ARN}" \
            --region ap-south-1 \
            --query SecretString \
            --output text > ${K8S_SECRET_NAME}.raw.env

      - name: Prepare clean env file for Kubernetes
        run: |
          set -euo pipefail

          CONFIGMAP_KEYS='^(APP_ENV|PORT|EXPIRES_IN|CF_BUCKET_NAME)$'
          : > ${K8S_SECRET_NAME}.env

          normalize_value() {
            local v="$1"
            v="$(echo "$v" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ "$v" =~ ^\"(.*)\"$ ]]; then v="${BASH_REMATCH[1]}"; fi
            if [[ "$v" =~ ^\'(.*)\'$ ]]; then v="${BASH_REMATCH[1]}"; fi
            printf '%s' "$v"
          }

          while IFS= read -r line || [ -n "$line" ]; do
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ "$line" != *"="* ]] && continue

            key="${line%%=*}"
            value="${line#*=}"
            key="$(echo "$key" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            value="$(normalize_value "$value")"

            [[ -z "$key" ]] && continue
            [[ -z "$value" ]] && continue
            echo "$key" | grep -Eq "$CONFIGMAP_KEYS" && continue
            echo "$key" | grep -Eq '^[-._a-zA-Z][-._a-zA-Z0-9]*$' || continue

            printf '%s=%s\n' "$key" "$value" >> ${K8S_SECRET_NAME}.env
          done < ${K8S_SECRET_NAME}.raw.env

          if [ ! -s ${K8S_SECRET_NAME}.env ]; then
            echo "::error::No valid KEY=VALUE entries found after filtering ${K8S_SECRET_NAME}.raw.env"
            exit 1
          fi

          echo "Prepared $(wc -l < ${K8S_SECRET_NAME}.env) env entries for ${K8S_SECRET_NAME}"
          echo "Synced keys: $(cut -d= -f1 ${K8S_SECRET_NAME}.env | paste -sd, -)"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Start SSM tunnel to kube-apiserver
        run: |
          set -euo pipefail

          curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            -o /tmp/session-manager-plugin.deb

          sudo dpkg -i /tmp/session-manager-plugin.deb

          session-manager-plugin --version

          echo "Tunneling ${K8S_API_HOST}:6443 -> 127.0.0.1:${K8S_TUNNEL_LOCAL_PORT}"

          nohup aws ssm start-session \
            --target "$K8S_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"${K8S_API_HOST}\"],\"portNumber\":[\"6443\"],\"localPortNumber\":[\"${K8S_TUNNEL_LOCAL_PORT}\"]}" \
            >/tmp/ssm-k8s-tunnel.log 2>&1 &

          echo $! >/tmp/ssm-k8s-tunnel.pid

          echo "Waiting for SSM tunnel..."

          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/${K8S_TUNNEL_LOCAL_PORT}) >/dev/null 2>&1; then
              echo "Tunnel ready"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/ssm-k8s-tunnel.pid)" 2>/dev/null; then
              echo "::error::Tunnel process exited"
              cat /tmp/ssm-k8s-tunnel.log
              exit 1
            fi

            sleep 1
          done

          echo "::error::Timeout waiting for tunnel"
          cat /tmp/ssm-k8s-tunnel.log
          exit 1

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube

          echo "$DEV_KUBE_CONFIG" | base64 -d > ~/.kube/config

          chmod 600 ~/.kube/config

          kubectl config unset clusters.kubernetes.certificate-authority-data

          kubectl config set-cluster kubernetes \
            --server=https://127.0.0.1:${K8S_TUNNEL_LOCAL_PORT} \
            --insecure-skip-tls-verify=true

      - name: Apply Kubernetes secret
        run: |
          kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1 || \
            kubectl create namespace "${NAMESPACE}"

          kubectl create secret generic "${K8S_SECRET_NAME}" \
            --namespace "${NAMESPACE}" \
            --from-env-file=${K8S_SECRET_NAME}.env \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMap and Ingress
        run: |
          kubectl apply -f k8s/server/configmap.yaml -n "${NAMESPACE}"
          kubectl apply -f k8s/server/ingress.yaml -n "${NAMESPACE}"

      - name: Cleanup local env files
        if: always()
        run: rm -f ${K8S_SECRET_NAME}.raw.env ${K8S_SECRET_NAME}.env
