# Reusable: Nova branch-name / main-target guards.
#
#   jobs:
#     guards:
#       uses: Ennovative-Genix/sgx-github-actions/.github/workflows/branching-guards.yml@chore/branching-strategy

name: Branching — branch guards

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  guards:
    name: Branch name and target checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Branch guards
        uses: Ennovative-Genix/sgx-github-actions/branching/branch-guards@chore/branching-strategy
        with:
          head-ref: ${{ github.head_ref }}
          base-ref: ${{ github.base_ref }}
          pr-url: ${{ github.event.pull_request.html_url }}
