on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, uat, stg, prod)"
        required: true
        type: string
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24.x"
      docker_image_name:
        description: "Docker image name"
        required: true
        type: string
      s3_path:
        description: "S3 path prefix for uploads"
        required: true
        type: string
      app_path:
        description: "Path to the application directory (relative to repo root). Defaults to root."
        required: false
        type: string
        default: "."
      is_ui_app:
        description: "Whether the app is a UI app"
        required: false
        type: boolean
        default: false
      codeartifact_domain:
        description: "CodeArtifact domain to authenticate against, so package installs inside the Docker build can reach it. Empty disables CodeArtifact auth entirely."
        required: false
        type: string
        default: ""
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain. Defaults to the calling account."
        required: false
        type: string
        default: ""
      codeartifact_region:
        description: "Region the CodeArtifact domain lives in. Defaults to the region this build deploys to, which is only right when the domain is replicated per region."
        required: false
        type: string
        default: "ap-south-1"
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication"
        required: true

jobs:
  build-docker-upload:
    name: Build Project, Docker Image and Upload to S3
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      # release → us-east-1,refactor, staging, main (prod) → us-east-1, dev → ap-south-1
      AWS_REGION: ${{ startsWith(github.ref_name, 'release/') && 'us-east-1' || (github.ref_name == 'main') && 'us-east-1' || (github.ref_name == 'refactor') && 'us-east-1' || (github.ref_name == 'staging') && 'us-east-1' || 'ap-south-1' }}
      S3_BUILD_BUCKET: ${{ vars.S3_BUILD_BUCKET }}
      TARGET_ENV: ${{ inputs.environment }}
      APP_PATH: ${{ inputs.app_path }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS Credentials for CodeArtifact (OIDC)
        if: inputs.codeartifact_domain != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ inputs.codeartifact_region != '' && inputs.codeartifact_region || env.AWS_REGION }}
          role-session-name: GitHubActions-Build-CodeArtifact-${{ github.run_id }}

      - name: CodeArtifact token generation
        if: inputs.codeartifact_domain != ''
        uses: Ennovative-Genix/sgx-github-actions/actions/codeartifact-token@development
        with:
          domain: ${{ inputs.codeartifact_domain }}
          domain-owner: ${{ inputs.codeartifact_domain_owner }}

      - name: Docker build ${{ inputs.is_ui_app && 'client' || 'server' }}
        working-directory: ${{ env.APP_PATH }}
        env:
          IMAGE_NAME: ${{ inputs.docker_image_name }}
          DOCKERFILE: ${{ inputs.is_ui_app && 'Dockerfile.client' || 'Dockerfile.server' }}
        run: |
          set -euo pipefail

          args=(--build-arg "ENV=${TARGET_ENV}" -f "$DOCKERFILE" -t "${IMAGE_NAME}:latest")

          if [ -n "${CODEARTIFACT_AUTH_TOKEN:-}" ]; then
            args+=(--secret "id=codeartifact,env=CODEARTIFACT_AUTH_TOKEN")
          fi

          DOCKER_BUILDKIT=1 docker build "${args[@]}" .
          echo "Docker image ${IMAGE_NAME}:latest built from ${DOCKERFILE}"

      - name: Save Docker image to tarball
        run: |
          docker save ${{ inputs.docker_image_name }}:latest | gzip > ${{ inputs.docker_image_name }}-latest.tar.gz
          ls -lh ${{ inputs.docker_image_name }}-latest.tar.gz

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Build-Upload-${{ github.run_id }}

      - name: Upload "latest" to S3 (STANDARD)
        run: |
          aws s3 cp ${{ inputs.docker_image_name }}-latest.tar.gz s3://${{ env.S3_BUILD_BUCKET }}/${{ inputs.s3_path }}/latest.tar.gz --region ${{ env.AWS_REGION }} --storage-class STANDARD

      - name: Upload "sha" to S3 (GLACIER_IR)
        run: |
          aws s3 cp ${{ inputs.docker_image_name }}-latest.tar.gz s3://${{ env.S3_BUILD_BUCKET }}/${{ inputs.s3_path }}/${{ github.sha }}.tar.gz --region ${{ env.AWS_REGION }} --storage-class GLACIER_IR
