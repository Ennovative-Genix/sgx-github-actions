name: Publish - npm

on:
  workflow_call:
    inputs:
      app_path:
        description: "Working directory for the Node.js application."
        required: false
        type: string
        default: "."
      package_directory:
        description: "Directory holding the package.json that gets versioned and published, relative to the repository root. In a workspace this is the library, not the repository root."
        required: false
        type: string
        default: "."
      run_ci:
        description: "Lint, test and build before publishing."
        required: false
        type: boolean
        default: true
      environment:
        description: "GitHub environment used for a release. Protect this one."
        required: false
        type: string
        default: "prod"
      codeartifact_domain:
        description: "CodeArtifact domain to publish into."
        required: true
        type: string
      codeartifact_repository:
        description: "CodeArtifact repository to publish into."
        required: true
        type: string
      codeartifact_namespace:
        description: "npm scope bound to CodeArtifact, without the leading @."
        required: false
        type: string
        default: ""
      aws_region:
        description: "AWS region where the CodeArtifact domain lives."
        required: true
        type: string
      node_version:
        description: "Node version used to publish."
        required: false
        type: string
        default: "24.x"
      build_script:
        description: "Script run before publishing. Empty publishes without building."
        required: false
        type: string
        default: "build"
      test_script:
        description: "npm script used for testing. Empty skips testing."
        required: false
        type: string
        default: "test"
      lint_script:
        description: "npm script used for linting. Empty skips linting."
        required: false
        type: string
        default: ""
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: ["${{ inputs.node_version }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        id: aws
        if: inputs.codeartifact_domain != ''
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@development
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: ci-node

      - name: Setup Node and install dependencies
        id: node
        uses: Ennovative-Genix/sgx-github-actions/actions/setup-node@development
        with:
          node-version: ${{ matrix.node-version }}
          working-directory: ${{ inputs.app_path }}
          codeartifact-domain: ${{ inputs.codeartifact_domain }}
          codeartifact-repository: ${{ inputs.codeartifact_repository }}
          codeartifact-domain-owner: ${{ steps.aws.outputs.account-id }}
          codeartifact-region: ${{ steps.aws.outputs.region }}
          codeartifact-namespace: ${{ inputs.codeartifact_namespace }}

      - name: Compute version
        id: version
        uses: Ennovative-Genix/sgx-github-actions/actions/compute-version@development
        with:
          working-directory: ${{ inputs.package_directory }}
          environment: ${{ inputs.environment }}

      - name: Lint
        if: inputs.lint_script != ''
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.lint_script }} --if-present

      - name: Test
        if: inputs.test_script != ''
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.test_script }} --if-present

      - name: Build
        if: inputs.build_script != ''
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.build_script }}

      # Versioning and publishing both belong to the package, not to the app that
      # was built. In a workspace those are different directories, and running
      # them at the repository root silently versions and publishes the root
      # manifest instead.
      - name: Set package version
        working-directory: ${{ inputs.package_directory }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: ${{ inputs.package_directory }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.node.outputs.registry-endpoint }}
          NAMESPACE: ${{ inputs.codeartifact_namespace }}
          PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
        run: |
          set -euo pipefail

          if [ -z "$REGISTRY" ]; then
            echo "::error title=No registry::CodeArtifact login produced no endpoint; refusing to publish to the default registry."
            exit 1
          fi

          name="$(node -e "process.stdout.write(require('./package.json').name || '')")"
          if [ -z "$name" ]; then
            echo "::error title=No package name::'$(pwd)/package.json' declares no name."
            exit 1
          fi

          # CodeArtifact takes the namespace from the package name alone -- there
          # is no publish-time flag for it. Publishing the wrong package.json is
          # therefore invisible except as a missing namespace, so check before
          # rather than discover it in the repository afterwards.
          if [ -n "$NAMESPACE" ] && [ "${name%%/*}" != "@${NAMESPACE}" ]; then
            echo "::error title=Scope mismatch::'${name}' is not under '@${NAMESPACE}', so it would publish with no '${NAMESPACE}' namespace. package_directory ('${PACKAGE_DIRECTORY}') has to point at the directory holding the package's own package.json."
            exit 1
          fi

          echo "Publishing ${name}@${VERSION} from '${PACKAGE_DIRECTORY}' to ${REGISTRY}"
          npm publish --registry "$REGISTRY"

          {
            echo "### npm package published"
            echo ""
            echo "- Package: \`${name}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Repository: \`${{ inputs.codeartifact_domain }}/${{ inputs.codeartifact_repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
