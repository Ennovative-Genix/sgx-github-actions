name: Publish - npm

on:
  workflow_call:
    inputs:
      app_path:
        description: "Path to the package directory, relative to the repository root."
        required: false
        type: string
        default: "."
      run_ci:
        description: "Lint, test and build before publishing."
        required: false
        type: boolean
        default: true
      environment:
        description: "GitHub environment used for a release. Protect this one."
        required: false
        type: string
        default: "prod"
      codeartifact_domain:
        description: "CodeArtifact domain to publish into."
        required: true
        type: string
      codeartifact_repository:
        description: "CodeArtifact repository to publish into."
        required: true
        type: string
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain."
        required: false
        type: string
        default: ""
      codeartifact_namespace:
        description: "npm scope bound to CodeArtifact, without the leading @."
        required: false
        type: string
        default: ""
      aws_region:
        description: "Region of the CodeArtifact domain. Required, because CI jobs have no environment to read AWS_REGION from."
        required: false
        type: string
        default: ""
      node_version:
        description: "Node version used to publish."
        required: false
        type: string
        default: "24.x"
      build_script:
        description: "Script run before publishing. Empty publishes without building."
        required: false
        type: string
        default: "build"
      test_script:
        description: "npm script used for testing. Empty skips testing."
        required: false
        type: string
        default: "test"
      lint_script:
        description: "npm script used for linting. Empty skips linting."
        required: false
        type: string
        default: ""
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["${{ inputs.node_version }}"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.codeartifact_domain != ''
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@v2
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: ci-node

      - name: Setup Node and install dependencies
        id: node
        uses: Ennovative-Genix/sgx-github-actions/actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          working-directory: ${{ inputs.app_path }}
          codeartifact-domain: ${{ inputs.codeartifact_domain }}
          codeartifact-repository: ${{ inputs.codeartifact_repository }}
          codeartifact-domain-owner: ${{ inputs.codeartifact_domain_owner }}
          codeartifact-region: ${{ inputs.aws_region }}
          codeartifact-namespace: ${{ inputs.codeartifact_namespace }}

      - name: Compute version
        id: version
        uses: Ennovative-Genix/sgx-github-actions/actions/compute-version@v2
        with:
          working-directory: ${{ inputs.app_path }}
          environment: ${{ inputs.environment }}

      - name: Lint
        if: inputs.lint_script != ''
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.lint_script }} --if-present

      - name: Test
        if: inputs.test_script != ''
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.test_script }} --if-present

      - name: Build
        working-directory: ${{ inputs.app_path }}
        run: npm run ${{ inputs.build_script }}

      - name: Set package version
        working-directory: ${{ inputs.app_path }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: ${{ inputs.app_path }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.node.outputs.registry-endpoint }}
        run: |
          set -euo pipefail

          npm publish --registry "$REGISTRY"

          {
            echo "### npm package published"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Repository: \`${{ inputs.codeartifact_domain }}/${{ inputs.codeartifact_repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
