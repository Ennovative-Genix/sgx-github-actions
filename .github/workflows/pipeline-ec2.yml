name: Pipeline - EC2 via S3

# End-to-end EC2 deployment: build an image, archive it to S3, load it onto the
# instance over SSM, and start it with Compose.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, qa, uat, stg, prod)."
        required: true
        type: string
      docker_image_name:
        description: "Docker image name."
        required: true
        type: string
      s3_path:
        description: "S3 key prefix for uploads and downloads."
        required: true
        type: string
      app_path:
        description: "Path to the application directory, relative to the repository root."
        required: false
        type: string
        default: "."
      port_mapping:
        description: "Host-to-container port mapping, e.g. '8080:8080'. Defaults to the PORT_MAPPING environment variable."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile path, relative to app_path."
        required: false
        type: string
        default: "Dockerfile"
      compose_file:
        description: "Compose file path, relative to app_path."
        required: false
        type: string
        default: "docker-compose.yml"
      build_args:
        description: "Extra build arguments, one KEY=value per line."
        required: false
        type: string
        default: ""
      aws_region:
        description: "Region override. Defaults to the AWS_REGION environment variable on the target environment."
        required: false
        type: string
        default: ""
      secrets_region:
        description: "Region holding the Secrets Manager secret. Only needed when secrets live in a different region from the workload."
        required: false
        type: string
        default: ""
      health_check_url:
        description: "URL curled on the instance after start-up. Leave empty to skip."
        required: false
        type: string
        default: ""
      version_strategy:
        description: "Passed to compute-version: auto, tag, manifest or run-number."
        required: false
        type: string
        default: "auto"
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
      EC2_INSTANCE_ID:
        description: "Target EC2 Instance ID."
        required: true
      AWS_SECRETS_ARN:
        description: "Secrets Manager ARN holding the .env contents."
        required: false
    outputs:
      version:
        description: "Version deployed. Pass this to rollback-ec2.yml to return to this build."
        value: ${{ jobs.build-and-upload.outputs.version }}
      rollback_key:
        description: "S3 key of the archived image for this run."
        value: ${{ jobs.build-and-upload.outputs.version_key }}

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build and Upload
    uses: ./.github/workflows/build-docker-s3.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ inputs.environment }}
      docker_image_name: ${{ inputs.docker_image_name }}
      s3_path: ${{ inputs.s3_path }}
      app_path: ${{ inputs.app_path }}
      dockerfile: ${{ inputs.dockerfile }}
      build_args: ${{ inputs.build_args }}
      aws_region: ${{ inputs.aws_region }}
      version_strategy: ${{ inputs.version_strategy }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  load-docker-image:
    name: Load Image onto EC2
    needs: build-and-upload
    uses: ./.github/workflows/deploy-ec2-load-docker.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ inputs.environment }}
      docker_image_name: ${{ inputs.docker_image_name }}
      s3_path: ${{ inputs.s3_path }}
      aws_region: ${{ inputs.aws_region }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

  start-container:
    name: Start Container on EC2
    needs: load-docker-image
    uses: ./.github/workflows/deploy-ec2-start-container.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ inputs.environment }}
      docker_image_name: ${{ inputs.docker_image_name }}
      port_mapping: ${{ inputs.port_mapping }}
      app_path: ${{ inputs.app_path }}
      compose_file: ${{ inputs.compose_file }}
      aws_region: ${{ inputs.aws_region }}
      secrets_region: ${{ inputs.secrets_region }}
      health_check_url: ${{ inputs.health_check_url }}
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      AWS_SECRETS_ARN: ${{ secrets.AWS_SECRETS_ARN }}
