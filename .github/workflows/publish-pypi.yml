name: Publish - PyPI

on:
  workflow_call:
    inputs:
      app_path:
        description: "Path to the package directory, relative to the repository root."
        required: false
        type: string
        default: "."
      environment:
        description: "GitHub environment used for a release. Protect this one."
        required: false
        type: string
        default: "prod"
      codeartifact_domain:
        description: "CodeArtifact domain to publish into."
        required: true
        type: string
      codeartifact_repository:
        description: "CodeArtifact repository to publish into."
        required: true
        type: string
      codeartifact_domain_owner:
        description: "AWS account id owning the CodeArtifact domain."
        required: false
        type: string
        default: ""
      aws_region:
        description: "Region of the CodeArtifact domain. Required, because CI jobs have no environment to read AWS_REGION from."
        required: false
        type: string
        default: ""
      python_version:
        description: "Python version used to publish."
        required: false
        type: string
        default: "3.12"
      requirements_file:
        description: "Requirements file installed when the project has no pyproject.toml or setup.py."
        required: false
        type: string
        default: "requirements.txt"
      extras:
        description: "Optional dependency group installed with the project, e.g. 'dev'. Set this when lint_command or test_command needs tooling the project does not depend on at runtime."
        required: false
        type: string
        default: ""
      lint_command:
        description: "Shell command used for linting, e.g. 'ruff check .'. Empty skips linting."
        required: false
        type: string
        default: ""
      test_command:
        description: "Shell command used for testing, e.g. 'pytest'. Empty skips testing."
        required: false
        type: string
        default: ""
    secrets:
      IAM_ROLE_ARN:
        description: "AWS IAM Role ARN for OIDC authentication."
        required: true
    outputs:
      version:
        description: "The version that was published."
        value: ${{ jobs.build.outputs.version }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Binds the approval rules and the environment-scoped AWS_REGION variable
    # that aws-oidc-auth falls back to.
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["${{ inputs.python_version }}"]

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws
        uses: Ennovative-Genix/sgx-github-actions/actions/aws-oidc-auth@development
        with:
          role-arn: ${{ secrets.IAM_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
          fallback-region: ${{ vars.AWS_REGION }}
          session-name: ci-python

      - name: Setup Python and install dependencies
        uses: Ennovative-Genix/sgx-github-actions/actions/setup-python@development
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: ${{ inputs.app_path }}
          requirements-file: ${{ inputs.requirements_file }}
          extras: ${{ inputs.extras }}
          codeartifact-domain: ${{ inputs.codeartifact_domain }}
          codeartifact-repository: ${{ inputs.codeartifact_repository }}
          codeartifact-domain-owner: ${{ inputs.codeartifact_domain_owner }}
          codeartifact-region: ${{ steps.aws.outputs.region }}

      - name: Compute version
        id: version
        uses: Ennovative-Genix/sgx-github-actions/actions/compute-version@development
        with:
          working-directory: ${{ inputs.app_path }}
          environment: ${{ inputs.environment }}

      # Python has no equivalent of `npm run --if-present`, so both commands are
      # opt-in rather than defaulted to a name the project may not define.
      - name: Lint
        if: inputs.lint_command != ''
        working-directory: ${{ inputs.app_path }}
        run: ${{ inputs.lint_command }}

      - name: Test
        if: inputs.test_command != ''
        working-directory: ${{ inputs.app_path }}
        run: ${{ inputs.test_command }}

      # Ahead of the build, not after it: the version has to be in the manifest
      # before the sdist and the wheel are named from it.
      - name: Set package version
        working-directory: ${{ inputs.app_path }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")

          if not path.exists():
              print("::warning title=No pyproject.toml::Skipping version rewrite; the build will use whatever the project declares.")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          if re.search(r'(?m)^dynamic\s*=\s*\[[^\]]*["\']version["\']', text):
              print("::notice title=Dynamic version::pyproject.toml declares a dynamic version; leaving it to the build backend.")
              raise SystemExit(0)

          # Only the first `version = "..."` is the package version. Dependency
          # pins further down the file use the same syntax, so the count matters.
          text, replaced = re.subn(
              r'(?m)^(version\s*=\s*)["\'][^"\']*["\']',
              lambda match: f'{match.group(1)}"{version}"',
              text,
              count=1,
          )

          if replaced == 0:
              raise SystemExit('No \'version = "..."\' line found in pyproject.toml')

          path.write_text(text, encoding="utf-8")
          print(f"pyproject.toml version set to {version}")
          PY

      - name: Build distribution
        working-directory: ${{ inputs.app_path }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade build twine

          # A stale dist/ would be uploaded alongside the new artefacts.
          rm -rf dist

          python -m build
          twine check dist/*

      # Deliberately last: the token is only needed for the upload, so this
      # keeps its lifetime inside the job as short as the steps allow.
      - name: Authenticate twine against CodeArtifact
        uses: Ennovative-Genix/sgx-github-actions/actions/codeartifact-login@development
        with:
          tool: twine
          domain: ${{ inputs.codeartifact_domain }}
          repository: ${{ inputs.codeartifact_repository }}
          domain-owner: ${{ inputs.codeartifact_domain_owner }}
          region: ${{ steps.aws.outputs.region }}

      - name: Publish
        working-directory: ${{ inputs.app_path }}
        run: |
          set -euo pipefail

          if [ -z "${TWINE_REPOSITORY_URL:-}" ]; then
            echo "::error title=No repository URL::CodeArtifact login produced no endpoint; refusing to publish to public PyPI."
            exit 1
          fi

          twine upload dist/*

      - name: Summarise
        if: always() && steps.version.outcome == 'success'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Python package published"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Repository: \`${{ inputs.codeartifact_domain }}/${{ inputs.codeartifact_repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
