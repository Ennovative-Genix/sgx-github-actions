# Reusable: open / refresh main → development and main → open release/* PRs.
# Caller keeps triggers; never auto-merges.
#
#   jobs:
#     backmerge:
#       uses: Ennovative-Genix/sgx-github-actions/.github/workflows/branching-backmerge-main.yml@chore/branching-strategy

name: Branching — back-merge from main

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  backmerge:
    name: Open / update back-merge PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Back-merge from main
        uses: Ennovative-Genix/sgx-github-actions/branching/backmerge-main@chore/branching-strategy
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
