name: Build Docker and Push to ECR

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string

      docker_image_name:
        description: "Docker image name"
        required: true
        type: string

      ecr_repository:
        description: "ECR repository name"
        required: true
        type: string

      app_path:
        description: "Application path"
        required: false
        type: string
        default: "."

    secrets:
      IAM_ROLE_ARN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    env:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      APP_PATH: ${{ inputs.app_path }}

      AWS_REGION: ${{ startsWith(github.ref_name, 'release/') && 'us-east-1' || (github.ref_name == 'main') && 'us-east-1' || 'ap-south-1' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-ECR-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c

      - name: Build Docker Image
        working-directory: ${{ env.APP_PATH }}
        run: |
          docker build \
            --build-arg ENV=${{ inputs.environment }} \
            -t ${{ inputs.docker_image_name }}:latest .

      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ inputs.docker_image_name }}:latest \
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest

          docker tag \
            ${{ inputs.docker_image_name }}:latest \
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}

      - name: Push Latest Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest

      - name: Push Commit SHA Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}

      - name: Print Image Details
        run: |
          echo "Registry         : ${{ steps.login-ecr.outputs.registry }}"
          echo "Latest Image URI : ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest"
          echo "SHA Image URI    : ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ github.sha }}"