name: "Docker Build"
description: "Build a container image with Buildx and a shared layer cache, then optionally load it locally or push it to a registry."

inputs:
  image-name:
    description: "Image name without registry or tag, e.g. 'billing-api'."
    required: true
  tags:
    description: "Tags to apply, one per line. Combined with `registry` and `image-name` to form full references."
    required: false
    default: "latest"
  registry:
    description: "Registry host to prefix tags with, e.g. an ECR registry. Leave empty to build a local-only image."
    required: false
    default: ""
  context:
    description: "Build context directory."
    required: false
    default: "."
  dockerfile:
    description: "Path to the Dockerfile, relative to the build context."
    required: false
    default: "Dockerfile"
  build-args:
    description: "Build arguments, one KEY=value per line."
    required: false
    default: ""
  target:
    description: "Dockerfile stage to stop at, for multi-stage builds."
    required: false
    default: ""
  platforms:
    description: "Target platforms. Multi-platform builds cannot be loaded into the local daemon."
    required: false
    default: "linux/amd64"
  push:
    description: "Push to the registry after building."
    required: false
    default: "false"
  load:
    description: "Load the result into the local Docker daemon. Required before `docker save`."
    required: false
    default: "false"
  cache:
    description: "Use the GitHub Actions layer cache."
    required: false
    default: "true"
  provenance:
    description: "Attach a provenance attestation. Off by default because it produces a manifest list, which `docker save` and Lambda do not accept."
    required: false
    default: "false"

outputs:
  image-ref:
    description: "The first fully qualified image reference that was built."
    value: ${{ steps.tags.outputs.primary }}
  tags:
    description: "All fully qualified references, newline separated."
    value: ${{ steps.tags.outputs.tags }}
  digest:
    description: "Image digest. Only populated when the image was pushed."
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Resolve image tags
      id: tags
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        RAW_TAGS: ${{ inputs.tags }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail

        prefix="$IMAGE_NAME"
        if [ -n "$REGISTRY" ]; then
          prefix="${REGISTRY%/}/${IMAGE_NAME}"
        fi

        tags=""
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          # Docker tags allow [A-Za-z0-9_.-] only; normalise anything else.
          safe_tag="$(printf '%s' "$tag" | tr -c 'A-Za-z0-9_.-' '-')"
          tags="${tags}${prefix}:${safe_tag}"$'\n'
        done <<< "$RAW_TAGS"

        tags="${tags%$'\n'}"
        primary="$(printf '%s' "$tags" | head -n1)"

        if [ -z "$primary" ]; then
          echo "::error title=No tags::At least one tag is required."
          exit 1
        fi

        {
          echo "primary=$primary"
          echo "tags<<__TAGS__"
          echo "$tags"
          echo "__TAGS__"
        } >> "$GITHUB_OUTPUT"

        echo "Building: $tags"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        tags: ${{ steps.tags.outputs.tags }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        provenance: ${{ inputs.provenance }}
        # Scoping the cache per image stops one application evicting another's layers.
        cache-from: ${{ inputs.cache == 'true' && format('type=gha,scope={0}', inputs.image-name) || '' }}
        cache-to: ${{ inputs.cache == 'true' && format('type=gha,mode=max,scope={0}', inputs.image-name) || '' }}
