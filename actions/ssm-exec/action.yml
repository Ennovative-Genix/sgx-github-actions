name: "SSM Exec"
description: "Run shell commands on an EC2 instance through AWS SSM and block until they finish."

inputs:
  instance-id:
    description: "Target EC2 instance id."
    required: true
  region:
    description: "AWS region the instance lives in."
    required: true
  commands:
    description: "Shell commands to run. One command per line; blank lines are dropped."
    required: true
  step-name:
    description: "Human readable label used in logs and the job summary."
    required: true
  working-directory:
    description: "Directory to run the commands from on the instance."
    required: false
    default: ""
  max-attempts:
    description: "How many times to poll for completion before giving up."
    required: false
    default: "60"
  poll-interval:
    description: "Seconds to wait between polls."
    required: false
    default: "10"
  continue-on-error:
    description: "Report failure without failing the step. Use for best-effort cleanup."
    required: false
    default: "false"

outputs:
  command-id:
    description: "SSM command id, useful for follow-up queries."
    value: ${{ steps.exec.outputs.command-id }}
  status:
    description: "Terminal SSM status (Success, Failed, Cancelled, TimedOut)."
    value: ${{ steps.exec.outputs.status }}

runs:
  using: composite
  steps:
    - name: ${{ inputs.step-name }}
      id: exec
      shell: bash
      env:
        SSM_INSTANCE_ID: ${{ inputs.instance-id }}
        SSM_REGION: ${{ inputs.region }}
        SSM_COMMANDS: ${{ inputs.commands }}
        SSM_STEP_NAME: ${{ inputs.step-name }}
        SSM_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SSM_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        SSM_POLL_INTERVAL: ${{ inputs.poll-interval }}
        SSM_CONTINUE_ON_ERROR: ${{ inputs.continue-on-error }}
      run: bash "$GITHUB_ACTION_PATH/ssm-exec.sh"
