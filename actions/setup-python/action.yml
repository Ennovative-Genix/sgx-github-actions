name: "Setup Python"
description: "Install Python with pip caching, optionally authenticate pip against CodeArtifact, and install dependencies."

inputs:
  python-version:
    description: "Python version to install."
    required: false
    default: "3.12"
  working-directory:
    description: "Directory holding requirements.txt or pyproject.toml."
    required: false
    default: "."
  install:
    description: "Install project dependencies after setup."
    required: false
    default: "true"
  requirements-file:
    description: "Requirements file to install. Ignored when the project uses pyproject.toml."
    required: false
    default: "requirements.txt"
  extras:
    description: "Optional dependency group to install with a pyproject project, e.g. 'dev'."
    required: false
    default: ""
  cache:
    description: "Cache the pip download cache between runs."
    required: false
    default: "true"
  codeartifact-domain:
    description: "CodeArtifact domain. Leave empty to use PyPI."
    required: false
    default: ""
  codeartifact-repository:
    description: "CodeArtifact repository."
    required: false
    default: ""
  codeartifact-domain-owner:
    description: "AWS account id owning the CodeArtifact domain."
    required: false
    default: ""
  codeartifact-region:
    description: "Region of the CodeArtifact domain."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache == 'true' && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.cache == 'true' && format('{0}/**/{1}', inputs.working-directory, 'requirements*.txt') || '' }}

    - name: Authenticate pip against CodeArtifact
      if: inputs.codeartifact-domain != ''
      uses: Ennovative-Genix/sgx-github-actions/actions/codeartifact-login@main
      with:
        tool: pip
        domain: ${{ inputs.codeartifact-domain }}
        repository: ${{ inputs.codeartifact-repository }}
        domain-owner: ${{ inputs.codeartifact-domain-owner }}
        region: ${{ inputs.codeartifact-region }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        EXTRAS: ${{ inputs.extras }}
      run: |
        set -euo pipefail

        python -m pip install --upgrade pip

        if [ -f pyproject.toml ]; then
          if [ -n "$EXTRAS" ]; then
            pip install -e ".[${EXTRAS}]"
          else
            pip install -e .
          fi
        elif [ -f "$REQUIREMENTS_FILE" ]; then
          pip install -r "$REQUIREMENTS_FILE"
        else
          echo "::warning title=No dependency manifest::Neither pyproject.toml nor '$REQUIREMENTS_FILE' was found; skipping install."
        fi
