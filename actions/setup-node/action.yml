name: "Setup Node"
description: "Install Node.js with dependency caching, optionally authenticate npm against CodeArtifact, and install dependencies."

inputs:
  node-version:
    description: "Node.js version to install."
    required: false
    default: "20.x"
  package-manager:
    description: "npm, yarn or pnpm."
    required: false
    default: "npm"
  working-directory:
    description: "Directory holding the lockfile and package.json."
    required: false
    default: "."
  install:
    description: "Run a clean, lockfile-faithful install after setup."
    required: false
    default: "true"
  cache:
    description: "Cache the package manager store between runs."
    required: false
    default: "true"
  codeartifact-domain:
    description: "CodeArtifact domain. Leave empty to use the public registry."
    required: false
    default: ""
  codeartifact-repository:
    description: "CodeArtifact repository."
    required: false
    default: ""
  codeartifact-domain-owner:
    description: "AWS account id owning the CodeArtifact domain."
    required: false
    default: ""
  codeartifact-region:
    description: "Region of the CodeArtifact domain."
    required: false
    default: ""
  codeartifact-namespace:
    description: "npm scope to bind to CodeArtifact, without the leading @."
    required: false
    default: ""

outputs:
  registry-endpoint:
    description: "CodeArtifact npm endpoint that was configured, or empty when publishing to the public registry."
    value: ${{ steps.codeartifact.outputs.endpoint }}

runs:
  using: composite
  steps:
    # pnpm has to be on PATH before setup-node runs, otherwise setup-node cannot
    # locate the store directory it is being asked to cache.
    - name: Install pnpm
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && inputs.package-manager || '' }}
        cache-dependency-path: ${{ inputs.cache == 'true' && format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'npm' && 'package-lock.json' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'pnpm-lock.yaml') || '' }}

    - name: Authenticate npm against CodeArtifact
      id: codeartifact
      if: inputs.codeartifact-domain != ''
      uses: Ennovative-Genix/sgx-github-actions/actions/codeartifact-login@v2
      with:
        tool: npm
        domain: ${{ inputs.codeartifact-domain }}
        repository: ${{ inputs.codeartifact-repository }}
        domain-owner: ${{ inputs.codeartifact-domain-owner }}
        region: ${{ inputs.codeartifact-region }}
        namespace: ${{ inputs.codeartifact-namespace }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail

        case "$PACKAGE_MANAGER" in
          npm)
            # `npm ci` requires a lockfile that agrees with package.json. Fall
            # back rather than fail so a repository mid-migration still builds.
            if [ -f package-lock.json ]; then
              npm ci
            else
              echo "::warning title=No lockfile::package-lock.json is missing; falling back to 'npm install'."
              npm install
            fi
            ;;
          yarn)
            yarn install --frozen-lockfile
            ;;
          pnpm)
            pnpm install --frozen-lockfile
            ;;
          *)
            echo "::error title=Unsupported package manager::'$PACKAGE_MANAGER' is not one of npm, yarn, pnpm."
            exit 1
            ;;
        esac
