name: "Setup Node"
description: "Install Node.js with dependency caching, optionally authenticate npm against CodeArtifact, and install dependencies."

inputs:
  node-version:
    description: "Node.js version to install."
    required: false
    default: "24.x"
  working-directory:
    description: "Directory holding the lockfile and package.json."
    required: false
    default: "."
  install:
    description: "Run a clean, lockfile-faithful install after setup."
    required: false
    default: "true"
  cache:
    description: "Cache the package manager store between runs."
    required: false
    default: "true"
  codeartifact-domain:
    description: "CodeArtifact domain. Leave empty to use the public registry."
    required: false
    default: ""
  codeartifact-repository:
    description: "CodeArtifact repository."
    required: false
    default: ""
  codeartifact-domain-owner:
    description: "AWS account id owning the CodeArtifact domain."
    required: false
    default: ""
  codeartifact-region:
    description: "Region of the CodeArtifact domain."
    required: false
    default: ""
  codeartifact-namespace:
    description: "npm scope to bind to CodeArtifact, without the leading @."
    required: false
    default: ""

outputs:
  registry-endpoint:
    description: "CodeArtifact npm endpoint that was configured, or empty when publishing to the public registry."
    value: ${{ steps.codeartifact.outputs.endpoint }}

runs:
  using: composite
  steps:
    # setup-node hashes `cache-dependency-path` and fails the whole job when the
    # glob resolves to nothing, so the lockfile has to be located before the
    # cache is requested rather than assumed to sit next to package.json.
    - name: Resolve dependency cache
      id: cache
      shell: bash
      env:
        CACHE_ENABLED: ${{ inputs.cache }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        manager=""
        lockfile=""

        if [ "$CACHE_ENABLED" = "true" ]; then
          workdir="${WORKING_DIRECTORY%/}"
          workdir="${workdir:-.}"

          # The repository root is checked last: in an npm workspace the package
          # directory has no lockfile of its own, and the root one is the correct
          # cache key for it.
          for candidate in \
            "$workdir/package-lock.json" \
            "$workdir/npm-shrinkwrap.json" \
            "package-lock.json" \
            "npm-shrinkwrap.json"; do
            if [ -f "$candidate" ]; then
              manager="npm"
              lockfile="$candidate"
              break
            fi
          done

          if [ -n "$lockfile" ]; then
            echo "Caching npm downloads, keyed on '$lockfile'."
          else
            echo "::warning title=Dependency cache disabled::No package-lock.json or npm-shrinkwrap.json under '$workdir' or the repository root; continuing without a dependency cache."
          fi
        fi

        {
          echo "manager=$manager"
          echo "lockfile=$lockfile"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        # Empty disables caching. Anything else has to name a package manager
        # setup-node recognises -- 'true' is rejected as unsupported.
        cache: ${{ steps.cache.outputs.manager }}
        cache-dependency-path: ${{ steps.cache.outputs.lockfile }}

    - name: Authenticate npm against CodeArtifact
      id: codeartifact
      if: inputs.codeartifact-domain != ''
      uses: Ennovative-Genix/sgx-github-actions/actions/codeartifact-token@development
      with:
        domain: ${{ inputs.codeartifact-domain }}
        repository: ${{ inputs.codeartifact-repository }}
        domain-owner: ${{ inputs.codeartifact-domain-owner }}
        region: ${{ inputs.codeartifact-region }}
        namespace: ${{ inputs.codeartifact-namespace }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        # `npm ci` requires a lockfile that agrees with package.json. Fall back
        # rather than fail so a repository mid-migration still builds.
        if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          npm ci
        else
          echo "::warning title=No lockfile::No package-lock.json in '$(pwd)'; falling back to 'npm install'."
          npm install
        fi
