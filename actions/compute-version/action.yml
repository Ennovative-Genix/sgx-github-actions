name: "Compute Version"
description: "Derive a single version string from package.json, the git tag or the run number, so every artifact from one run carries the same identity."

inputs:
  working-directory:
    description: "Directory holding package.json."
    required: false
    default: "."
  environment:
    description: "Target environment. Folded into prerelease versions so dev and prod builds never collide."
    required: false
    default: ""

outputs:
  version:
    description: "Full version string, e.g. 1.4.2 or 1.4.2-dev.87."
    value: ${{ steps.compute.outputs.version }}
  short-sha:
    description: "Seven character commit SHA."
    value: ${{ steps.compute.outputs.short-sha }}

runs:
  using: composite
  steps:
    - name: Compute version
      id: compute
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET_ENV: ${{ inputs.environment }}
      run: |
        set -euo pipefail

        short_sha="${GITHUB_SHA:0:7}"

        read_manifest_version() {
          if [ -f package.json ]; then
            node -e "process.stdout.write(require('./package.json').version || '')" 2>/dev/null || true
          elif [ -f pyproject.toml ]; then
            python3 "$GITHUB_ACTION_PATH/read-pyproject-version.py" 2>/dev/null || true
          fi
        }

        version="$(read_manifest_version)"
        if [ -z "$version" ]; then
          echo "::warning title=No version::Could not read a version from package.json; defaulting to 0.0.0."
          version="0.0.0"
        fi

        {
          echo "version=$version"
          echo "short-sha=$short_sha"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Version"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Version | \`$version\` |"
          echo "| Commit | \`$short_sha\` |"
        } >> "$GITHUB_STEP_SUMMARY"
