apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql.serviceName" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
  selector:
    {{- include "mysql.selectorLabels" . | nindent 4 }}
