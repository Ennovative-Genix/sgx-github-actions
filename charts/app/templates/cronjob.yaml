{{- $root := . }}
{{- range .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s" (include "app.fullname" $root) .name | trunc 52 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" $root | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  {{- with .timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .concurrencyPolicy | default "Forbid" }}
  {{- with .suspend }}
  suspend: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      {{- if hasKey . "backoffLimit" }}
      backoffLimit: {{ .backoffLimit }}
      {{- end }}
      {{- with .activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        spec:
          restartPolicy: {{ .restartPolicy | default "Never" }}
          {{- with $root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .name }}
              image: {{ .image | default (include "app.image" $root) }}
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              {{- with .command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if and .appEnv $root.Values.envFrom.secret }}
              envFrom:
                - secretRef:
                    name: {{ $root.Values.envFrom.secret }}
              {{- end }}
              {{- with .env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
