replicaCount: 1
revisionHistoryLimit: 2
fullnameOverride: ""
nameOverride: ""

image:
  repository: ""
  digest: ""
  tag: ""
  pullPolicy: Always

imagePullSecrets: []

containerPort: 80
# List. Helm replaces lists in overlays, so an overlay `env:` must repeat every entry.
env: []
# Map. Helm merges maps, so overlays can add APP_ENV without repeating env.
extraEnv: {}

envFrom:
  secret: ""
  configMap: ""

configMap:
  enabled: false
  data: {}

strategy: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  path: /
  pathType: Prefix
  # Extra ingress annotations, e.g. ALB actions referenced by prePaths.
  annotations: {}
  # Paths rendered before the main path (ALB evaluates rules in order).
  # Use servicePortName: use-annotation to target an ALB action annotation.
  prePaths: []
  extraPaths: []
  alb:
    groupName: ""
    groupOrder: "1"
    scheme: internet-facing
    targetType: ip
    rewrite:
      enabled: false
      regex: ""
      replace: ""

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

startupProbe: {}

securityContext: {}

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  behavior: {}

pdb:
  enabled: false
  maxUnavailable: 1

# Each entry renders a CronJob named <fullname>-<name>. Image defaults to the app image.
# - name: cleanup
#   schedule: "0 2 * * *"
#   timeZone: Etc/UTC            # optional
#   image: ""                    # optional
#   command: ["python", "-m", "app.cleanup"]
#   args: []
#   appEnv: true                 # optional: mount envFrom.secret
#   env: []
#   resources: {}
#   concurrencyPolicy: Forbid
#   backoffLimit: 2
#   activeDeadlineSeconds: 600
cronJobs: []

affinity: {}
