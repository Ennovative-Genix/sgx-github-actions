name: Branch guards
description: Validate PR head/base branch names against the Nova branching strategy.

inputs:
  head-ref:
    description: PR head branch name
    required: true
  base-ref:
    description: PR base branch name
    required: true
  pr-url:
    description: PR HTML URL (for logs)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate branch names
      shell: bash
      env:
        HEAD_REF: ${{ inputs.head-ref }}
        BASE_REF: ${{ inputs.base-ref }}
        PR_URL: ${{ inputs.pr-url }}
      run: bash "${{ github.action_path }}/branch-guards.sh"
