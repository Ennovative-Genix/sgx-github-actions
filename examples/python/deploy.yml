# Python service deployed as a container-image Lambda, and published to
# CodeArtifact on a tag.
# Copy to .github/workflows/deploy.yml in your application repository.

name: CI/CD

on:
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: CI/CD
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/deploy.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      target: lambda
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      run_ci: true
      ci_language: python
      python_versions: '["3.11", "3.12"]'
      lint_command: "ruff check . && ruff format --check ."
      test_command: "pytest -q --cov"

      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: pypi-store

      function_name: sgx-document-processor-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      ecr_repository: sgx/document-processor
      # Must match the function's configured architecture, or every invocation
      # fails with an exec format error.
      platforms: linux/arm64
      # Publishing a version and moving an alias is what makes rollback-lambda
      # a one-step operation later.
      alias: live
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  publish:
    name: Publish package
    if: startsWith(github.ref, 'refs/tags/v')
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/publish.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      ecosystem: pypi
      python_versions: '["3.11", "3.12"]'
      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: pypi-store
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
