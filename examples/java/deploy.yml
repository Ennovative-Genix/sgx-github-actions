# Java (Maven) service: build and test on a JDK matrix, publish the library to
# CodeArtifact on a tag, deploy the service to EKS.
# Copy to .github/workflows/deploy.yml in your application repository.
#
# For Gradle, set build_tool: gradle throughout.

name: CI/CD

on:
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/ci-java.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      java_versions: '["17", "21"]'
      build_tool: maven
      run_test: true
      artifact_name: service-jar
      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: maven-store
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  publish:
    name: Publish library
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/publish-maven.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      build_tool: maven
      # version_strategy: auto takes the version straight from the git tag.
      version_strategy: auto
      run_test: false
      codeartifact_domain: sgx
      codeartifact_repository: maven-store
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/pipeline-eks.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      ecr_repository: sgx/ledger-service
      cluster_name: sgx-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      namespace: finance
      deploy_method: helm
      helm_chart_path: deploy/chart
      helm_release_name: ledger-service
      helm_values_file: deploy/chart/values-${{ github.ref_name == 'main' && 'prod' || 'dev' }}.yaml
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
