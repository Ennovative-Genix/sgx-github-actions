# Java (Maven) service deployed to EKS with Helm, and published to CodeArtifact
# on a tag.
# Copy to .github/workflows/deploy.yml in your application repository.
#
# For Gradle, set build_tool: gradle in both jobs.

name: CI/CD

on:
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: CI/CD
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/deploy.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      target: eks
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      run_ci: true
      ci_language: java
      java_versions: '["17", "21"]'
      build_tool: maven

      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: maven-store

      ecr_repository: sgx/ledger-service
      cluster_name: sgx-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      namespace: finance
      deploy_method: helm
      helm_chart_path: deploy/chart
      helm_release_name: ledger-service
      helm_values_file: deploy/chart/values-${{ github.ref_name == 'main' && 'prod' || 'dev' }}.yaml
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  publish:
    name: Publish library
    if: startsWith(github.ref, 'refs/tags/v')
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/publish.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      ecosystem: maven
      java_versions: '["17", "21"]'
      build_tool: maven
      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: maven-store
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
