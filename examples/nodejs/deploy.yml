# Node.js service deployed to EC2.
# Copy to .github/workflows/deploy.yml in your application repository.
#
# `mode` defaults to auto: a pull request runs CI only, a push runs CI and
# deploys.

name: CI/CD

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options: [dev, qa, uat, stg, prod]

concurrency:
  # One run per branch. Cancel superseded pull request builds, never cancel a
  # deployment mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: CI/CD
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/deploy.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      target: ec2
      environment: ${{ inputs.environment || (github.ref_name == 'main' && 'prod') || (github.ref_name == 'staging' && 'stg') || 'dev' }}

      run_ci: true
      ci_language: node
      node_versions: '["20.x", "22.x"]'

      docker_image_name: billing-api
      s3_path: billing-api/builds
      health_check_url: http://localhost:8080/health
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      AWS_SECRETS_ARN: ${{ secrets.AWS_SECRETS_ARN }}
