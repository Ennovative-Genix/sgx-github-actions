# Angular application served from S3 behind CloudFront.
# Copy to .github/workflows/deploy.yml in your application repository.
#
# The static target builds and tests inside its own pipeline, so run_ci is not
# needed. A pull request builds and tests without publishing anything.
#
# To serve the app from a container on EC2 instead, switch to target: ec2 and
# supply docker_image_name, s3_path and port_mapping — see examples/nodejs.

name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: CI/CD
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/deploy.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      target: static
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      # framework: angular supplies --watch=false --browsers=ChromeHeadless,
      # without which `ng test` never exits on CI.
      framework: angular
      node_versions: '["20.x"]'

      # Angular 17+ emits dist/<project>/browser; check your angular.json.
      build_output: dist/portal/browser
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
