# React application (Vite) served from S3 behind CloudFront.
# Copy to .github/workflows/deploy.yml in your application repository.

name: CI/CD

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: CI/CD
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/deploy.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      target: static
      environment: ${{ (github.ref_name == 'main' && 'prod') || (github.ref_name == 'staging' && 'stg') || 'dev' }}

      framework: react
      node_versions: '["20.x"]'
      package_manager: pnpm

      # Vite's default; Create React App uses "build".
      build_output: dist
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
