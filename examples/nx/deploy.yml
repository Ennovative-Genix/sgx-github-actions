# Nx monorepo: an application deployed to EKS and a shared library published to
# CodeArtifact.
# Copy to .github/workflows/deploy.yml in your application repository.
#
# Two entry points because these are two different products out of one
# repository: deploy.yml ships the app, publish.yml ships the library.

name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: CI/CD
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/deploy.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      target: eks
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      run_ci: true
      ci_language: node
      framework: nx
      node_versions: '["20.x"]'

      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: npm-store
      codeartifact_namespace: sgx

      ecr_repository: sgx/orders-api
      cluster_name: sgx-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      namespace: orders
      deployment_name: orders-api
      # Built from the Nx-produced dist/, so the Dockerfile is addressed from
      # the workspace root rather than the project directory.
      dockerfile: apps/orders-api/Dockerfile
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  publish-libs:
    name: Publish libraries
    if: github.event_name == 'push' && github.ref_name == 'main'
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/publish.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      ecosystem: npm
      app_path: dist/libs/shared
      # Nx has already built the library into dist/, so there is nothing left
      # for the publish step to build.
      build_script: ""
      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: npm-store
      codeartifact_namespace: sgx
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
