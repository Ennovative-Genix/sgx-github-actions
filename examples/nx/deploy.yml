# Nx monorepo: affected-only CI on pull requests, full build and EKS rollout on
# merge.
# Copy to .github/workflows/deploy.yml in your application repository.

name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests only build what changed. nx_affected sets fetch-depth: 0 and
  # fetches the base branch, without which Nx cannot compute the diff.
  affected:
    name: Affected
    if: github.event_name == 'pull_request'
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/ci-node.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      framework: nx
      node_versions: '["20.x"]'
      nx_affected: true
      nx_targets: "lint,test,build"
      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: npm-store
      codeartifact_namespace: sgx
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  # Merges build the whole workspace, so a project broken by an unrelated change
  # cannot reach a deployable image.
  full:
    name: Full build
    if: github.event_name == 'push'
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/ci-node.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      framework: nx
      node_versions: '["20.x"]'
      nx_affected: false
      nx_targets: "lint,test,build"
      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: npm-store
      codeartifact_namespace: sgx
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  deploy-api:
    name: Deploy API
    needs: full
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/pipeline-eks.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      ecr_repository: sgx/orders-api
      cluster_name: sgx-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      namespace: orders
      deployment_name: orders-api
      # The image is built from the Nx-produced dist/, so the Dockerfile lives
      # beside the workspace root rather than inside the project.
      app_path: .
      dockerfile: apps/orders-api/Dockerfile
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}

  publish-libs:
    name: Publish shared libraries
    needs: full
    if: github.ref_name == 'main'
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/publish-npm.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      app_path: dist/libs/shared
      build_script: ""
      version_strategy: auto
      codeartifact_domain: sgx
      codeartifact_repository: npm-store
      codeartifact_namespace: sgx
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
