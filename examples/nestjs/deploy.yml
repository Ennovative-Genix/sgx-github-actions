# NestJS API inside a monorepo, deployed to EC2, pulling private packages from
# CodeArtifact.
# Copy to .github/workflows/deploy.yml in your application repository.

name: CI/CD

on:
  push:
    branches: [develop, main]
    # Only rebuild when this application or the shared libraries it uses change.
    paths:
      - "packages/api/**"
      - "packages/shared/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "packages/api/**"
      - "packages/shared/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-cd:
    name: CI/CD
    uses: Ennovative-Genix/sgx-github-actions/.github/workflows/deploy.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      target: ec2
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      app_path: packages/api

      run_ci: true
      ci_language: node
      framework: nestjs

      # Private @sgx/* packages resolve through CodeArtifact rather than npmjs.
      # CI jobs have no environment, so the region has to be explicit here.
      aws_region: us-east-1
      codeartifact_domain: sgx
      codeartifact_repository: npm-store
      codeartifact_namespace: sgx

      docker_image_name: orders-api
      s3_path: orders-api/builds
      health_check_url: http://localhost:3000/health
      build_args: |
        NODE_ENV=production
    secrets:
      IAM_ROLE_ARN: ${{ secrets.IAM_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      AWS_SECRETS_ARN: ${{ secrets.AWS_SECRETS_ARN }}
